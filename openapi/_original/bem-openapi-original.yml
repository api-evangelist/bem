  /v3/views:
    get:
      operationId: v3-list-views
      summary: List Views
      description: |-
        **List views in the current environment, optionally filtered by the functions they read from.**

        Views are tabular projections over `transformations` rows: each view names
        one or more functions and a list of columns (JSON-pointer paths into
        `extractedJson`), and produces a uniform table that can be filtered,
        paginated, and aggregated.

        Filters AND together when combined. Pagination is cursor-based on
        `viewID`; default limit is 50, maximum 100.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: functionIDs
          in: query
          required: false
          description: Return only views that read from at least one of the named functions.
          schema:
            type: array
            items:
              type: string
            minItems: 1
          explode: false
        - name: functionNames
          in: query
          required: false
          description: Return only views that read from at least one of the named functions.
          schema:
            type: array
            items:
              type: string
            minItems: 1
          explode: false
        - name: viewIDs
          in: query
          required: false
          description: Return only the specified view IDs.
          schema:
            type: array
            items:
              type: string
            minItems: 1
          explode: false
        - name: sortOrder
          in: query
          required: false
          description: Sort order over view IDs (default `asc`).
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - name: startingAfter
          in: query
          required: false
          description: Cursor — a `viewID` defining your place in the list.
          schema:
            type: string
        - name: endingBefore
          in: query
          required: false
          description: Cursor — a `viewID` defining your place in the list.
          schema:
            type: string
        - name: viewNameSubstring
          in: query
          required: false
          description: Case-insensitive substring search over view names.
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListViewsResponse'
      tags:
        - Views
    post:
      operationId: v3-create-view
      summary: Create a View
      description: |-
        **Create a view.**

        A view is a tabular projection over the `transformations` produced by
        one or more functions. Each column declares a `valueSchemaPath` — a JSON
        Pointer path into the function's output schema — and the view can
        additionally carry filters and aggregations.

        Supported for every function type that produces correctable
        transformations and an output schema: `extract`, `transform`, `analyze`,
        `join`. Extract works on both vision (PDF/PNG/JPEG/HEIC/HEIF/WebP) and
        OCR-routed inputs — the resulting rows surface through views uniformly.

        The new view is created at `versionNum: 1`. Subsequent updates produce
        new versions; the version-1 configuration remains addressable.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/View'
      tags:
        - Views
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewCreateRequest'
  /v3/views/aggregation-data:
    post:
      operationId: v3-generate-view-aggregation-data
      summary: Generate View Aggregation Data
      description: |-
        **Generate aggregation results for a view.**

        Executes each aggregation declared on the view against the
        `transformations` rows produced by the named functions inside the
        supplied `timeWindow`, applying the view's filters. Supported
        aggregation functions: `count`, `count_distinct`, `sum`, `average`,
        `min`, `max`. Grouped aggregations return up to 200 groups per
        aggregation; non-grouped aggregations return a single group with an
        empty `groupName`.

        As with table-data, the `functions` field is required.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewAggregationDataResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
      tags:
        - Views
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewAggregationDataRequest'
  /v3/views/table-data:
    post:
      operationId: v3-generate-view-table-data
      summary: Generate View Table Data
      description: |-
        **Generate paginated table data for a view.**

        Executes the view's query against `transformations` rows produced by the
        named functions inside the supplied `timeWindow`, applies the view's
        filters, and returns matching rows. Each row reports the event
        `eventID` (externally-stable KSUID) plus the projected column values.

        The `functions` field is required — at least one `functionID` or
        `functionName` must be supplied. `limit` defaults to 50 with a maximum
        of 200; `offset` is zero-based. The response's `totalCount` reflects
        the match count before pagination, so paging can be driven off it.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewTableDataResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
      tags:
        - Views
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewTableDataRequest'
  /v3/views/{view_id}:
    delete:
      operationId: v3-delete-view
      summary: Delete a View
      description: |-
        **Delete a view and every one of its versions.**

        Permanent. Any cached data-table or aggregation result clients have
        fetched remains valid, but subsequent calls to
        `POST /v3/views/table-data` or `POST /v3/views/aggregation-data` for
        this view will fail.
      parameters:
        - name: view_id
          in: path
          required: true
          description: Unique identifier of the view to delete.
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
      tags:
        - Views
    get:
      operationId: v3-get-view
      summary: Get a View
      description: |-
        **Retrieve a view by ID.**

        Returns the view's current version. To inspect a historical version,
        fetch the list of versions on the View object and re-request with the
        desired version pinned (versions are immutable once created).
      parameters:
        - name: view_id
          in: path
          required: true
          description: Unique identifier of the view.
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/View'
      tags:
        - Views
    put:
      operationId: v3-update-view
      summary: Update a View
      description: |-
        **Update a view. Updates create a new version.**

        The previous version remains addressable and immutable. The new
        configuration is fully replacing — pass the complete view body, not a
        patch. The version number is auto-incremented.
      parameters:
        - name: view_id
          in: path
          required: true
          description: Unique identifier of the view to update.
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/View'
      tags:
        - Views
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewCreateRequest'
  /v3/webhook-secret:
    get:
      operationId: v3-get-webhook-secret
      summary: Get Webhook Secret
      description: |-
        **Get the current webhook signing secret.**

        Returns the active secret used to sign outbound webhook deliveries via the `bem-signature`
        header. Returns 404 if no secret has been generated for this environment yet.

        Use the secret to verify incoming webhook payloads:
        1. Parse `bem-signature: t={timestamp},v1={signature}`.
        2. Construct the signed string: `{timestamp}.{raw request body}`.
        3. Compute HMAC-SHA256 of that string using the secret.
        4. Compare the hex digest against `v1`.
        5. Reject requests where the timestamp is more than a few minutes old.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSecret'
      tags:
        - Webhooks
    post:
      operationId: v3-generate-webhook-secret
      summary: Generate Webhook Secret
      description: |-
        **Generate a new webhook signing secret.**

        Creates a new signing secret for this environment (or replaces the existing one).
        The new secret is returned in full exactly once — store it securely.

        After rotation all newly delivered webhooks will be signed with the new secret.
        Update your verification logic before calling this endpoint if you need zero-downtime rotation.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSecret'
      tags:
        - Webhooks
    delete:
      operationId: v3-revoke-webhook-secret
      summary: Revoke Webhook Secret
      description: |-
        **Revoke the current webhook signing secret.**

        Deletes the active signing secret. Webhook deliveries will continue but will no longer
        include a `bem-signature` header until a new secret is generated.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
      tags:
        - Webhooks
  /v3/workflows:
    get:
      operationId: v3-list-workflows
      summary: List Workflows
      description: |-
        **List workflows in the current environment.**

        Returns each workflow's current version, including its node graph
        and main node. Combine filters freely — they AND together.

        ## Filtering

        - `workflowIDs` / `workflowNames`: exact-match identity filters.
        - `displayName`: case-insensitive substring match.
        - `tags`: returns workflows tagged with any of the supplied tags.
        - `functionIDs` / `functionNames`: returns only workflows that
        reference the named functions in any node. Useful for "which
        workflows depend on this function?" lookups before changing or
        deleting a function.

        ## Pagination

        Cursor-based with `startingAfter` and `endingBefore` (workflowIDs).
        Default limit 50, maximum 100.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: workflowIDs
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
            minItems: 1
          explode: false
        - name: workflowNames
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
            minItems: 1
          explode: false
        - name: displayName
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - name: startingAfter
          in: query
          required: false
          schema:
            type: string
        - name: endingBefore
          in: query
          required: false
          schema:
            type: string
        - name: tags
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
            minItems: 1
          explode: false
        - name: functionIDs
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
            minItems: 1
          explode: false
        - name: functionNames
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
            minItems: 1
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowsListResponseV3'
      tags:
        - Workflows
    post:
      operationId: v3-create-workflow
      summary: Create a Workflow
      description: |-
        **Create a workflow.**

        A workflow is a directed acyclic graph of nodes (each pointing at a
        function) with one entry point (`mainNodeName`). The graph runs
        end-to-end on every call.

        ## Required structure

        - `name`: unique within the environment, alphanumeric plus hyphens
        and underscores.
        - `mainNodeName`: must match one of the `nodes[].name` values, and
        must not be the destination of any edge.
        - `nodes`: at least one. Each node has a unique `name` and a
        `function` reference (by `functionName` or `functionID`, optionally
        pinned to a `versionNum`).
        - `edges`: optional for single-node workflows. For branching
        sources (Classify, semantic Split), each edge carries a
        `destinationName` matching a `classifications[].name` or
        `itemClasses[].name` on the source function.

        The created workflow is at `versionNum: 1`. Subsequent
        `PATCH /v3/workflows/{workflowName}` calls produce new versions.

        ## Common patterns

        - **Single-node**: one extract/classify function, no edges.
        - **Sequential**: extract → enrich → payload_shaping (linear edges).
        - **Branching**: classify → multiple extracts (one edge per
        classification name).
        - **Split-then-process**: split → multiple extracts (one edge per
        item class).

        See [Workflows explained](/guide/workflows-explained) for end-to-end
        examples of each pattern.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowV3CreateResponse'
      tags:
        - Workflows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowCreateRequestV3'
  /v3/workflows/copy:
    post:
      operationId: v3-copy-workflow
      summary: Copy a Workflow
      description: |-
        **Copy a workflow to a new name.**

        Forks the source workflow's current version into a brand-new
        workflow at `versionNum: 1`. The full node graph and edges are
        carried over, but the *functions* the copied nodes reference are
        shared, not duplicated — both workflows now point at the same
        functions.

        Useful for forking a production workflow to test a topology change
        without disturbing the live caller.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowCopyResponseV3'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowCopyResponseV3'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowCopyResponseV3'
      tags:
        - Workflows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowCopyRequest'
  /v3/workflows/{workflowName}:
    delete:
      operationId: v3-delete-workflow
      summary: Delete a Workflow
      description: |-
        **Delete a workflow and every one of its versions.**

        Permanent. Running and queued calls against this workflow continue
        to completion against the version they captured at call time;
        subsequent attempts to call the workflow return `404 Not Found`.

        Functions referenced by the deleted workflow are not removed — they
        remain available to other workflows or for direct reference.
      parameters:
        - name: workflowName
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - Workflows
    get:
      operationId: v3-get-workflow
      summary: Get a Workflow
      description: |-
        **Retrieve a workflow's current version by name.**

        Returns the full workflow record: `currentVersionNum`, `mainNodeName`,
        the `nodes` array (with each node's function reference and pinned
        `versionNum` if any), and the `edges` array. To inspect a historical
        version, use `GET /v3/workflows/{workflowName}/versions/{versionNum}`.
      parameters:
        - name: workflowName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowV3GetResponse'
      tags:
        - Workflows
    patch:
      operationId: v3-update-workflow
      summary: Update a Workflow
      description: |-
        **Update a workflow. Updates create a new version.**

        The previous version remains addressable and immutable. Pending and
        running calls captured at the old version continue against it; new
        calls run against the new version.

        ## Topology updates

        To change the graph you must provide `mainNodeName`, `nodes`, AND
        `edges` together — partial topology updates are rejected. The full
        graph is replaced atomically.

        ## Metadata-only updates

        Omit all three fields to update only `displayName`, `tags`, or
        `name` while keeping the topology of the current version.

        ## Reverting

        To roll back, fetch the desired prior version and resubmit its
        `mainNodeName`/`nodes`/`edges` as a new update. Versions themselves
        are immutable — there is no "pin to version N" operation at the
        workflow level (use `nodes[].function.versionNum` to pin individual
        functions).
      parameters:
        - name: workflowName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowV3UpdateResponse'
      tags:
        - Workflows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowUpdateRequestV3'
  /v3/workflows/{workflowName}/call:
    post:
      operationId: v3-call-workflow
      parameters:
        - name: workflowName
          in: path
          required: true
          description: The name of the workflow to invoke.
          schema:
            type: string
        - name: wait
          in: query
          required: false
          description: |-
            Block until the call completes (up to 30 seconds) and return the finished
            call object. Default: `false`. This is a boolean flag — use `--wait` or
            `--wait=true`, not `--wait true`.
          schema:
            type: boolean
          explode: false
      description: |-
        **Invoke a workflow.**

        Submit the input file as either a multipart form request or a JSON request with
        base64-encoded file content. The workflow name is derived from the URL path.

        ## Input Formats

        - **Multipart form** (`multipart/form-data`): attach the file directly via the `file`
        or `files` fields. Set `wait` in the form body to control synchronous behaviour.
        - **JSON** (`application/json`): base64-encode the file content and set it in
        `input.singleFile.inputContent` or `input.batchFiles.inputs[*].inputContent`.
        Pass `wait=true` as a query parameter to control synchronous behaviour.

        ## Synchronous vs Asynchronous

        By default the call is created asynchronously and this endpoint returns `202 Accepted`
        immediately with a `pending` call object. Set `wait` to `true` to block until
        the call completes (up to 30 seconds):

        - On success: returns `200 OK` with the completed call, `outputs` populated
        - On failure: returns `500 Internal Server Error` with the call and an `error` message
        - On timeout: returns `202 Accepted` with the still-running call

        ## Tracking

        Poll `GET /v3/calls/{callID}` to check status, or configure a webhook subscription
        to receive events when the call finishes.

        ## CLI Usage

        Use `@path/to/file` inside JSON string values to embed file contents automatically.
        Binary files (PDF, images, audio) are base64-encoded; text files are embedded as strings.

        Single file (synchronous):
        ```bash
        bem workflows call \
          --workflow-name my-workflow \
          --input.single-file '{"inputContent": "@invoice.pdf", "inputType": "pdf"}' \
          --wait
        ```

        Single file (asynchronous, returns callID immediately):
        ```bash
        bem workflows call \
          --workflow-name my-workflow \
          --input.single-file '{"inputContent": "@invoice.pdf", "inputType": "pdf"}'
        ```

        Batch files:
        ```bash
        bem workflows call \
          --workflow-name my-workflow \
          --input.batch-files '{"inputs": [{"inputContent": "@a.pdf", "inputType": "pdf"}, {"inputContent": "@b.png", "inputType": "png"}]}'
        ```

        Alternative: pass the full `--input` flag as JSON:
        ```bash
        bem workflows call \
          --workflow-name my-workflow \
          --input '{"singleFile": {"inputContent": "@invoice.pdf", "inputType": "pdf"}}' \
          --wait
        ```

        **Important:** `--wait` is a boolean flag. Use `--wait` or `--wait=true`.
        Do **not** use `--wait true` (with a space) — the `true` will be parsed as an
        unexpected positional argument.

        Supported `inputType` values: csv, docx, email, heic, heif, html, jpeg, json,
        m4a, mp3, pdf, png, text, wav, webp, xls, xlsx, xml.
      summary: Call a Workflow Call a Workflow
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallGetResponseV3'
      tags:
        - Workflows
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkflowCallMultipartFormData'
            encoding:
              file:
                contentType: '*/*'
              files:
                contentType: '*/*'
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowCallJsonBody'
  /v3/workflows/{workflowName}/versions:
    get:
      operationId: v3-list-workflow-versions
      summary: List Workflow Versions
      description: |-
        **List every version of a workflow.**

        Versions are immutable. Each row captures what the workflow looked
        like between updates: graph topology, metadata, and timestamps.
        Returns newest-first by default. Cursor pagination via
        `startingAfter` / `endingBefore` over `versionNum`.
      parameters:
        - name: workflowName
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - name: startingAfter
          in: query
          required: false
          schema:
            type: integer
        - name: endingBefore
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkflowVersionsResponseV3'
      tags:
        - Workflows
  /v3/workflows/{workflowName}/versions/{versionNum}:
    get:
      operationId: v3-get-workflow-version
      summary: Get a Workflow Version
      description: |-
        **Retrieve a specific historical version of a workflow.**

        Versions are immutable. Use this endpoint to see what a workflow
        looked like at the moment a particular call was made — every call
        record carries the workflow `versionNum` it ran against.
      parameters:
        - name: workflowName
          in: path
          required: true
          schema:
            type: string
        - name: versionNum
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWorkflowVersionResponseV3'
      tags:
        - Workflows
