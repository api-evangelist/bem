          type: array
          items:
            type: string
          description: |-
            Style IDs whose type is table — the styles a `table` primitive's required
            `styleId` can name. Empty means the template defines no table style, so any
            table primitive will fail at render.
        listKinds:
          type: array
          items:
            type: string
            enum:
              - decimal
              - bullet
          description: |-
            Supported list kinds (`decimal`, `bullet`) the template's `numbering.xml`
            defines an `abstractNum` for. Empty means the template can hold no list, so
            any list primitive will fail at render.
      title: Render template
    RenderTemplateInput:
      type: object
      required:
        - base64
      properties:
        name:
          type: string
          description: >-
            Original upload filename (e.g. `contract.docx`), stored for display only. Does not affect where
            the template is stored.
        base64:
          type: string
          contentEncoding: base64
          description: Base64-encoded `.docx` bytes. In the Bem CLI, use `@path/to/file` to embed it automatically.
      title: Render template input
    RenderTemplatePlaceholders:
      type: object
      required:
        - stringKeys
        - blockKeys
      properties:
        stringKeys:
          type: array
          items:
            type: string
        blockKeys:
          type: array
          items:
            type: string
      description: |-
        The placeholder contract a Render template declares, grouped by how each
        placeholder is filled. Derived from the template at create/update time by
        scanning its `docxtpl` tags; not user-supplied.

        - `stringKeys`: bare string placeholders (`{{ key }}`) filled with a single
        value.
        - `blockKeys`: wrapped-primitive placeholders (`{{p key }}`) — bind one core
        primitive (paragraph, table, image, or list). The placeholder's own
        paragraph dissolves and is replaced by the rendered subdocument's blocks,
        rather than substituting text inline.
      title: Render template placeholder contract
    ReviewEstimate:
      type: object
      required:
        - totalTransformations
        - labeledTransformations
        - unlabeledTransformations
        - missingEvaluations
        - confidenceDistribution
        - thresholdMatrix
      properties:
        totalTransformations:
          type: integer
          description: Total number of transformations analyzed
        labeledTransformations:
          type: integer
          description: Number of transformations already labeled
        unlabeledTransformations:
          type: integer
          description: Number of transformations not yet labeled
        missingEvaluations:
          type: integer
          description: Number of transformations without evaluation data
        confidenceDistribution:
          type: object
          properties:
            high:
              type: integer
            medium:
              type: integer
            low:
              type: integer
          description: Distribution of confidence levels
        thresholdMatrix:
          type: array
          items:
            $ref: '#/components/schemas/ThresholdResult'
          description: Statistical analysis across confidence thresholds
      description: Detailed review requirements estimate
    ReviewQueueEntityV3:
      type: object
      required:
        - entityID
        - canonical
        - type
        - mentionCount
        - surfaceForms
        - createdAt
        - updatedAt
        - status
        - previewMentions
      properties:
        entityID:
          type: string
          description: Public ID (`ent_...`) of the entity.
        canonical:
          type: string
          description: The canonical (longest / most descriptive) surface form.
        type:
          type: string
          description: The effective type name (assigned override if set, else bem-inferred).
        description:
          type: string
          description: Free-form description of the entity, when present.
        mentionCount:
          type: integer
          format: int32
          description: Total mentions across all parsed documents.
        surfaceForms:
          type: array
          items:
            type: string
          description: Distinct surface forms that have resolved to this entity.
        createdAt:
          type: string
          format: date-time
          description: When the entity was created.
        updatedAt:
          type: string
          format: date-time
          description: When the entity was last updated.
        status:
          type: string
          description: 'Curation lifecycle state: `extracted`, `proposed`, `approved`, `rejected`.'
        typeID:
          type: string
          description: Public ID (`ety_...`) of the customer-assigned type, when one is set.
        validatedAt:
          type: string
          format: date-time
          description: When a human approved/rejected the entity. Omitted while un-validated.
        validatedByUserID:
          type: string
          description: Public ID (`usr_...`) of the user who validated the entity, when known.
        previewMentions:
          type: array
          items:
            $ref: '#/components/schemas/ReviewQueueMentionV3'
          description: |-
            A capped preview (up to 2) of the entity's first mentions, ordered by
            page then time, so a reviewer can triage without opening each entity.
      description: 'One row of the review queue: an entity plus a small preview of its mentions.'
    ReviewQueueMentionV3:
      type: object
