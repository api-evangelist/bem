        outbound:
          type: array
          items:
            $ref: '#/components/schemas/OutboundRelationV3'
          description: Edges pointing away from the queried entity.
        nextCursor:
          type: string
          description: |-
            Opaque cursor for the next page of edges, or absent on the last page.
            Pass it back as `cursor`.
      description: Response body for `GET /v3/entities/{id}/relations`.
    EntityResponseV3:
      type: object
      required:
        - entityID
        - canonical
        - type
        - mentionCount
        - surfaceForms
        - createdAt
        - updatedAt
        - status
      properties:
        entityID:
          type: string
          description: Public ID (`ent_...`).
        canonical:
          type: string
          description: The canonical (longest / most descriptive) surface form.
        type:
          type: string
          description: The entity's effective type name (assigned type if set, else inferred).
        description:
          type: string
          description: Free-form description.
        mentionCount:
          type: integer
          format: int32
          description: Total mentions across parsed documents.
        surfaceForms:
          type: array
          items:
            type: string
          description: Distinct surface forms resolved to this entity.
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp.
        updatedAt:
          type: string
          format: date-time
          description: Last-update timestamp.
        status:
          type: string
          enum:
            - extracted
            - proposed
            - approved
            - rejected
          description: Curation lifecycle state.
        typeID:
          type: string
          description: '`ety_...` public ID of the assigned type, when one is set.'
        validatedAt:
          type: string
          format: date-time
          description: When the entity was approved/rejected. Present only once validated.
        validatedByUserID:
          type: string
          description: '`usr_...` public ID of the validating user (dashboard transitions only).'
      description: An entity record, including its curation status and assigned type.
    EntitySynonymV3:
      type: object
      required:
        - synonymID
        - text
        - normalizedText
        - source
        - createdAt
      properties:
        synonymID:
          type: string
          description: Stable public identifier for the synonym (`esn_...`).
        text:
          type: string
          description: The human-readable synonym as authored.
        normalizedText:
          type: string
          description: Lowercased, whitespace-folded form of `text`.
        source:
          type: string
          enum:
            - extracted
            - customer_defined
            - sme_approved
          description: |-
            Provenance of the synonym. `customer_defined` and `sme_approved` synonyms
            are deletable; `extracted` synonyms are resolver-owned and cannot be
            deleted.
        locale:
          type: string
          description: Optional BCP 47 locale tag, when one was supplied.
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp of the synonym (RFC 3339).
      description: One synonym attached to an entity.
    EntityTypeCreateRequestV3:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Type name. Required and unique within the account+environment.
        description:
          type: string
          description: Optional description.
        parentTypeID:
          type: string
          description: |-
            Optional public ID (`ety_...`) of the parent type. Must belong to the
            same account+environment.
        attributeSchema:
          description: Optional per-type structured attribute metadata.
      description: Request body to create an entity type.
    EntityTypeListResponseV3:
      type: object
      required:
        - entityTypes
        - totalCount
      properties:
        entityTypes:
          type: array
          items:
            $ref: '#/components/schemas/EntityTypeV3'
        totalCount:
          type: integer
          format: int64
          description: Total number of entity types matching the query, ignoring pagination.
      description: Response body for listing entity types.
    EntityTypeReviewerV3:
      type: object
      required:
        - reviewerID
        - userID
        - email
        - role
        - createdAt
      properties:
        reviewerID:
          type: string
          description: Stable public identifier for the assignment (`etr_...`).
        userID:
          type: string
          description: Public identifier of the assigned user (`usr_...`).
        email:
          type: string
          description: The assigned user's email.
        role:
          type: string
          description: The assigned user's account role (for example `operator`, `admin`).
        createdAt:
          type: string
          format: date-time
          description: When the assignment was created (RFC 3339).
      description: |-
        A reviewer assignment links a user to an entity type they are responsible
        for reviewing. The assignment is scoped to an account+environment and is
        unique per (entity type, user).
    EntityTypeUpdateRequestV3:
      type: object
      properties:
        description:
          type: string
          description: New description.
        parentTypeID:
          type: string
          description: |-
            New parent type public ID (`ety_...`), or an empty string to clear the
            parent (promote to top-level). Must belong to the same
            account+environment and may not be the type itself.
        attributeSchema:
          description: New per-type structured attribute metadata.
      description: |-
        Request body to update an entity type. Only the fields present are changed.
        `name` is intentionally not updatable — it is immutable because external
        references key off it.
    EntityTypeV3:
      type: object
      required:
        - typeID
        - name
        - description
        - parentTypeID
        - createdAt
        - updatedAt
      properties:
        typeID:
          type: string
          description: Stable public identifier for the entity type (`ety_...`).
        name:
          type: string
          description: Human-facing type name. Unique within an account+environment, and immutable once set.
        description:
          type: string
          description: Optional human-facing note about the type.
        parentTypeID:
          type: string
          description: |-
            Public ID (`ety_...`) of the parent type, or an empty string when the
            type is top-level.
        attributeSchema:
          description: Optional per-type structured attribute metadata.
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (RFC 3339).
        updatedAt:
          type: string
          format: date-time
          description: Last-update timestamp (RFC 3339).
      description: |-
        An EntityType is a customer-defined type in the knowledge-graph taxonomy,
        scoped to an account+environment. Types may be organised into hierarchies
        via `parentTypeID`, and may carry per-type structured attribute metadata in
        `attributeSchema` (for example `{"unit": "mg", "range": [0, 100]}`).
    ErrorEvent:
      type: object
      required:
        - eventID
        - referenceID
        - functionID
        - functionName
        - message
      properties:
        functionCallTryNumber:
          type: integer
          description: The attempt number of the function call that created this event. 1 indexed.
        eventID:
          type: string
          description: Unique ID generated by bem to identify the event.
        createdAt:
          type: string
          format: date-time
          description: Timestamp indicating when the event was created.
        referenceID:
          type: string
          description: >-
            The unique ID you use internally to refer to this data point, propagated from the original
            function input.
        inboundEmail:
          allOf:
            - $ref: '#/components/schemas/EventInboundEmail'
          description: The inbound email that triggered this event.
        metadata:
          type: object
          properties:
            durationFunctionToEventSeconds:
              type: number
        eventType:
          type: string
          enum:
            - error
        functionCallID:
          type: string
          description: Unique identifier of function call that this event is associated with.
        functionID:
          type: string
          description: Unique identifier of function that this event is associated with.
        functionName:
          type: string
          description: Unique name of function that this event is associated with.
        functionVersionNum:
          type: integer
          description: Version number of function that this event is associated with.
        callID:
          type: string
          description: Unique identifier of workflow call that this event is associated with.
        workflowID:
          type: string
          description: Unique identifier of workflow that this event is associated with.
        workflowName:
          type: string
          description: Name of workflow that this event is associated with.
        workflowVersionNum:
          type: integer
          description: Version number of workflow that this event is associated with.
        message:
          type: string
          description: Error message.
        kind:
          type: string
          description: |-
            Open, extensible error-kind label for typed transformation errors. The
            platform emits these as plain strings and the set grows over time, so
            clients must accept unknown values. For render functions the known kinds
            are `render_source_fetch`, `render_template_fetch`,
            `render_image_unresolved`, `render_validation`, `render_exception`,
            `render_upload`, and `render_contract`. Omitted for historical events
            that pre-date the kind column and for non-transform errors.
      title: Error Event
    ErrorEventResponseV3:
      type: object
      required:
        - error
      properties:
        error:
          allOf:
            - $ref: '#/components/schemas/ErrorEvent'
          description: The error event.
    EvalMatchConfigV3:
      type: object
      properties:
        numericTolerance:
          type: number
          format: double
          description: |-
            Relative tolerance for numeric fields. `0` (default) means exact
            equality; `0.01` means ±1%.
        stringMatch:
          type: string
          enum:
            - exact
            - fuzzy
          description: '`exact` (default) or `fuzzy`.'
        fuzzyThreshold:
          type: number
          format: double
          description: |-
            Levenshtein-ratio threshold used when `stringMatch == "fuzzy"`.
            Range `[0, 1]`. Default `0.85`.
        arrayMatch:
          type: string
          enum:
            - by-index
          description: P0 supports only `by-index`.
        ignorePaths:
          type: array
          items:
            type: string
          description: |-
            JSON Pointer paths to skip during comparison. The asterisk character
            matches arbitrary object keys / array indices.

            Example values: /metadata, /lineItems with asterisk segment, etc.
      description: Comparator configuration. All fields optional; conservative defaults.
    EvalScoreAggregateV3:
      type: object
      required:
        - precision
        - recall
        - f1
        - exactMatches
        - withinTolerance
        - fuzzyMatches
        - misses
        - extras
        - totalFieldsExpected
        - totalFieldsActual
      properties:
        precision:
          type: number
          format: double
        recall:
          type: number
          format: double
        f1:
          type: number
          format: double
        exactMatches:
          type: integer
        withinTolerance:
          type: integer
        fuzzyMatches:
          type: integer
        misses:
          type: integer
        extras:
          type: integer
        totalFieldsExpected:
          type: integer
        totalFieldsActual:
          type: integer
      description: Aggregate accuracy metrics.
    EvalScoreCreateResponseV3:
      type: object
      required:
        - scoreRunID
        - status
      properties:
        scoreRunID:
          type: string
          description: Run identifier. Use with `GET /v3/eval/score/{scoreRunID}`.
        status:
          $ref: '#/components/schemas/EvalScoreRunStatusV3'
      description: Returned by `POST /v3/eval/score`.
    EvalScoreFieldResultV3:
      type: object
      required:
        - path
        - match
      properties:
        path:
          type: string
          description: JSON Pointer to the leaf.
        match:
          type: string
          enum:
            - exact
            - within_tolerance
            - fuzzy_match
            - miss
            - extra
          description: |-
            Classification:
            - `exact`: both present and deep-equal
            - `within_tolerance`: both numbers, within configured tolerance
            - `fuzzy_match`: both strings, Levenshtein ratio above threshold
            - `miss`: expected present, actual absent or different
            - `extra`: actual present, expected absent
        expected: {}
        actual: {}
        delta:
          type: number
          format: double
          description: Populated for numeric comparisons; `actual - expected`.
      description: One leaf in `expected ∪ actual`.
    EvalScorePairResultV3:
      type: object
      required:
        - pairIndex
        - status
      properties:
        pairIndex:
          type: integer
        callID:
          type: string
          description: The function call that produced the actual output, if any.
        status:
          $ref: '#/components/schemas/EvalScorePairStatusV3'
        fieldResults:
          type: array
          items:
            $ref: '#/components/schemas/EvalScoreFieldResultV3'
          description: Per-leaf comparator output. Present only after the pair has been compared.
        errorMessage:
          type: string
          description: Error message if the underlying function call failed.
      description: Per-pair result.
    EvalScorePairStatusV3:
      type: string
      enum:
        - pending
        - running
        - completed
        - failed
      description: Per-pair status.
    EvalScorePairV3:
      type: object
      required:
        - input
        - expected
      properties:
        input:
          allOf:
            - $ref: '#/components/schemas/FileInput'
          description: The file input to feed into the function.
        expected:
          description: |-
            Expected output for this input, as a JSON value. The comparator walks
            `expected ∪ actual` and produces a per-leaf classification.
      description: One `(input, expected)` pair.
    EvalScoreProgressV3:
      type: object
      required:
        - total
        - completed
        - failed
      properties:
        total:
          type: integer
        completed:
          type: integer
        failed:
          type: integer
      description: Counts across all pairs.
    EvalScoreRequestV3:
      type: object
      required:
        - functionName
        - pairs
      properties:
        functionName:
          type: string
          description: Name of the function to score. Must be of type extract, transform, or analyze.
        functionVersionNum:
          type: integer
          description: |-
            Optional version number to score against. P0: only the function's
            current version is accepted; passing a different version returns 422.
        pairs:
          type: array
          items:
            $ref: '#/components/schemas/EvalScorePairV3'
          description: Up to 1000 pairs per request.
        matchConfig:
          allOf:
            - $ref: '#/components/schemas/EvalMatchConfigV3'
          description: Comparator configuration. Defaults are conservative (exact equality).
      description: |-
        Request body for `POST /v3/eval/score`. Submits a list of
        `(input, expected)` pairs to score against the named function.
    EvalScoreRunResponseV3:
      type: object
      required:
        - scoreRunID
        - status
        - functionName
        - functionVersionNum
        - matchConfig
        - progress
        - perPair
      properties:
        scoreRunID:
          type: string
        status:
          $ref: '#/components/schemas/EvalScoreRunStatusV3'
        functionName:
          type: string
        functionVersionNum:
          type: integer
        matchConfig:
          $ref: '#/components/schemas/EvalMatchConfigV3'
        progress:
          $ref: '#/components/schemas/EvalScoreProgressV3'
        aggregate:
          allOf:
            - $ref: '#/components/schemas/EvalScoreAggregateV3'
          description: Populated only when `status == "completed"`.
        perPair:
          type: array
          items:
            $ref: '#/components/schemas/EvalScorePairResultV3'
          description: Per-pair results. `fieldResults` appears once a pair has been compared.
      description: Full status payload returned by `GET /v3/eval/score/{scoreRunID}`.
    EvalScoreRunStatusV3:
      type: string
      enum:
        - pending
        - initializing
        - running
        - completed
        - error
        - cancelled
      description: Status values for an eval-score run.
    EvaluationEvent:
      type: object
      required:
        - eventID
        - referenceID
        - functionID
        - functionName
        - transformId
        - evaluationVersion
        - result
        - status
      properties:
        functionCallTryNumber:
          type: integer
          description: The attempt number of the function call that created this event. 1 indexed.
        eventID:
          type: string
          description: Unique ID generated by bem to identify the event.
        createdAt:
          type: string
          format: date-time
          description: Timestamp indicating when the event was created.
        referenceID:
          type: string
          description: >-
            The unique ID you use internally to refer to this data point, propagated from the original
            function input.
        inboundEmail:
          allOf:
            - $ref: '#/components/schemas/EventInboundEmail'
          description: The inbound email that triggered this event.
        metadata:
          type: object
          properties:
            durationFunctionToEventSeconds:
              type: number
        eventType:
          type: string
          enum:
            - evaluation
        functionCallID:
          type: string
          description: Unique identifier of function call that this event is associated with.
        functionID:
          type: string
          description: Unique identifier of function that this event is associated with.
        functionName:
          type: string
          description: Unique name of function that this event is associated with.
        functionVersionNum:
          type: integer
          description: Version number of function that this event is associated with.
        callID:
          type: string
          description: Unique identifier of workflow call that this event is associated with.
        workflowID:
          type: string
          description: Unique identifier of workflow that this event is associated with.
        workflowName:
          type: string
          description: Name of workflow that this event is associated with.
        workflowVersionNum:
          type: integer
          description: Version number of workflow that this event is associated with.
        transformId:
          type: string
          description: Unique ID of the transformation that was evaluated.
        evaluationVersion:
          type: string
          description: Version identifier of the evaluation logic that produced this result.
        result:
          type: object
          unevaluatedProperties: {}
          description: |-
            Evaluator output. Shape depends on `evaluationVersion` and includes
            confidence scores, per-field hallucination flags, and relevance metrics.
        status:
          type: string
          enum:
            - success
            - failed
          description: Terminal status of the evaluation run.
        errorMessage:
          type: string
          description: Failure reason populated when `status` is `failed`.
      description: |-
        Emitted when a function-accuracy evaluation completes for a transformation.
        Evaluations are scheduled by `POST /v3/eval` and run asynchronously; this
        event reports the terminal result.
      title: Evaluation Event
    EvaluationResultV3:
      type: object
      required:
        - fieldMetrics
        - overallConfidence
        - runtime
        - hasHallucinations
        - evaluationVersion
        - createdAt
      properties:
        fieldMetrics:
          type: object
          unevaluatedProperties:
            $ref: '#/components/schemas/FieldMetricV3'
          description: Per-field evaluation metrics, keyed by JSON path to the field.
        overallConfidence:
          type: number
          format: double
          description: Aggregate confidence score across all fields (0.0 - 1.0).
        runtime:
          type: number
          format: double
          description: Total evaluation runtime in seconds.
        hasHallucinations:
          type: boolean
          description: |-
            `true` if at least one field was flagged as a hallucination by the
            evaluator.
        evaluationVersion:
          type: string
          description: Evaluation version that produced this result.
        createdAt:
          type: string
          format: date-time
          description: Server timestamp when the evaluation result was persisted.
      description: A completed evaluation result for a single transformation.
    EvaluationResultsResponseV3:
      type: object
      required:
        - results
      properties:
        results:
          type: object
          unevaluatedProperties:
            $ref: '#/components/schemas/EvaluationResultV3'
          description: |-
            Completed evaluation results, keyed by event KSUID.

            An event appears here only if its evaluation completed
            successfully. Still-running evaluations appear in `pending`;
            failed evaluations appear in `failed`.
        pending:
          type: array
          items:
            $ref: '#/components/schemas/PendingEvaluationV3'
          description: Events whose evaluation is still running.
        failed:
          type: array
          items:
            $ref: '#/components/schemas/FailedEvaluationV3'
          description: Events whose evaluation failed or was not found.
        errors:
          type: object
          unevaluatedProperties:
            type: string
          description: |-
            Reserved map of event KSUID to error message for validation
            failures on the request itself. Populated only in edge cases.
      description: |-
        Batched response containing the evaluation state for every requested
        ID, partitioned into completed `results`, still-running `pending`, and
        terminal `failed` groups. All identifiers in the response are event
        KSUIDs regardless of whether the request used `eventIDs` or
        `transformationIDs`.
    EventInboundEmail:
      type: object
      required:
        - to
        - from
        - subject
      properties:
        to:
          type: string
          description: The email address of the recipient.
        deliveredTo:
          type: string
          description: The email address of the original intended recipient if the email itself was forwarded.
        from:
          type: string
          description: The email address of the sender.
        subject:
          type: string
          description: The subject of the email.
    EventV3:
      type: object
      oneOf:
        - $ref: '#/components/schemas/TransformEvent'
        - $ref: '#/components/schemas/ExtractEvent'
        - $ref: '#/components/schemas/ParseEvent'
        - $ref: '#/components/schemas/AnalyzeEvent'
        - $ref: '#/components/schemas/RouteEvent'
        - $ref: '#/components/schemas/ClassifyEvent'
        - $ref: '#/components/schemas/SplitCollectionEvent'
        - $ref: '#/components/schemas/SplitItemEvent'
        - $ref: '#/components/schemas/ErrorEvent'
        - $ref: '#/components/schemas/JoinEvent'
        - $ref: '#/components/schemas/EnrichEvent'
        - $ref: '#/components/schemas/PayloadShapingEvent'
        - $ref: '#/components/schemas/EvaluationEvent'
        - $ref: '#/components/schemas/collectionProcessingEvent'
        - $ref: '#/components/schemas/SendEvent'
        - $ref: '#/components/schemas/RenderEvent'
      discriminator:
        propertyName: eventType
        mapping:
          transform: '#/components/schemas/TransformEvent'
          extract: '#/components/schemas/ExtractEvent'
          parse: '#/components/schemas/ParseEvent'
          analyze: '#/components/schemas/AnalyzeEvent'
          route: '#/components/schemas/RouteEvent'
          classify: '#/components/schemas/ClassifyEvent'
          split_collection: '#/components/schemas/SplitCollectionEvent'
          split_item: '#/components/schemas/SplitItemEvent'
          error: '#/components/schemas/ErrorEvent'
          join: '#/components/schemas/JoinEvent'
          enrich: '#/components/schemas/EnrichEvent'
          payload_shaping: '#/components/schemas/PayloadShapingEvent'
          evaluation: '#/components/schemas/EvaluationEvent'
          collection_processing: '#/components/schemas/collectionProcessingEvent'
          send: '#/components/schemas/SendEvent'
          render: '#/components/schemas/RenderEvent'
      description: |-
        V3 read-side event union. Superset of the shared `Event` union: it contains
        every shared variant verbatim (backward compatible) and adds the V3-only
        `extract`, `parse`, `classify`, `analyze`, `payload_shaping`, and
        `evaluation` variants. This is also the union delivered as the body of
        outbound webhook payloads.
    ExtractEvent:
      type: object
      required:
        - eventID
        - referenceID
        - functionID
        - functionName
        - transformedContent
        - itemOffset
        - itemCount
      properties:
        functionCallTryNumber:
          type: integer
          description: The attempt number of the function call that created this event. 1 indexed.
        eventID:
          type: string
          description: Unique ID generated by bem to identify the event.
        createdAt:
          type: string
          format: date-time
          description: Timestamp indicating when the event was created.
        referenceID:
          type: string
          description: >-
            The unique ID you use internally to refer to this data point, propagated from the original
            function input.
        inboundEmail:
          allOf:
            - $ref: '#/components/schemas/EventInboundEmail'
          description: The inbound email that triggered this event.
        metadata:
          type: object
          properties:
            durationFunctionToEventSeconds:
              type: number
        eventType:
          type: string
          enum:
            - extract
        functionCallID:
          type: string
          description: Unique identifier of function call that this event is associated with.
        functionID:
          type: string
          description: Unique identifier of function that this event is associated with.
        functionName:
          type: string
          description: Unique name of function that this event is associated with.
        functionVersionNum:
          type: integer
          description: Version number of function that this event is associated with.
        callID:
          type: string
          description: Unique identifier of workflow call that this event is associated with.
        workflowID:
          type: string
          description: Unique identifier of workflow that this event is associated with.
        workflowName:
          type: string
          description: Name of workflow that this event is associated with.
        workflowVersionNum:
          type: integer
          description: Version number of workflow that this event is associated with.
        inputType:
          $ref: '#/components/schemas/InputType'
        transformationID:
          type: string
          description: Unique ID for each transformation output generated by bem following Segment's KSUID conventions.
        s3URL:
          anyOf:
            - type: string
            - type: 'null'
          description: Presigned S3 URL for the input content uploaded to S3.
        inputs:
          anyOf:
            - type: array
              items:
                type: object
                properties:
                  inputType:
                    anyOf:
                      - type: string
                      - type: 'null'
                  inputContent:
                    anyOf:
                      - type: string
                      - type: 'null'
                  jsonInputContent:
                    anyOf:
                      - type: object
                        unevaluatedProperties: {}
                      - type: 'null'
                  s3URL:
                    anyOf:
                      - type: string
                      - type: 'null'
            - type: 'null'
          description: Array of transformation inputs with their types and S3 URLs.
        transformedContent:
          type: object
          unevaluatedProperties: {}
          description: >-
            The transformed content of the input. The structure of this object is defined by the function
            configuration.
        correctedContent:
          anyOf:
            - type: object
              properties:
                output:
                  type: array
                  items:
                    $ref: '#/components/schemas/AnyType'
            - $ref: '#/components/schemas/AnyType'
          description: Corrected feedback provided for fine-tuning purposes.
        invalidProperties:
          type: array
          items:
            type: string
          description: List of properties that were invalid in the input.
        itemOffset:
          type: integer
          description: >-
            The offset of the first item that was transformed. Used for batch transformations to indicate
            which item in the batch this event corresponds to.
        itemCount:
          type: integer
          description: >-
            The number of items that were transformed. Used for batch transformations to indicate how many
            items were transformed.
        fieldBoundingBoxes:
          type: object
          unevaluatedProperties: {}
          description: >-
            Per-field bounding boxes. A JSON object mapping RFC 6901 JSON Pointer paths (e.g.
            `"/invoiceNumber"`,

            `"/items/0/price"`) to the document regions from which each extracted value was sourced.
        fieldConfidences:
          type: object
          unevaluatedProperties:
            type: number
            format: float
          description: >-
            Per-field confidence scores. A JSON object mapping RFC 6901 JSON Pointer paths (e.g.
            `"/invoiceNumber"`)

            to float values in the range [0, 1] indicating the model's confidence in each extracted field
            value.
        avgConfidence:
          anyOf:
            - type: number
              format: float
            - type: 'null'
          description: Average confidence score across all extracted fields, in the range [0, 1].
      description: |-
        V3 event variants that do not exist in the shared `Event` union.

        `ExtractEvent` and `ClassifyEvent` are emitted only by V3-era function types
        (`extract` and `classify`). The shared `Event` union in `specs/events/models.tsp`
        predates these types and continues to describe V2 / V1-alpha responses verbatim;
        V3 response payloads add the new variants via the `EventV3` union below while
        keeping every shared variant intact for backward compatibility.
      title: Extract Event
    ExtractFunction:
      type: object
      required:
        - functionID
        - functionName
        - versionNum
        - type
        - outputSchemaName
        - outputSchema
        - enableBoundingBoxes
        - preCount
      properties:
        functionID:
          type: string
          description: Unique identifier of function.
        functionName:
          type: string
          description: Name of function. Must be UNIQUE on a per-environment basis.
        versionNum:
          type: integer
          description: Version number of function.
        usedInWorkflows:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowUsageInfo'
          description: List of workflows that use this function.
        displayName:
          type: string
          description: Display name of function. Human-readable name to help you identify the function.
        tags:
          type: array
          items:
            type: string
          description: Array of tags to categorize and organize functions.
        audit:
          allOf:
            - $ref: '#/components/schemas/FunctionAudit'
          description: Audit trail information for the function.
        type:
          type: string
          enum:
            - extract
        outputSchemaName:
          type: string
          description: Name of output schema object.
        outputSchema:
          type: object
          unevaluatedProperties: {}
          description: Desired output structure defined in standard JSON Schema convention.
        enableBoundingBoxes:
          type: boolean
          description: |-
            Whether bounding box extraction is enabled. Applies to vision input types
            (pdf, png, jpeg, heic, heif, webp) that dispatch through the analyze path.
            When true, the function returns the document regions (page, coordinates) from which each
            field was extracted.
        preCount:
          type: boolean
          description: |-
            Reducing the risk of the model stopping early on long documents.
            Trade-off: Increases total latency.
      description: |-
        A function that extracts structured JSON from documents and images.
        Accepts a wide range of input types including PDFs, images, spreadsheets, emails, and more.
      title: Extract Function
    ExtractFunctionVersion:
      type: object
      required:
        - functionID
        - functionName
        - versionNum
        - type
        - outputSchemaName
        - outputSchema
        - tabularChunkingEnabled
        - enableBoundingBoxes
        - preCount
      properties:
        functionID:
          type: string
          description: Unique identifier of function.
        functionName:
          type: string
          description: Name of function. Must be UNIQUE on a per-environment basis.
        versionNum:
          type: integer
          description: Version number of function.
        usedInWorkflows:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowUsageInfo'
          description: List of workflows that use this function.
        displayName:
          type: string
          description: Display name of function. Human-readable name to help you identify the function.
        tags:
          type: array
          items:
            type: string
          description: Array of tags to categorize and organize functions.
        createdAt:
          type: string
          format: date-time
          description: The date and time the function version was created.
        audit:
          allOf:
            - $ref: '#/components/schemas/FunctionAudit'
          description: Audit trail information for the function version.
        type:
          type: string
          enum:
            - extract
        outputSchemaName:
          type: string
          description: Name of output schema object.
        outputSchema:
          type: object
          unevaluatedProperties: {}
          description: Desired output structure defined in standard JSON Schema convention.
        tabularChunkingEnabled:
          type: boolean
          description: |-
            Whether tabular chunking is enabled. When true, tables in CSV/Excel files are processed
            in row batches rather than all at once.
        enableBoundingBoxes:
          type: boolean
          description: |-
            Whether bounding box extraction is enabled. Applies to vision input types
            (pdf, png, jpeg, heic, heif, webp) that dispatch through the analyze path.
            When true, the function returns the document regions (page, coordinates) from which each
            field was extracted.
        preCount:
          type: boolean
          description: |-
            Reducing the risk of the model stopping early on long documents.
            Trade-off: Increases total latency.
    FSContext:
      type: object
      properties:
        bucket:
          type: string
          description: |-
            Bucket KSUID (prefix `bkt_`) to scope the request to — a named partition
            of the knowledge graph within the caller's account+environment.

            **Optional.** Omitting it (or passing an empty value) leaves the request
            UNSCOPED: memory-level reads (`find` / `open` / `xref`) return entities
            across every bucket in the account+environment, so pre-bucket callers
            keep their original all-entities behavior unchanged. (Writes are
            different: a parse call with no bucket targets the account default
            bucket.) When a bucket IS supplied, memory-level ops return only entities
            in that bucket; doc-level ops (`ls`/`cat`/`head`/`stat`/`grep`) are
            unaffected either way — documents are not bucket-partitioned. A bucket
            that does not belong to the caller's account+environment is rejected.
      description: |-
        Request-scoping concerns that are orthogonal to the op itself. Carried on a
        `context` object so future scoping hints (e.g. as-of timestamps, read
        consistency) can slot in without reshaping the op-specific fields.
    FSFilter:
      type: object
      properties:
        type:
          type: string
          description: Match an entity's `type` field exactly (e.g. `"drug"`, `"study"`).
        search:
          type: string
          description: |-
            Substring match on canonical name (entities) or `referenceID`
            (parsed docs). Case-insensitive.
        functionName:
          type: string
          description: Match a parsed doc's source function name exactly.
        since:
          type: string
          format: date-time
          description: Restrict to resources created at or after this timestamp.
      description: Filter options for `op=ls` and `op=find`.
    FSOp:
      type: string
      enum:
        - ls
        - find
        - open
        - cat
        - grep
        - xref
        - stat
        - head
      description: |-
        Operations exposed by `POST /v3/fs`.

        The verbs and their flag names mirror Unix tools so an LLM agent's
        existing vocabulary maps directly:

        - `ls` — list parsed documents
        - `cat` — read one parsed doc (optionally sliced by range / projected by select)
        - `grep` — substring or regex search across parse outputs
        - `head` — first N sections of one doc
        - `stat` — metadata only (page count, section count, parsed at, ...)
        - `find` — list canonical entities (cross-doc memory)
        - `open` — entity + mentions
        - `xref` — entity → sections across docs that mention it

        Doc-level ops (ls, cat, grep, head, stat) work on every parsed
        document, regardless of how the parse function was configured.

        Memory-level ops (find, open, xref) operate on the global entities
        table which is only populated when the parse function had
        `linkAcrossDocuments: true`. On environments with no memory-linked
        docs they return empty data with a hint pointing at the toggle.
    FSRange:
      type: object
      properties:
        page:
          type: integer
          description: Restrict sections to one page (1-indexed).
        pageRange:
          type: array
          items:
            type: integer
          minItems: 2
          maxItems: 2
          description: |-
            Restrict sections to an inclusive page range. Two-element array of
            `[from, to]` (both 1-indexed).
        sectionTypes:
          type: array
          items:
            type: string
          description: |-
            Keep only sections whose `type` matches one of these (e.g.
            `["table", "list"]`).
      description: Slice the parse output along page or section dimensions. Used with `op=cat`.
    FSRequest:
      type: object
      required:
        - op
      properties:
        op:
          allOf:
            - $ref: '#/components/schemas/FSOp'
          description: The operation to run. Required.
        context:
          allOf:
            - $ref: '#/components/schemas/FSContext'
          description: |-
            Request-scoping context (currently just the bucket scope). Optional;
            when omitted the request resolves against the account+environment default
            bucket. See `FSContext`.
        path:
          type: string
          description: |-
            Identifier for ops that operate on a single resource:
            - cat / head / stat: a parsed document, by `referenceID` or
            `transformationID`.
            - open / xref / stat: an entity, by `entityID`.
        pattern:
          type: string
          description: Substring or regex pattern for `op=grep`.
        regex:
          type: boolean
          description: When true, `pattern` is interpreted as a Go regex. Default false.
        ignoreCase:
          type: boolean
          description: When true (default), substring/regex matching is case-insensitive.
        scope:
          type: string
          description: |-
            Restricts grep to one part of the parse output. One of
            `"sections"`, `"entities"`, `"relationships"`, `"all"` (default).
        countOnly:
          type: boolean
          description: |-
            When true, return only the hit count without snippet payload.
            Cheaper than fetching matches when the agent only wants a yes/no.
        filter:
          allOf:
            - $ref: '#/components/schemas/FSFilter'
          description: Narrows results for `op=ls` and `op=find`.
        range:
          allOf:
            - $ref: '#/components/schemas/FSRange'
          description: Slices the parse output for `op=cat`.
        select:
          type: array
          items:
            type: string
          description: |-
            Project the parse output to specific dotted paths
            (e.g. `["sections.label", "sections.page"]`), letting an agent map
            a doc's structure cheaply before reading content. Used with
            `op=cat`.
        'n':
          type: integer
          description: First-N count for `op=head`. Defaults to 10.
        limit:
          type: integer
          description: Maximum results to return. Defaults vary per op (25–50).
        cursor:
          type: string
          description: |-
            Pagination cursor. Pass the last item's ID from a previous response
            (`nextCursor`) to fetch the next page.
      description: Request body for `POST /v3/fs`. Op-specific fields apply per op.
    FSResponse:
      type: object
      required:
        - op
        - data
      properties:
        op:
          allOf:
            - $ref: '#/components/schemas/FSOp'
          description: The op echoed back.
        data:
          description: Op-specific payload. See per-op shapes below.
        hasMore:
          type: boolean
          description: True when more pages exist for cursor-paginated ops.
        nextCursor:
          type: string
          description: |-
            Cursor to pass as `cursor` in the next request to fetch the next
            page. Empty when `hasMore=false`.
        count:
          type: integer
          description: |-
            Set for ops that return a count rather than a list (`grep` with
            `countOnly=true`) or as a sanity check on lists.
        hint:
          type: string
          description: |-
            Optional human-readable note. Surfaced on memory-level ops
            (`find` / `open` / `xref`) when the corpus has no memory-linked
            docs, pointing users at the `linkAcrossDocuments` toggle on the
            parse function.
      description: |-
        Uniform response shape returned for every `op`. `data` is op-specific
        JSON (a list, an object, or a string), but the wrapper is constant
        so a client only learns one parse path.
    FailedEvaluationV3:
      type: object
      required:
        - eventID
        - errorMessage
        - createdAt
      properties:
        eventID:
          type: string
          description: Event KSUID.
        errorMessage:
          type: string
          description: Human-readable failure reason.
        createdAt:
          type: string
          format: date-time
          description: Server timestamp associated with the failure.
      description: An event whose evaluation failed or was not found.
    FeedbackFunctionType:
      type: string
      enum:
        - extract
        - classify
        - join
      description: Function types that support feedback submission.
    FeedbackRequest:
      type: object
      required:
        - correction
      properties:
        correction: {}
        orderMatching:
          type: boolean
      description: |-
        Correction payload for V3 event feedback.

        `correction` is polymorphic:
        - For extract/join events: a JSON object matching the function's output schema.
        - For classify events: a JSON string matching one of the function version's declared classifications.

        `orderMatching` is honored only for extract events (defaults to `false`); ignored for join/classify.
    FeedbackResponse:
      type: object
      required:
        - eventID
        - functionType
        - correction
        - createdAt
      properties:
        eventID:
          type: string
        functionType:
          $ref: '#/components/schemas/FeedbackFunctionType'
        correction: {}
        createdAt:
          type: string
          format: date-time
          description: Server timestamp when the correction was persisted (RFC 3339).
      description: Echoed response after a correction is recorded.
    FieldMetricV3:
      type: object
      required:
        - confidenceScore
        - reasoning
        - hallucination
        - relevanceScore
      properties:
        confidenceScore:
          type: number
          format: double
          description: Confidence score for the extracted value (0.0 - 1.0).
        reasoning:
          type: string
          description: Evaluator's natural-language reasoning for the assigned scores.
        hallucination:
          type: boolean
          description: '`true` if this field was flagged as a hallucination.'
        relevanceScore:
          type: number
          format: double
          description: Relevance score for the extracted value (0.0 - 1.0).
      description: Metrics for a single field inside a transformation's output.
    FieldMetrics:
      type: object
      required:
        - fieldPath
      properties:
        fieldPath:
          type: string
          description: JSON path to the field
        metrics:
          $ref: '#/components/schemas/Metrics'
      description: Enhanced field metrics with comprehensive analytics
    FileInput:
      type: object
      required:
        - inputType
        - inputContent
      properties:
        inputType:
          allOf:
            - $ref: '#/components/schemas/InputType'
          description: |-
            The input type of the content you're sending for transformation.

            Must match the actual file format. See `InputType` for allowed values.
        inputContent:
          type: string
          contentEncoding: base64
          description: >-
            Base64-encoded file content. In the Bem CLI, use `@path/to/file` to embed file contents
            automatically.
      description: |-
        A single file input with base64-encoded content.

        When using the Bem CLI, use `@path/to/file` in the `inputContent` field to
        automatically read and base64-encode the file:
        `--input.single-file '{"inputContent": "@file.pdf", "inputType": "pdf"}' --wait`
    FunctionAudit:
      type: object
      properties:
        functionCreatedBy:
          allOf:
            - $ref: '#/components/schemas/UserActionSummary'
          description: Information about who created the function.
        functionLastUpdatedBy:
          allOf:
            - $ref: '#/components/schemas/UserActionSummary'
          description: Information about who last updated the function.
        versionCreatedBy:
          allOf:
            - $ref: '#/components/schemas/UserActionSummary'
          description: Information about who created the current version.
    FunctionCallCreateInput:
      type: object
      properties:
        singleFile:
          allOf:
            - $ref: '#/components/schemas/FileInput'
          description: >-
            A single file to process. Use `--input.single-file '{"inputContent": "@file.pdf", "inputType":
            "pdf"}'` in the CLI.
        batchFiles:
          allOf:
            - $ref: '#/components/schemas/BatchFilesInput'
          description: >-
            Multiple files to process in one call. Each item in the `inputs` array has its own `inputContent`
            and `inputType`.
      description: |-
        Input file(s) for a call. Provide exactly one of `singleFile` or `batchFiles`.

        In the CLI, use the nested flags `--input.single-file` or `--input.batch-files`
        with `@path/to/file` for automatic file embedding:
        `--input.single-file '{"inputContent": "@invoice.pdf", "inputType": "pdf"}' --wait`
    FunctionCallCreateInputResponse:
      type: object
      properties:
        singleFile:
          $ref: '#/components/schemas/SingleFileInputResponse'
        batchFiles:
          $ref: '#/components/schemas/BatchFilesInputResponse'
    FunctionCallInputResponse:
      type: object
      properties:
        inputType:
          type: string
          description: Input type of the file
        itemReferenceID:
          type: string
          description: Item reference ID for batch inputs
        s3URL:
          type: string
          description: Presigned S3 URL for the file input
    FunctionCallResponseBase:
      type: object
      required:
        - functionCallID
        - functionID
        - functionName
        - type
        - referenceID
        - status
        - startedAt
      properties:
        functionCallID:
          type: string
          description: Unique identifier for this function call
        functionID:
          type: string
          description: ID of the function that was called
        functionName:
          type: string
          description: Name of the function that was called
        type:
          $ref: '#/components/schemas/FunctionType'
        referenceID:
          type: string
          description: User-provided reference ID for tracking
        status:
          $ref: '#/components/schemas/ActionStatus'
        functionVersionNum:
          type: integer
          description: Version number of the function
        activity:
          type: array
          items:
            type: object
            properties:
              displayName:
                type: string
              status:
                type: string
                enum:
                  - pending
                  - running
                  - completed
                  - failed
          description: Array of activity steps for this function call
        startedAt:
          type: string
          format: date-time
          description: The date and time this function call started.
        finishedAt:
          type: string
          format: date-time
          description: The date and time this function call finished. Absent while still running.
        sourceFunctionCallID:
          type: string
          description: ID of the function call that spawned this function call (for DAG reconstruction)
        sourceEventID:
          type: string
          description: >-
            ID of the event that spawned this function call (for DAG reconstruction). Nil for the root
            function call.
        workflowCallID:
          type: string
          description: ID of the workflow call this function call belongs to (top-level execution context)
        workflowNodeName:
          type: string
          description: >-
            Name of the workflow DAG call-site node this function call is executing. Absent for non-workflow
            calls and pre-migration rows.
        incomingDestinationName:
          type: string
          description: >-
            The labelled outlet on the upstream node that routed execution to this call. Absent for root
            calls, unlabelled edges, and pre-migration rows.
        inputType:
          type: string
          description: Input type for single file input (set when there's exactly one file input)
        s3URL:
          type: string
          description: Presigned S3 URL for single file input (set when there's exactly one file input)
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/FunctionCallInputResponse'
          description: Array of all file inputs with their S3 URLs
    FunctionCopyRequest:
      type: object
      required:
        - sourceFunctionName
        - targetFunctionName
      properties:
        sourceFunctionName:
          type: string
          description: Name of the function to copy from. Must be a valid existing function name.
        targetFunctionName:
          type: string
          description: Name for the new copied function. Must be unique within the target environment.
        targetDisplayName:
          type: string
          description: >-
            Optional display name for the copied function. If not provided, defaults to the source function's
            display name with " (Copy)" appended.
        targetEnvironment:
          type: string
          description: >-
            Optional environment name to copy the function to. If not provided, the function will be copied
            within the same environment.
        tags:
          type: array
          items:
            type: string
          description: >-
            Optional array of tags for the copied function. If not provided, defaults to the source function's
            tags.
      description: Request to copy an existing function with a new name and optional customizations.
    FunctionIdentifier:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of function. Provide either id or name, not both.
        name:
          type: string
          description: Name of function. Must be UNIQUE on a per-environment basis. Provide either id or name, not both.
    FunctionMetrics:
      type: object
      required:
        - functionName
        - totalLabeledResults
        - totalResults
        - metrics
      properties:
        functionName:
          type: string
          description: The function name
        totalLabeledResults:
          type: integer
          description: Number of transformations that have been labeled/evaluated for metrics calculation
        totalResults:
          type: integer
          description: Total number of results processed by the function
        metrics:
          type: object
          properties:
            accuracy:
              anyOf:
                - type: number
                  format: float
                - type: 'null'
            precision:
              anyOf:
                - type: number
                  format: float
                - type: 'null'
            recall:
              anyOf:
                - type: number
                  format: float
                - type: 'null'
            f1Score:
              anyOf:
                - type: number
                  format: float
                - type: 'null'
            tp:
              type: integer
            fp:
              type: integer
            tn:
              type: integer
            fn:
              type: integer
          required:
            - accuracy
            - precision
            - recall
            - f1Score
            - tp
            - fp
            - tn
            - fn
          title: Metrics
      title: Function Metrics
    FunctionMetricsResponse:
      type: object
      required:
        - functions
        - totalCount
      properties:
        functions:
          type: array
          items:
            $ref: '#/components/schemas/FunctionMetrics'
        totalCount:
          type: integer
          description: Total number of functions
    FunctionResponseV3:
      type: object
      required:
        - function
      properties:
        function:
          $ref: '#/components/schemas/FunctionV3'
      description: |-
        Single-function response wrapper used by V3 function endpoints.
        V3 wraps individual function responses in a `{"function": ...}` envelope
        for consistency with other V3 resource endpoints.
    FunctionReviewRequest:
      type: object
      required:
        - functionName
      properties:
        functionName:
          type: string
          description: Name of the function to analyze
        functionVersionNum:
          type: integer
          minimum: 1
          description: >-
            Optional function version number to analyze. If not provided, uses the latest/current version of
            the function.
        evaluationVersion:
          type: string
          enum:
            - 0.1.0-gemini
          description: >-
            Optional evaluation version to filter evaluations by. Must be one of the supported versions. If
            not provided, defaults to "0.1.0-gemini".
          default: 0.1.0-gemini
        marginOfError:
          type: number
          format: float
          minimum: 0.001
          maximum: 0.1
          description: Margin of error for statistical calculations
          default: 0.05
        thresholdMin:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Minimum confidence threshold to analyze
          default: 0.5
        thresholdMax:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Maximum confidence threshold to analyze
          default: 1
        thresholdStep:
          type: number
          format: float
          minimum: 0.001
          maximum: 0.1
          description: Step size for threshold analysis (smaller = more granular)
          default: 0.01
        confidenceLevels:
          type: array
          items:
            type: integer
          description: >-
            Confidence levels for statistical analysis as integers representing percentages (e.g., [90, 95,
            99] for 90%, 95%, 99%). IMPORTANT: Only integers are accepted, floats like 0.95 will be rejected.
          default:
            - 95
        confidenceMethod:
          type: string
          enum:
            - wald
            - wilson
          description: |-
            Confidence interval calculation method (default "wald").

            - "wald": Normal approximation method (faster, standard)
            - "wilson": Wilson score interval (more robust for extreme rates)
          default: wald
        isRegression:
          type: boolean
          description: Internal flag indicating if the request is from a regression test
      description: Request for estimating review requirements for a function
    FunctionReviewResponse:
      type: object
      required:
        - functionName
        - functionVersionNum
        - estimate
      properties:
        functionName:
          type: string
          description: Name of the analyzed function
        functionVersionNum:
          type: integer
          description: Version number of the function that was analyzed
        estimate:
          $ref: '#/components/schemas/ReviewEstimate'
        metrics:
          allOf:
            - $ref: '#/components/schemas/MetricsDetails'
          description: Detailed performance metrics and analysis
      description: Response containing review requirements estimate
    FunctionType:
      type: string
      enum:
        - transform
        - extract
        - route
        - classify
        - send
        - split
        - join
        - analyze
        - payload_shaping
        - enrich
        - parse
        - render
      description: The type of the function.
    FunctionV3:
      type: object
      oneOf:
        - $ref: '#/components/schemas/TransformFunction'
        - $ref: '#/components/schemas/ExtractFunction'
        - $ref: '#/components/schemas/AnalyzeFunction'
        - $ref: '#/components/schemas/ClassifyFunction'
        - $ref: '#/components/schemas/SendFunction'
        - $ref: '#/components/schemas/SplitFunction'
        - $ref: '#/components/schemas/JoinFunction'
        - $ref: '#/components/schemas/PayloadShapingFunction'
        - $ref: '#/components/schemas/EnrichFunction'
        - $ref: '#/components/schemas/ParseFunction'
        - $ref: '#/components/schemas/RenderFunction'
      discriminator:
        propertyName: type
        mapping:
          transform: '#/components/schemas/TransformFunction'
          extract: '#/components/schemas/ExtractFunction'
          analyze: '#/components/schemas/AnalyzeFunction'
          classify: '#/components/schemas/ClassifyFunction'
          send: '#/components/schemas/SendFunction'
          split: '#/components/schemas/SplitFunction'
          join: '#/components/schemas/JoinFunction'
          payload_shaping: '#/components/schemas/PayloadShapingFunction'
          enrich: '#/components/schemas/EnrichFunction'
          parse: '#/components/schemas/ParseFunction'
          render: '#/components/schemas/RenderFunction'
      description: |-
        V3 read-side union. Same shape as the shared `Function` union but with
        `classify` in place of `route`. Legacy `transform` and `analyze` functions
        remain readable via V3.
    FunctionVersionIdentifier:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of function. Provide either id or name, not both.
        name:
          type: string
          description: Name of function. Must be UNIQUE on a per-environment basis. Provide either id or name, not both.
        versionNum:
          type: integer
          description: Version number of function.
    FunctionVersionResponseV3:
      type: object
      required:
        - function
      properties:
        function:
          $ref: '#/components/schemas/FunctionVersionV3'
      description: Single-function-version response wrapper used by V3 endpoints.
    FunctionVersionV3:
      type: object
      oneOf:
        - $ref: '#/components/schemas/TransformFunctionVersion'
        - $ref: '#/components/schemas/ExtractFunctionVersion'
        - $ref: '#/components/schemas/AnalyzeFunctionVersion'
        - $ref: '#/components/schemas/ClassifyFunctionVersion'
        - $ref: '#/components/schemas/SendFunctionVersion'
        - $ref: '#/components/schemas/SplitFunctionVersion'
        - $ref: '#/components/schemas/JoinFunctionVersion'
        - $ref: '#/components/schemas/EnrichFunctionVersion'
        - $ref: '#/components/schemas/PayloadShapingFunctionVersion'
        - $ref: '#/components/schemas/ParseFunctionVersion'
        - $ref: '#/components/schemas/RenderFunctionVersion'
      discriminator:
        propertyName: type
        mapping:
          transform: '#/components/schemas/TransformFunctionVersion'
          extract: '#/components/schemas/ExtractFunctionVersion'
          analyze: '#/components/schemas/AnalyzeFunctionVersion'
          classify: '#/components/schemas/ClassifyFunctionVersion'
          send: '#/components/schemas/SendFunctionVersion'
          split: '#/components/schemas/SplitFunctionVersion'
          join: '#/components/schemas/JoinFunctionVersion'
          enrich: '#/components/schemas/EnrichFunctionVersion'
          payload_shaping: '#/components/schemas/PayloadShapingFunctionVersion'
          parse: '#/components/schemas/ParseFunctionVersion'
          render: '#/components/schemas/RenderFunctionVersion'
      description: |-
        V3 read-side union for function versions. Same shape as the shared
        `FunctionVersion` union but with `classify` in place of `route`.
    GetWorkflowVersionResponseV3:
      type: object
      properties:
        workflow:
          $ref: '#/components/schemas/WorkflowV3'
        error:
          type: string
          description: Error message if the workflow version retrieval failed.
    GraphEdgeV3:
      type: object
      required:
        - sourceId
        - targetId
        - relationType
        - mentionCount
      properties:
        sourceId:
          type: string
          description: Source entity public id (`ent_...`).
        targetId:
          type: string
          description: Target entity public id (`ent_...`).
        relationType:
          type: string
          description: Free-form relation label.
        mentionCount:
          type: integer
          format: int32
          description: How many times this edge has been observed.
      description: One directed edge between two entities, addressed by their public ids.
    GraphNodeV3:
      type: object
      required:
        - id
        - canonical
        - type
        - mentionCount
        - depth
      properties:
        id:
          type: string
          description: Stable public identifier for the entity (`ent_...`).
        canonical:
          type: string
          description: Canonical (most descriptive) surface form.
        type:
          type: string
          description: Effective entity type.
        mentionCount:
          type: integer
          format: int32
          description: Total mentions of this entity across all parsed documents.
        depth:
          type: integer
          format: int32
          description: |-
            Hops from the center node when the request centers the graph on one entity
            (`nodeID`). The center is depth 0. When the request is uncentered (no
            `nodeID`), this is 0 for every node.
      description: One entity node in the knowledge graph.
    HTTPError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Error message describing what went wrong
        code:
          type: integer
          description: HTTP status code
        details:
          type: object
          unevaluatedProperties: {}
          description: Additional error details (optional)
          title: Error Details
      description: Standard HTTP error response
    InboundRelationV3:
      type: object
      required:
        - relationType
        - sourceEntity
        - mentionCount
        - firstSeenAt
      properties:
        relationType:
          type: string
          description: Free-form relation label (e.g. `author_of`, `affiliated_with`).
        sourceEntity:
          allOf:
            - $ref: '#/components/schemas/RelatedEntityV3'
          description: The entity at the tail of the edge.
        mentionCount:
          type: integer
          format: int32
          description: How many times this edge has been observed across parsed documents.
        firstSeenAt:
          type: string
          format: date-time
          description: First-seen timestamp of the edge (RFC 3339).
      description: One edge pointing AT the queried entity (some other entity is the source).
    InferSchemaAnalysis:
      type: object
      required:
        - fileName
        - contentType
        - sizeBytes
        - fileType
        - description
        - isMultiDocument
        - documentTypes
        - contentNature
      properties:
        fileName:
          type: string
          description: Original filename of the uploaded file.
          title: File Name
        contentType:
          type: string
          description: MIME content type of the uploaded file.
          title: Content Type
        sizeBytes:
          type: integer
          description: Size of the uploaded file in bytes.
          title: Size in Bytes
        fileType:
          type: string
          description: High-level file category (e.g. "document", "image", "spreadsheet", "email").
          title: File Type
        description:
          type: string
          description: 2-3 sentence description of what the file contains.
        schema:
          type: object
          unevaluatedProperties: {}
          description: Inferred JSON Schema representing all extractable data fields.
        isMultiDocument:
          type: boolean
          description: Whether the file contains multiple separate documents bundled together.
        documentTypes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentTypeInfo'
          description: List of distinct document types found in the file with counts.
        contentNature:
          type: string
          description: |-
            Classification of the primary content.
            One of: `textual`, `visual`, `audio`, `video`, `mixed`.
      description: Analysis result returned by the infer-schema endpoint.
    InferSchemaMultipartFormData:
      type: object
      properties:
        file:
          description: The file to analyze and infer a JSON schema from.
      required:
        - file
    InferSchemaResponseV3:
      type: object
      required:
        - filename
        - analysis
      properties:
        filename:
          type: string
          description: Original filename of the uploaded file.
        analysis:
          allOf:
            - $ref: '#/components/schemas/InferSchemaAnalysis'
          description: Full analysis result including description, schema, and document classification.
      description: Response from the infer-schema endpoint.
    InputType:
      type: string
      enum:
        - csv
        - docx
        - email
        - heic
        - html
        - jpeg
        - json
        - heif
        - m4a
        - mov
        - mp3
        - mp4
        - pdf
        - png
        - text
        - wav
        - webp
        - xls
        - xlsx
        - xml
      description: The input type of the content you're sending for transformation.
    JoinEvent:
      type: object
      required:
        - eventID
        - referenceID
        - functionID
        - functionName
        - joinType
        - transformedContent
        - invalidProperties
        - items
      properties:
        functionCallTryNumber:
          type: integer
          description: The attempt number of the function call that created this event. 1 indexed.
        eventID:
          type: string
          description: Unique ID generated by bem to identify the event.
        createdAt:
          type: string
          format: date-time
          description: Timestamp indicating when the event was created.
        referenceID:
          type: string
          description: >-
            The unique ID you use internally to refer to this data point, propagated from the original
            function input.
        inboundEmail:
          allOf:
            - $ref: '#/components/schemas/EventInboundEmail'
          description: The inbound email that triggered this event.
        metadata:
          type: object
          properties:
            durationFunctionToEventSeconds:
              type: number
        eventType:
          type: string
          enum:
            - join
        functionCallID:
          type: string
          description: Unique identifier of function call that this event is associated with.
        functionID:
          type: string
          description: Unique identifier of function that this event is associated with.
        functionName:
          type: string
          description: Unique name of function that this event is associated with.
        functionVersionNum:
          type: integer
          description: Version number of function that this event is associated with.
        callID:
          type: string
          description: Unique identifier of workflow call that this event is associated with.
        workflowID:
          type: string
          description: Unique identifier of workflow that this event is associated with.
        workflowName:
          type: string
          description: Name of workflow that this event is associated with.
        workflowVersionNum:
          type: integer
          description: Version number of workflow that this event is associated with.
        joinType:
          type: string
          enum:
            - standard
          description: The type of join that was performed.
        transformationID:
          type: string
          description: Unique ID for each transformation output generated by bem following Segment's KSUID conventions.
        transformedContent:
          type: object
          unevaluatedProperties: {}
          description: >-
            The transformed content of the input. The structure of this object is defined by the function
            configuration.
        invalidProperties:
          type: array
          items:
            type: string
          description: List of properties that were invalid in the input.
        items:
          type: array
          items:
            $ref: '#/components/schemas/JoinEventItem'
          description: The items that were joined.
        fieldConfidences:
          type: object
          unevaluatedProperties:
            type: number
            format: float
          description: >-
            Per-field confidence scores. A JSON object mapping RFC 6901 JSON Pointer paths (e.g.
            `"/invoiceNumber"`)

            to float values in the range [0, 1] indicating the model's confidence in each extracted field
            value.
        avgConfidence:
          anyOf:
            - type: number
              format: float
            - type: 'null'
          description: Average confidence score across all extracted fields, in the range [0, 1].
      title: Join Event
    JoinEventItem:
      type: object
      required:
        - itemReferenceID
        - itemOffset
        - itemCount
      properties:
        itemReferenceID:
          type: string
          description: The unique ID you use internally to refer to this data point.
        itemOffset:
          type: integer
          description: >-
            The offset of the first item that was transformed. Used for batch transformations to indicate
            which item in the batch this event corresponds to.
        itemCount:
          type: integer
          description: The number of items that were transformed.
        s3URL:
          type: string
          description: The presigned S3 URL of the file that was joined.
    JoinFunction:
      type: object
      required:
        - functionID
        - functionName
        - versionNum
        - type
        - description
        - joinType
        - outputSchemaName
        - outputSchema
      properties:
        functionID:
          type: string
          description: Unique identifier of function.
        functionName:
          type: string
          description: Name of function. Must be UNIQUE on a per-environment basis.
        versionNum:
          type: integer
          description: Version number of function.
        usedInWorkflows:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowUsageInfo'
          description: List of workflows that use this function.
        displayName:
          type: string
          description: Display name of function. Human-readable name to help you identify the function.
        tags:
          type: array
          items:
            type: string
          description: Array of tags to categorize and organize functions.
        audit:
          allOf:
            - $ref: '#/components/schemas/FunctionAudit'
          description: Audit trail information for the function.
        type:
          type: string
          enum:
            - join
        description:
          type: string
          description: Description of join function.
        joinType:
          type: string
          enum:
            - standard
          description: The type of join to perform.
        outputSchemaName:
          type: string
          description: Name of output schema object.
        outputSchema:
          type: object
          unevaluatedProperties: {}
          description: Desired output structure defined in standard JSON Schema convention.
      title: Join Function
    JoinFunctionVersion:
      type: object
      required:
        - functionID
        - functionName
        - versionNum
        - type
        - description
        - joinType
        - outputSchemaName
        - outputSchema
      properties:
        functionID:
          type: string
          description: Unique identifier of function.
        functionName:
          type: string
          description: Name of function. Must be UNIQUE on a per-environment basis.
        versionNum:
          type: integer
          description: Version number of function.
        usedInWorkflows:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowUsageInfo'
          description: List of workflows that use this function.
        displayName:
          type: string
          description: Display name of function. Human-readable name to help you identify the function.
        tags:
          type: array
          items:
            type: string
          description: Array of tags to categorize and organize functions.
        createdAt:
          type: string
          format: date-time
          description: The date and time the function version was created.
        audit:
          allOf:
            - $ref: '#/components/schemas/FunctionAudit'
          description: Audit trail information for the function version.
        type:
          type: string
          enum:
            - join
        description:
          type: string
          description: Description of join function.
        joinType:
          type: string
          enum:
            - standard
          description: The type of join to perform.
        outputSchemaName:
          type: string
          description: Name of output schema object.
        outputSchema:
          type: object
          unevaluatedProperties: {}
          description: Desired output structure defined in standard JSON Schema convention.
    KnowledgeGraphResponseV3:
      type: object
      required:
