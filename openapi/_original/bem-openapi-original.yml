            - type: string
            - type: 'null'
          description: Presigned S3 URL of the input file that was analyzed.
        fieldBoundingBoxes:
          type: object
          unevaluatedProperties: {}
          description: >-
            Per-field bounding boxes. A JSON object mapping RFC 6901 JSON Pointer paths (e.g.
