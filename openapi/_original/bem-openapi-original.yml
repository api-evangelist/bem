    RateConfidenceInterval:
      type: object
      required:
        - currentSample
        - sampleNeeded
      properties:
        ciLower:
          anyOf:
            - type: number
              format: float
            - type: 'null'
          minimum: 0
          maximum: 1
          description: Lower bound of the confidence interval (null if insufficient sample size)
        mid:
          anyOf:
            - type: number
              format: float
            - type: 'null'
          minimum: 0
          maximum: 1
          description: Point estimate (observed rate) at the center of the interval (null if insufficient sample size)
        ciUpper:
          anyOf:
            - type: number
              format: float
            - type: 'null'
          minimum: 0
          maximum: 1
          description: Upper bound of the confidence interval (null if insufficient sample size)
        currentSample:
          type: integer
          minimum: 0
          description: Current number of samples/observations available
        sampleNeeded:
          type: integer
          minimum: 0
          description: Minimum number of samples needed for reliable confidence interval calculation
      description: |-
        Confidence interval for a rate/proportion using Wald (normal approximation) method by default.

        Wald confidence intervals use the normal approximation to the binomial distribution.
        For extreme rates or small sample sizes, Wilson confidence intervals may be more appropriate.
    RelatedEntityV3:
      type: object
      required:
        - id
        - canonical
        - type
        - depth
      properties:
        id:
          type: string
          description: Stable public identifier for the entity (`ent_...`).
        canonical:
          type: string
          description: Canonical (most descriptive) surface form of the entity.
        type:
          type: string
          description: Effective entity type.
        depth:
          type: integer
          format: int32
          description: |-
            Hops from the queried entity. This endpoint returns direct relations, so
            this is 1 (a self-loop's far end is the queried entity itself, 0).
      description: |-
        A compact view of an entity sitting on the far end of a relation edge — the
        stable public id, the canonical name, and the effective type. The full
        entity is fetched separately via the entity detail / File System endpoints.
    RenderConfig:
      type: object
      properties:
        template:
          allOf:
            - $ref: '#/components/schemas/RenderTemplate'
          description: |-
            The uploaded template: its filename, a short-lived presigned download URL,
            and the placeholder/style contract derived from it. Absent on configs
            created before template capture existed.
      description: |-
        Per-version configuration for a Render function.

        Render emits a `.docx` from schema-typed JSON by composing the JSON into a
        `.docx` template. The template document is stored server-side; this response
