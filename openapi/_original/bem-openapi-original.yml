    UpsertClassifyFunction:
      type: object
      required:
        - type
      properties:
        functionName:
          type: string
          description: Name of function. Must be UNIQUE on a per-environment basis.
        displayName:
          type: string
          description: Display name of function. Human-readable name to help you identify the function.
        tags:
          type: array
          items:
            type: string
          description: Array of tags to categorize and organize functions.
        type:
          type: string
          enum:
            - classify
        description:
          type: string
          description: >-
            Description of classifier. Can be used to provide additional context on classifier's purpose and
            expected inputs.
        classifications:
          $ref: '#/components/schemas/ClassificationList'
      description: |-
        V3 create/update variants of the shared function payloads.

        The V3 Functions API no longer accepts the legacy `transform` or `analyze`
        function types when creating new functions or updating existing ones — both
        have been unified under `extract`. Existing functions of those types remain
        readable and callable via V3, so the V3 read-side unions still include
        `transform` and `analyze` variants.

        The V3 API also exposes `classify` in place of the legacy `route` type on
        create/update, with `classifications` in place of `routes`. Read-side
        `ClassifyFunction` / `ClassifyFunctionVersion` / `ClassificationList` are
        defined in the shared functions models and used by both the V2 and V3
        response unions (existing classify functions are returned from V2 GET
        endpoints verbatim).V3 wire form of the classify function upsert payload.
      title: Classify Function
    UpsertEnrichFunction:
      type: object
      required:
        - type
      properties:
        config:
          $ref: '#/components/schemas/enrichConfig'
        type:
          type: string
          enum:
            - enrich
    UpsertExtractFunction:
      type: object
      required:
        - type
      properties:
        functionName:
          type: string
          description: Name of function. Must be UNIQUE on a per-environment basis.
        displayName:
          type: string
          description: Display name of function. Human-readable name to help you identify the function.
        tags:
          type: array
          items:
            type: string
          description: Array of tags to categorize and organize functions.
        type:
          type: string
          enum:
            - extract
        outputSchemaName:
          type: string
          description: Name of output schema object.
        outputSchema:
          type: object
          unevaluatedProperties: {}
          description: Desired output structure defined in standard JSON Schema convention.
        tabularChunkingEnabled:
          type: boolean
          description: |-
            Whether tabular chunking is enabled. When true, tables in CSV/Excel files are processed
            in row batches rather than all at once.
        enableBoundingBoxes:
          type: boolean
          description: |-
            Whether bounding box extraction is enabled. Applies to vision input types
            (pdf, png, jpeg, heic, heif, webp) that dispatch through the analyze path.
            When true, the function returns the document regions (page, coordinates) from which each
            field was extracted. Enabling this automatically configures the function to use the bounding
            box model. Disabling resets to the default.
        preCount:
          type: boolean
          description: |-
            Reducing the risk of the model stopping early on long documents.
            Trade-off: Increases total latency. Compatible with
            `enableBoundingBoxes`.
      title: Extract Function
