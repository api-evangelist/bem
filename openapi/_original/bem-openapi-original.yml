  /v3/errors:
    get:
      operationId: v3-list-errors
      summary: List Errors
      description: |-
        **List terminal error events.**

        Returns error events produced by failed function calls within workflow executions.
        Non-error output events are excluded; use `GET /v3/outputs` to retrieve those.

        ## Filtering

        Filter by call, workflow, function, or reference ID. Multiple filters are ANDed together.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: callIDs
          in: query
          required: false
          description: Filter to errors from specific calls.
          schema:
            type: array
            items:
              type: string
            minItems: 1
          explode: false
        - name: workflowIDs
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
            minItems: 1
          explode: false
        - name: workflowNames
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
            minItems: 1
          explode: false
        - name: functionIDs
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
            minItems: 1
          explode: false
        - name: functionNames
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
            minItems: 1
          explode: false
        - name: referenceIDs
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
            minItems: 1
          explode: false
        - name: referenceIDSubstring
          in: query
          required: false
          description: Case-insensitive substring match against `referenceID`.
          schema:
            type: string
          explode: false
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - name: startingAfter
          in: query
          required: false
          schema:
            type: string
        - name: endingBefore
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListErrorsResponseV3'
      tags:
        - Errors
  /v3/errors/{eventID}:
    get:
      operationId: v3-get-error
      summary: Get an Error
      description: |-
        **Retrieve a single error event by ID.**

        Returns `404` if the event does not exist or if it is not an error event
        (use `GET /v3/outputs/{eventID}` for non-error events).
      parameters:
        - name: eventID
          in: path
          required: true
          description: The unique identifier of the error event.
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEventResponseV3'
      tags:
        - Errors
  /v3/eval:
    post:
      operationId: v3-trigger-transformation-evaluations
      summary: Trigger Transformation Evaluations
      description: |-
        **Queue evaluation jobs for a batch of transformations.**

        Evaluations run asynchronously and score each transformation's output
        against the function's schema for confidence, hallucination detection,
        and relevance. Transformations must belong to events of a supported
        type: `extract`, `transform`, `analyze`, or `join`.

        Returns immediately with a summary of queued vs. skipped transformations
        and per-transformation errors. Poll `GET /v3/eval/results` to retrieve
        results once evaluations complete.
      parameters: []
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerEvaluationsResponseV3'
              examples:
                One transformation rejected for unsupported event type:
                  summary: One transformation rejected for unsupported event type
                  value:
                    queued: 1
                    skipped: 0
                    errors:
                      tr_01HXCD...: >-
                        unsupported event type for evaluation: split. Only 'analyze', 'transform', 'extract',
                        and 'join' are supported
                Both transformations queued:
                  summary: Both transformations queued
                  value:
                    queued: 2
                    skipped: 0
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
      tags:
        - Function Accuracy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerEvaluationsRequestV3'
            examples:
              Queue evaluations for two transformations:
                summary: Queue evaluations for two transformations
                value:
                  transformationIDs:
                    - tr_01HXAB...
                    - tr_01HXCD...
                  evaluationVersion: 0.1.0-gemini
  /v3/eval/results:
    get:
      operationId: v3-get-evaluation-results
      summary: Get Evaluation Results
      description: |-
        **Fetch evaluation results for a batch of events.**

        Pass either `eventIDs` (preferred — the externally-stable V3
        identifier) or `transformationIDs` as a comma-separated query
        parameter. Exactly one of the two must be provided. Up to 100 IDs per
        request.

        For each requested ID the response reports one of three states: a
        completed `result`, still-`pending`, or `failed`. Results, pending,
        and failed entries are all keyed by event KSUID regardless of which
        input form was used.
      parameters:
        - name: eventIDs
          in: query
          required: false
          description: |-
            Comma-separated list of event KSUIDs to fetch results for. Between
            1 and 100 IDs per request. Mutually exclusive with
            `transformationIDs`.
          schema:
            type: string
          explode: false
        - name: transformationIDs
          in: query
          required: false
          description: |-
            Comma-separated list of transformation IDs to fetch results for.
            Between 1 and 100 IDs per request. Mutually exclusive with
            `eventIDs`. Prefer `eventIDs` for new integrations.
          schema:
            type: string
          explode: false
        - name: evaluationVersion
          in: query
          required: false
          description: Optional evaluation version filter.
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationResultsResponseV3'
              examples:
                One completed, one still pending:
                  summary: One completed, one still pending
                  value:
                    results:
                      evt_01HXAB...:
                        fieldMetrics:
                          /invoice/number:
                            confidenceScore: 0.97
                            reasoning: Matches canonical invoice number in the source document.
                            hallucination: false
                            relevanceScore: 1
                        overallConfidence: 0.97
                        runtime: 3.42
                        hasHallucinations: false
                        evaluationVersion: 0.1.0-gemini
                        createdAt: '2026-04-23T18:05:00Z'
                    pending:
                      - eventID: evt_01HXCD...
                        createdAt: '2026-04-23T18:04:55Z'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
      tags:
        - Function Accuracy
  /v3/eval/score:
    post:
      operationId: v3-eval-score-create
      summary: Score Function Against (input, expected) Pairs
      description: |-
        **Score a function against a list of (input, expected) pairs.**

        Submits a batch of `(input, expected)` pairs, runs the named function
        over each input, and returns per-pair + aggregate accuracy metrics
        comparing the function's actual output to the provided expected JSON.

        Scoring runs asynchronously. The response carries a `scoreRunID`;
        poll `GET /v3/eval/score/{scoreRunID}` until `status` is one of
        `completed`, `error`, or `cancelled`.

        `matchConfig` controls comparator behavior:
        - `numericTolerance`: relative tolerance for numeric fields (0 = exact)
        - `stringMatch`: `exact` (default) or `fuzzy` (Levenshtein ratio)
        - `arrayMatch`: `by-index` (default; only mode in P0)
        - `ignorePaths`: JSON Pointer paths to skip, supports `*` wildcards
      parameters: []
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalScoreCreateResponseV3'
              examples:
                Score one PDF against expected values:
                  summary: Score one PDF against expected values
                  value:
                    scoreRunID: evalrun_2a8f...
                    status: pending
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
      tags:
        - Function Accuracy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvalScoreRequestV3'
  /v3/eval/score/{scoreRunID}:
    get:
      operationId: v3-eval-score-get
      summary: Get Score Run
      description: |-
        **Get the status and per-pair results of a score run.**

        Returns `aggregate` only once `status` reaches `completed`. `perPair`
        is populated incrementally — each pair's `fieldResults` appears as
        its underlying function call terminates.
      parameters:
        - name: scoreRunID
          in: path
          required: true
          description: The `scoreRunID` returned by `POST /v3/eval/score`.
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalScoreRunResponseV3'
              examples:
                Completed run with a perfect score:
                  summary: Completed run with a perfect score
                  value:
                    scoreRunID: evalrun_2a8f...
                    status: completed
                    functionName: invoice-extractor
                    functionVersionNum: 3
                    matchConfig:
                      numericTolerance: 0.01
                      stringMatch: exact
                    progress:
                      total: 1
                      completed: 1
                      failed: 0
                    aggregate:
                      precision: 1
                      recall: 1
                      f1: 1
                      exactMatches: 2
                      withinTolerance: 0
                      fuzzyMatches: 0
                      misses: 0
                      extras: 0
                      totalFieldsExpected: 2
                      totalFieldsActual: 2
                    perPair:
                      - pairIndex: 0
                        callID: call_xxx
                        status: completed
                        fieldResults:
                          - path: /invoiceNumber
                            match: exact
                          - path: /total
                            match: exact
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
      tags:
        - Function Accuracy
  /v3/eval/score/{scoreRunID}/cancel:
    post:
      operationId: v3-eval-score-cancel
      summary: Cancel Score Run
      description: |-
        **Cancel an in-flight score run.**

        Transitions the run to `cancelled`. Function calls already in flight
        are allowed to finish (best-effort cancellation via the job queue);
        results from completed pairs may still appear in subsequent GETs.
      parameters:
        - name: scoreRunID
          in: path
          required: true
          description: The `scoreRunID` returned by `POST /v3/eval/score`.
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalScoreRunResponseV3'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
      tags:
        - Function Accuracy
  /v3/events/{eventID}/feedback:
    post:
      operationId: v3-submit-event-feedback
      summary: Submit Event Feedback
      description: |-
        **Submit a correction for an event.**

        Accepts training corrections for `extract`, `classify`, and `join` events.
        For extract/join events, `correction` is a JSON object matching the function's
        output schema. For classify events, `correction` is a JSON string matching
        one of the function version's declared classifications.

        Submitting feedback again for the same event overwrites the previous correction.

        Unsupported function types (split, enrich) return `400`.
      parameters:
        - name: eventID
          in: path
          required: true
          description: The unique identifier of the event being corrected.
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
      tags:
        - Feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
  /v3/fs:
    post:
      operationId: v3-fs
      summary: File System Operations
      description: |-
        **Navigate parsed documents and the cross-doc memory store via Unix-shell verbs.**

        `POST /v3/fs` is a single op-driven endpoint that lets an LLM agent
        (or any programmatic client) walk a corpus the way it would walk a
        filesystem — `ls` to list, `cat` to read, `grep` to search, `head`
        for a quick peek, `stat` for metadata, and `find` / `open` / `xref`
        for the cross-doc entity memory layer.

        The body always carries an `op` field; other fields apply per op.
        The response envelope is uniform: `{op, data, hasMore?, nextCursor?, count?, hint?}`.

        ## Quick reference

        | Op | `path` | Other fields | What it does |
        |----|--------|-------------|--------------|
        | `ls` | — | `filter`, `limit`, `cursor` | List parsed documents |
        | `grep` | referenceID *(optional)* | `pattern`, `scope`, `countOnly` | Search across documents |
        | `cat` | referenceID | `range`, `select` | Read a document's parsed content |
        | `head` | referenceID | `n` | First N sections (default 10) |
        | `stat` | referenceID *or* entityID | — | Metadata only |
        | `find` | — | `filter`, `limit`, `cursor` | List canonical entities |
        | `open` | entityID | — | Entity detail + all mentions |
        | `xref` | entityID | `limit`, `cursor` | Sections across docs mentioning an entity |

        **`path`** is the positional identifier. For doc ops (`cat`, `head`,
        `stat`), pass a `referenceID` from `ls`. For entity ops (`open`,
        `xref`), pass an `entityID` from `find`. `grep` optionally takes a
        `path` to scope search to one document.

        ## Examples

        **List documents:**
        `{"op": "ls"}`

        **Search one document:**
        `{"op": "grep", "path": "my-doc-001", "pattern": "holiday", "scope": "sections"}`

        **Read one page:**
        `{"op": "cat", "path": "my-doc-001", "range": {"page": 7}}`

        **Read a page range:**
        `{"op": "cat", "path": "my-doc-001", "range": {"pageRange": [5, 10]}}`

        **Project section labels and pages only:**
        `{"op": "cat", "path": "my-doc-001", "select": ["sections.label", "sections.page", "sections.type"]}`

        **Preview first 5 sections:**
        `{"op": "head", "path": "my-doc-001", "n": 5}`

        **Document metadata:**
        `{"op": "stat", "path": "my-doc-001"}`

        **List entities:**
        `{"op": "find"}`

        **Entity detail + mentions:**
        `{"op": "open", "path": "ent_abc123"}`

        **Cross-document sections for an entity:**
        `{"op": "xref", "path": "ent_abc123"}`

        ## Key details

        `range` is an **object** with optional keys: `page` (integer),
        `pageRange` (two-element array `[from, to]`), `sectionTypes`
        (array of strings like `["table", "heading"]`).

        `select` is an **array of strings** — dotted paths like
        `["sections.label", "sections.page"]`.

        `scope` (grep) is one of `"sections"`, `"entities"`,
        `"relationships"`, or `"all"` (default).

        ## Pagination

        List ops (`ls`, `find`) paginate by cursor: pass the last item's
        `nextCursor` from a previous response to fetch the next page;
        `hasMore: false` signals the last page. Same idiom as `/v3/calls`
        and `/v3/outputs`.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FSResponse'
      tags:
        - File System
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FSRequest'
  /v3/functions:
    post:
      operationId: v3-create-function
      summary: Create a Function
      description: |-
        **Create a function.**

        The function `type` determines which configuration fields are
        required — see the `CreateFunctionV3` discriminated union and
        [Function types overview](/guide/function-types/overview) for the
        per-type contract.

        The response contains both `functionID` and `functionName`. Either is
        a stable handle you can use elsewhere; most workflows reference
        functions by `functionName` because it's human-readable.

        ## Naming rules

        - `functionName` must be unique per environment.
        - Allowed characters: letters, digits, hyphens, and underscores.
        - Names cannot be reused after deletion within the same environment
        for at least the retention window of the previous record.

        The new function is created at `versionNum: 1`. Subsequent
        `PATCH /v3/functions/{functionName}` calls produce new versions —
        the version-1 configuration remains immutable and addressable.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionResponseV3'
      tags:
        - Functions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFunctionV3'
    get:
      operationId: v3-list-functions
      summary: List Functions
      description: |-
        **List functions in the current environment.**

        Returns each function's current version. Combine filters freely —
        they AND together.

        ## Filtering

        - `functionIDs` / `functionNames`: exact-match identity filters.
        - `displayName`: case-insensitive substring match.
        - `types`: one or more of `extract`, `classify`, `split`, `join`,
        `enrich`, `payload_shaping`. Legacy `transform`, `analyze`, `route`,
        and `send` types remain readable via this filter.
        - `tags`: returns functions tagged with any of the supplied tags.
        - `workflowIDs` / `workflowNames`: returns only functions referenced
        by the named workflows. Useful for "what functions does this
        workflow depend on?" lookups.

        ## Pagination

        Cursor-based with `startingAfter` and `endingBefore` (functionIDs).
        Default limit 50, maximum 100.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: functionIDs
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
            minItems: 1
          explode: false
        - name: functionNames
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
            minItems: 1
          explode: false
        - name: displayName
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: types
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/FunctionType'
            minItems: 1
          explode: false
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - name: startingAfter
          in: query
          required: false
          schema:
            type: string
        - name: endingBefore
          in: query
          required: false
          schema:
            type: string
        - name: tags
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
            minItems: 1
          explode: false
        - name: workflowIDs
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
            minItems: 1
          explode: false
        - name: workflowNames
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
            minItems: 1
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFunctionsResponseV3'
      tags:
        - Functions
  /v3/functions/compare:
    post:
      operationId: v3-function-version-compare
      summary: Compare Metrics Between Function Versions
      description: |-
        **Compare metrics between two function versions.**

        Computes aggregate and field-level lift/regression between any two
        versions of a function: accuracy, precision, recall, F1, and PR-AUC.
        Field-level changes are returned only for fields whose lift exceeds
        1% in either direction.

        Supported for every function type that produces labeled
        transformations: `extract`, `transform`, `analyze`, `join`. Pass
        `isRegression: true` to compare only the regression dataset (rows
        produced by `POST /v3/functions/regression`) — the canonical way to
        judge a candidate version before promoting it.

        Defaults: `baselineVersionNum = currentVersionNum - 1`,
        `comparisonVersionNum = currentVersionNum`.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/functionVersionCompareResponse'
              examples:
                Function improved:
                  summary: Function improved
                  value:
                    functionName: invoice-extractor
                    baselineVersionNum: 2
                    comparisonVersionNum: 3
                    baselineTransformationCount: 100
                    comparisonTransformationCount: 150
                    aggregateComparison:
                      accuracy:
                        baselineValue: 0.85
                        comparisonValue: 0.92
                        difference: 0.07
                        liftPercent: 8.24
                      f1Score:
                        baselineValue: 0.85
                        comparisonValue: 0.92
                        difference: 0.07
                        liftPercent: 8.24
                    fieldMetricsChanges: []
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
      tags:
        - Function Accuracy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/functionVersionCompareRequest'
            examples:
              Compare versions on the regression dataset only:
                summary: Compare versions on the regression dataset only
                value:
                  functionName: invoice-extractor
                  baselineVersionNum: 2
                  comparisonVersionNum: 3
                  isRegression: true
              Compare two versions on labeled data:
                summary: Compare two versions on labeled data
                value:
                  functionName: invoice-extractor
                  baselineVersionNum: 2
                  comparisonVersionNum: 3
  /v3/functions/copy:
    post:
      operationId: v3-copy-function
      summary: Copy a Function
      description: |-
        **Copy a function to a new name within the same environment.**

        Forks the source function's current configuration into a brand-new
        function. The copy starts at `versionNum: 1` regardless of how many
        versions the source has — version history is not carried over.

        Useful for experimenting with schema or prompt changes against a
        stable production function without disturbing existing callers.

        The destination name must be unique in the environment. A copy does
        not migrate workflows: existing workflow nodes continue to reference
        the original function.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionResponseV3'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
      tags:
        - Functions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FunctionCopyRequest'
  /v3/functions/metrics:
    get:
      operationId: v3-get-function-metrics
      summary: Get Function Metrics
      description: |-
        **Retrieve performance metrics for functions based on labeled transformation data.**

        Calculates accuracy, precision, recall, F1, and the underlying confusion-matrix
        counts for each matching function by comparing model outputs against user
        corrections. Metrics are aggregated across every transformation the function
        has produced, regardless of function type — `extract`, `transform`, `analyze`,
        and `join` all populate the same `metrics` column on the transformation row,
        so v3 surfaces all of them uniformly.

        ## Filtering

        Combine `functionIDs` / `functionNames` / `types` to narrow the result set.
        `types` accepts `extract` alongside the legacy `transform` / `analyze` types
        (which remain readable). Pagination is cursor-based.

        ## Requirements

        A function only shows non-zero metrics once at least one of its transformations
        has been labeled — submit corrections via `POST /v3/events/{eventID}/feedback`.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: functionIDs
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
            minItems: 1
          explode: false
        - name: functionNames
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
            minItems: 1
          explode: false
        - name: types
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/FunctionType'
            minItems: 1
          explode: false
        - name: sortOrder
          in: query
          required: false
          description: |-
            Sort direction over the result set (default `asc`). Pagination works
            symmetrically in both directions via `startingAfter` / `endingBefore`.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - name: startingAfter
          in: query
          required: false
          description: Cursor — a `functionID` defining your place in the list.
          schema:
            type: string
        - name: endingBefore
          in: query
          required: false
          description: Cursor — a `functionID` defining your place in the list.
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionMetricsResponse'
              example:
                functions:
                  - functionName: invoice-extractor
                    totalLabeledResults: 54
                    totalResults: 120
                    metrics:
                      accuracy: 0.7407
                      precision: 0.9524
                      recall: 0.7692
                      f1Score: 0.8511
                      tp: 40
                      fp: 2
                      tn: 0
                      fn: 12
                totalCount: 1
      tags:
        - Function Accuracy
  /v3/functions/regression:
    post:
      operationId: v3-function-regression
      summary: Run Function Regression Testing
      description: |-
        **Kick off a regression run between two versions of a function.**

        Replays a sample of corrected historical inputs against the comparison
        version, producing fresh transformations marked `isRegression: true`.
        Each new run returns the workflow `callID`s you can monitor via
        `GET /v3/calls/{callID}`.

        Supported for every function type that produces correctable
        transformations: `extract`, `transform`, `analyze`, `join`. For
        `extract` specifically, the regression sample is dispatched through
        the same OCR vs. vision path used at original call time (PDF, PNG,
        JPEG, HEIC, HEIF, WebP go through the vision worker; everything else
        goes through OCR → transform).

        The comparison version must share a schema-compatible output shape
        with the baseline; structural differences are reported as a 400 with
        the offending field-level diffs.

        ## Typical flow

        1. `POST /v3/functions/regression` — queues calls, returns
        `{ originalReferenceID, callID }` per sample.
        2. Wait (poll `GET /v3/calls/{callID}` or subscribe to webhooks).
        3. `POST /v3/functions/regression/corrections` to copy baseline
        corrections onto the new regression transformations.
        4. `POST /v3/functions/compare` to compare baseline vs comparison
        metrics for the regression dataset.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/functionRegressionResponse'
              examples:
                Regression run queued:
                  summary: Regression run queued
                  description: Calls are processing asynchronously — poll the calls API or wait on webhooks.
                  value:
                    functionName: invoice-extractor
                    result:
                      functionName: invoice-extractor
                      totalSamples: 50
                      calls:
                        - originalReferenceID: invoice-123
                          callID: wc_2N6gH8ZKCmvb6BnFcGqhKJ98VzP
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
      tags:
        - Function Accuracy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/functionRegressionRequest'
            examples:
              Compare specific versions:
                summary: Compare specific versions
                value:
                  functionName: invoice-extractor
                  baselineVersionNum: 3
                  comparisonVersionNum: 5
                  sampleSize: 100
                  onlyCorrectedData: true
              Default regression (previous version → current version):
                summary: Default regression (previous version → current version)
                value:
                  functionName: invoice-extractor
                  sampleSize: 50
  /v3/functions/regression/corrections:
    post:
      operationId: v3-apply-baseline-corrections
      summary: Apply Baseline Corrections to Regression Transformations
      description: |-
        **Copy baseline corrections onto regression transformations.**

        Looks up regression transformations created against the comparison
        version (`isRegression: true`, `correctedJSON IS NULL`), finds the
        matching baseline transformation by `referenceID`, and copies the
        baseline's `correctedJSON` onto the regression row via the same code
        path used by `POST /v3/events/{eventID}/feedback`. The applied
        corrections are immediately scored against the regression output,
        populating the confusion-matrix metrics used by `function-review` and
        `function-version-compare`.

        Works for every function type that produces correctable
        transformations, including `extract` on both the vision and OCR
        paths. (Previously the vision path silently dropped `is_regression`
        during the original regression run, so no rows matched the
        predicate — that has been fixed.)

        Returns counts plus the list of **event KSUIDs** whose underlying
        regression transformation received a correction. Errors (e.g.
        baseline transformation missing for a given `referenceID`) are
        returned per-row in the `errors` map, keyed by event KSUID, rather
        than aborting the whole call.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/applyBaselineCorrectionsResponseV3'
              examples:
                Partial application with per-row errors:
                  summary: Partial application with per-row errors
                  value:
                    applied: 18
                    appliedEventIDs:
                      - evt_2N6gH8...
                      - evt_2N6gH9...
                    skipped: 2
                    errors:
                      evt_2N6gHB...: 'baseline transformation not found for reference ID: invoice-789'
                All corrections applied:
                  summary: All corrections applied
                  value:
                    applied: 25
                    appliedEventIDs:
                      - evt_2N6gH8...
                      - evt_2N6gH9...
                      - evt_2N6gHA...
                    skipped: 0
                    errors: {}
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
      tags:
        - Function Accuracy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/applyBaselineCorrectionsRequest'
            examples:
              Apply corrections from v3 onto v4 regression set:
                summary: Apply corrections from v3 onto v4 regression set
                value:
                  functionName: invoice-extractor
                  baselineVersionNum: 3
                  comparisonVersionNum: 4
  /v3/functions/review:
    post:
      operationId: v3-function-review
      summary: Function Review
      description: |-
        **Estimate human review requirements for a function.**

        Combines confusion-matrix metrics with the per-transformation evaluation
        scores (confidence / hallucination / relevance produced by the eval service)
        to compute:

        - A confidence-bucketed distribution of the function's outputs.
        - Sample-size estimates at configurable margin-of-error and confidence
        levels (Wald or Wilson intervals).
        - A precision-recall AUC and a per-threshold matrix you can use to
        pick a review cutoff.

        Supported for every function type that produces transformations and feeds
        the auto-evaluation pipeline: `extract`, `transform`, `analyze`, `join`.
        Extract works on both vision (PDF/PNG/JPEG/HEIC/HEIF/WebP) and OCR-routed
        inputs.

        Pass `isRegression: true` to scope the review to transformations created
        by a previous regression run (see `POST /v3/functions/regression`).
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionReviewResponse'
              example:
                functionName: invoice-extractor
                functionVersionNum: 3
                estimate:
                  totalTransformations: 1000
                  labeledTransformations: 200
                  unlabeledTransformations: 800
                  missingEvaluations: 50
                  confidenceDistribution:
                    high: 500
                    medium: 350
                    low: 150
                  thresholdMatrix:
                    - threshold: 0.8
                      tp: 85
                      fp: 12
                      fn: 15
                      tn: 88
                      accuracyAboveThreshold:
                        '95':
                          ciLower: 0.8456
                          mid: 0.875
                          ciUpper: 0.9044
                          currentSample: 120
                          sampleNeeded: 30
                metrics:
                  fieldMetrics:
                    - fieldPath: /invoice/number
                      metrics:
                        accuracy: 0.95
                        precision: 0.98
                        recall: 0.92
                        f1Score: 0.95
                        tp: 92
                        fp: 2
                        tn: 0
                        fn: 8
                  precisionRecallAuc: 0.8542
                  aggregateMetrics:
                    accuracy: 0.7407
                    precision: 0.9524
                    recall: 0.7692
                    f1Score: 0.8511
                    tp: 40
                    fp: 2
                    tn: 0
                    fn: 12
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
      tags:
        - Function Accuracy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FunctionReviewRequest'
            examples:
              Review the regression dataset for a specific version:
                summary: Review the regression dataset for a specific version
                value:
                  functionName: invoice-extractor
                  functionVersionNum: 2
                  isRegression: true
                  marginOfError: 0.05
              Full threshold analysis (default):
                summary: Full threshold analysis (default)
                value:
                  functionName: invoice-extractor
                  marginOfError: 0.05
                  thresholdMin: 0.5
                  thresholdMax: 1
                  thresholdStep: 0.01
  /v3/functions/{functionName}:
    delete:
      operationId: v3-delete-function
      summary: Delete a Function
      description: |-
        **Delete a function and every one of its versions.**

        Permanent. Running and queued calls that reference this function
        continue to completion against the version they captured at call
        time, but no new calls can target it.

        ## Before deleting

        Workflow nodes that reference this function will fail at call time
        after deletion. List workflows that reference it first:

        ```
        GET /v3/workflows?functionNames=my-function
        ```

        Update or remove those workflows, or create a replacement function
        and re-point the workflow nodes, before deleting.
      parameters:
        - name: functionName
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - Functions
    get:
      operationId: v3-get-function
      summary: Get a Function
      description: |-
        **Retrieve a function's current version by name.**

        Returns the function record with its `currentVersionNum` and the
        configuration of that version. To inspect a historical version, use
        `GET /v3/functions/{functionName}/versions/{versionNum}`.
      parameters:
        - name: functionName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionResponseV3'
      tags:
        - Functions
    patch:
      operationId: v3-update-function
      summary: Update a Function
      description: |-
        **Update a function. Updates create a new version.**

        The previous version remains addressable and immutable. Workflow
        nodes that pinned the function with a `versionNum` continue to use
        the pinned version; nodes that reference the function by name with
        no version automatically pick up the new version on their next call.

        ## What you can change

        Any field allowed by the function's type. Most commonly:
        `outputSchema` (for `extract`/`join`), `classifications` (for
        `classify`), `displayName`, and `tags`.

        ## Versioning behaviour

        - Each successful update increments `currentVersionNum` by 1.
        - `displayName`, `tags`, and `functionName` updates also create a
        new version, so the version history is a complete record of every
        change.
        - To revert, fetch the previous version and re-submit its
        configuration as a new update — versions themselves are immutable.
      parameters:
        - name: functionName
          in: path
          required: true
          schema:
            type: string
            x-stainless-param: path_function_name
          x-stainless-param: path_function_name
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionResponseV3'
      tags:
        - Functions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFunctionV3'
  /v3/functions/{functionName}/versions:
    get:
      operationId: v3-list-function-versions
      summary: List Function Versions
      description: |-
        **List every version of a function.**

        Returns the full version history, newest-first. Each row captures
        the configuration the function had between updates. Useful for
        audits ("when did this schema change?") and for diffing two
        versions before promoting an update to production.
      parameters:
        - name: functionName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFunctionVersionsResponseV3'
      tags:
        - Functions
  /v3/functions/{functionName}/versions/{versionNum}:
    get:
      operationId: v3-get-function-version
      summary: Get a Function Version
      description: |-
        **Retrieve a specific historical version of a function.**

        Versions are immutable. Use this endpoint to inspect what a function
        looked like at the moment a particular call was made — every event
        and transformation records the function version it ran against.
      parameters:
        - name: functionName
          in: path
          required: true
          schema:
            type: string
        - name: versionNum
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionVersionResponseV3'
      tags:
        - Functions
  /v3/infer-schema:
    post:
      operationId: v3-infer-schema
      summary: Infer Schema from File
      description: |-
        **Analyze a file and infer a JSON Schema from its contents.**

        Accepts a file via multipart form upload and uses Gemini to analyze the document,
        returning a description of its contents, an inferred JSON Schema capturing all
        extractable fields, and document classification metadata.

        The returned schema is designed to be reusable across many similar documents of the
        same type, not just the specific file uploaded. It can be used directly as the
        `outputSchema` when creating a Transform function.

        The endpoint also detects whether the file contains multiple bundled documents
        and classifies the content nature (textual, visual, audio, video, or mixed).

        ## Supported file types

        PDF, PNG, JPEG, HEIC, HEIF, WebP, CSV, XLS, XLSX, DOCX, JSON, HTML, XML, EML,
        plain text, WAV, MP3, M4A, MP4.

        ## File size limit

        Maximum file size is **20 MB**.

        ## Examples

        Using curl:
        ```bash
        curl -X POST https://api.bem.ai/v3/infer-schema \
          -H "x-api-key: YOUR_API_KEY" \
          -F "file=@invoice.pdf"
        ```

        Using the Bem CLI:
        ```bash
        bem infer-schema create --file @invoice.pdf
        ```
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferSchemaResponseV3'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
      tags:
        - Schema Inference
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InferSchemaMultipartFormData'
            encoding:
              file:
                contentType: '*/*'
  /v3/knowledge-graph:
    get:
      operationId: v3-get-knowledge-graph
      summary: Retrieve the Knowledge Graph
      parameters:
        - name: nodeID
          in: query
          required: false
          description: |-
            Center the graph on this entity (`ent_...`) and only return the subgraph
            within `maxDepth` hops of it; every node then carries its `depth` (hops
            from the center, center = 0). Omit for the uncentered whole-graph view.
            `rootNodeID` and `focusNodeID` are accepted as aliases.
          schema:
            type: string
          explode: false
        - name: maxDepth
          in: query
          required: false
          description: |-
            Maximum hops from the center node. Only meaningful with `nodeID`. Defaults
            to 2 and is clamped down to a system maximum (5).
          schema:
            type: integer
            format: int32
          explode: false
        - name: limit
          in: query
          required: false
          description: Maximum number of edges per page (default 50, max 200).
          schema:
            type: integer
            format: int32
          explode: false
        - name: cursor
          in: query
          required: false
          description: 'Cursor: return edges whose KSUID sorts after this value.'
          schema:
            type: string
          explode: false
        - name: type
          in: query
          required: false
          description: |-
            Restrict to entities of these types. An edge is returned only when BOTH
            of its endpoints survive the type filter.
          schema:
            type: array
            items:
              type: string
          explode: false
        - name: since
          in: query
          required: false
          description: Only edges created at/after this RFC 3339 timestamp.
          schema:
            type: string
            format: date-time
          explode: false
        - name: search
          in: query
          required: false
          description: |-
            Case-insensitive substring match on canonical names. Both endpoints of an
            edge must match for the edge (and its nodes) to be returned.
          schema:
            type: string
          explode: false
        - name: bucket
          in: query
          required: false
          description: |-
            Optional bucket public ID (`bkt_...`) to scope the read to one bucket.
            Omit for the unscoped (all account+environment) view.
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeGraphResponseV3'
      tags:
        - Knowledge Graph
  /v3/outputs:
    get:
      operationId: v3-list-outputs
      summary: List Outputs
      description: |-
        **List terminal non-error output events.**

        Returns events that represent successful terminal outputs — primary events
        (non-split-collection) that did not trigger any downstream function calls.
        Error events are excluded; use `GET /v3/errors` to retrieve those.

        ## Intermediate Events

        By default, intermediate events (those that spawned a downstream function call in a
        multi-step workflow) are excluded. Pass `includeIntermediate=true` to include them.

        ## Filtering

        Filter by call, workflow, function, or reference ID. Multiple filters are ANDed together.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: callIDs
          in: query
          required: false
          description: Filter to outputs from specific calls.
          schema:
            type: array
            items:
              type: string
            minItems: 1
          explode: false
        - name: workflowIDs
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
            minItems: 1
          explode: false
        - name: workflowNames
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
            minItems: 1
          explode: false
        - name: functionIDs
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
            minItems: 1
          explode: false
        - name: functionNames
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
            minItems: 1
          explode: false
        - name: referenceIDs
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
            minItems: 1
          explode: false
        - name: eventIDs
          in: query
          required: false
          description: Filter to specific output events by their event IDs (KSUIDs).
          schema:
            type: array
            items:
              type: string
            minItems: 1
          explode: false
        - name: eventTypes
          in: query
          required: false
          description: Filter to specific non-error output event types, e.g. `classify` or `extract`.
          schema:
            type: array
            items:
              type: string
            minItems: 1
          explode: false
        - name: transformationIDs
          in: query
          required: false
          description: |-
            Filter by legacy transformation IDs. Provided for backwards compatibility
            with clients migrating from `/v1-beta/transformations`.
          schema:
            type: array
            items:
              type: string
            minItems: 1
          explode: false
        - name: functionVersionNums
          in: query
          required: false
          description: Filter to specific function version numbers.
          schema:
            type: array
            items:
              type: integer
            minItems: 1
          explode: false
        - name: referenceIDSubstring
          in: query
          required: false
          description: Case-insensitive substring match against `referenceID`.
          schema:
            type: string
          explode: false
        - name: isLabelled
          in: query
          required: false
          description: |-
            If `true`, only outputs with a corrected (labelled) payload.
            If `false`, only outputs that are not labelled. If omitted, no filter is applied.
          schema:
            type: boolean
        - name: isRegression
          in: query
          required: false
          description: |-
            If `true`, only regression-marked outputs. If `false`, only non-regression outputs.
            If omitted, no filter is applied.

            Note: clients migrating from `/v1-beta/transformations` should pass `isRegression=false`
            explicitly to preserve the legacy default (regressions hidden unless explicitly requested).
          schema:
            type: boolean
        - name: includeIntermediate
          in: query
          required: false
          description: |-
            When `true`, includes intermediate events (those that spawned a downstream function call).
            Default: `false`.
          schema:
            type: boolean
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - name: startingAfter
          in: query
          required: false
          schema:
            type: string
        - name: endingBefore
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOutputsResponseV3'
      tags:
        - Outputs
  /v3/outputs/{eventID}:
    get:
      operationId: v3-get-output
      summary: Get an Output
      description: |-
        **Retrieve a single output event by ID.**

        Fetches any non-error event by its `eventID`. Returns `404` if the event does not exist
        or if it is an error event (use `GET /v3/errors/{eventID}` for those).
      parameters:
        - name: eventID
          in: path
          required: true
          description: The unique identifier of the output event.
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutputResponseV3'
      tags:
        - Outputs
  /v3/review-queue:
    get:
      operationId: v3-list-review-queue
      summary: List Review Queue
      description: |-
        **List entities awaiting curation, for a human reviewer's queue.**

        Returns a cursor-paginated set of entities scoped to your
        account+environment (and optional `bucket`), each carrying a small preview
        of its first mentions so a reviewer can triage without opening every
        entity. All filters AND together.

        - **`status`** (repeatable) restricts to the given lifecycle states.
        Omitting it defaults to the pre-terminal states `extracted` and
        `proposed`.
        - **`type`** (repeatable, `ety_...` IDs) matches the entity's *effective*
        type: an entity matches when its assigned type is one of these IDs, or it
        has no assigned type and its bem-inferred type name matches one of them.
        - **`assignedTo`** (`me` or a `usr_...` ID) restricts to entities whose
        effective type the given user reviews. `me` resolves to the calling user.
        - **`since`** (RFC3339) restricts to entities created at or after the time.

        Pagination is cursor-based on `entityID` ascending; default limit is 50,
        maximum 200.
      parameters:
        - name: status
          in: query
          required: false
          description: Restrict to these lifecycle states. Defaults to `extracted` + `proposed`.
          schema:
            type: array
            items:
              type: string
        - name: type
          in: query
          required: false
          description: Restrict to entities whose effective type is one of these `ety_...` IDs.
          schema:
            type: array
            items:
              type: string
        - name: assignedTo
          in: query
          required: false
          description: '`me` or a `usr_...` ID — restrict to entities whose effective type that user reviews.'
          schema:
            type: string
          explode: false
        - name: since
          in: query
          required: false
          description: RFC3339 timestamp — restrict to entities created at or after this time.
          schema:
            type: string
          explode: false
        - name: cursor
          in: query
          required: false
          description: Cursor — an `entityID` defining your place in the list.
          schema:
            type: string
          explode: false
        - name: bucket
          in: query
          required: false
          description: Optional bucket public ID (`bkt_...`) to scope to. Omit for all buckets.
          schema:
            type: string
          explode: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 50
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewQueueResponseV3'
      tags:
        - Review Queue
  /v3/subscriptions:
    get:
      operationId: v3-list-subscriptions
      summary: List Subscriptions
      parameters:
        - name: functionNames
          in: query
          required: false
          description: Filters to subscriptions linked to included array of function names.
          schema:
            type: array
            items:
              type: string
            minItems: 1
        - name: limit
          in: query
          required: false
          description: This specifies a limit on the number of objects to return, ranging between 1 and 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: sortOrder
          in: query
          required: false
          description: >-
            Specifies sorting behavior. The two options are `asc` and `desc` to sort ascending and descending
            respectively, with default sort being ascending. Paging works in both directions.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - name: startingAfter
          in: query
          required: false
          description: >-
            A cursor to use in pagination. `startingAfter` is a task ID that defines your place in the list.
            For example, if you make a list request and receive 50 objects, ending with
            `sub_2c9AXIj48cUYJtCuv1gsQtHGDzK`, your subsequent call can include
            `startingAfter=sub_2c9AXIj48cUYJtCuv1gsQtHGDzK` to fetch the next page of the list.
          schema:
            type: string
        - name: endingBefore
          in: query
          required: false
          description: >-
            A cursor to use in pagination. `endingBefore` is a task ID that defines your place in the list.
            For example, if you make a list request and receive 50 objects, starting with
            `sub_2c9AXIj48cUYJtCuv1gsQtHGDzK`, your subsequent call can include
            `endingBefore=sub_2c9AXIj48cUYJtCuv1gsQtHGDzK` to fetch the previous page of the list.
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionV3'
        '400':
          description: The server could not understand the request due to invalid syntax.
        '401':
          description: Access is unauthorized.
        '500':
          description: Server error
      tags:
        - Subscriptions
    post:
      operationId: v3-create-subscription
      summary: Create a Subscription
      description: Creates a new subscription to listen to transform or error events.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionV3'
      tags:
        - Subscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionV3'
