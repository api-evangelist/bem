      description: Response containing a list of views
    ListWorkflowVersionsResponseV3:
      type: object
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowV3'
        totalCount:
          type: integer
          description: The total number of results available.
        error:
          type: string
          description: Error message if the workflow versions listing failed.
    Metrics:
      type: object
      properties:
        accuracy:
          anyOf:
            - type: number
              format: float
            - type: 'null'
