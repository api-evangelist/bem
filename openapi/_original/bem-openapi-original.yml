      description: Time window for filtering transformations in a view
    TransformEvent:
      type: object
      required:
        - eventID
        - referenceID
        - functionID
        - functionName
        - transformedContent
        - itemOffset
        - itemCount
      properties:
        functionCallTryNumber:
          type: integer
          description: The attempt number of the function call that created this event. 1 indexed.
        eventID:
          type: string
          description: Unique ID generated by bem to identify the event.
        createdAt:
          type: string
          format: date-time
          description: Timestamp indicating when the event was created.
        referenceID:
          type: string
          description: >-
            The unique ID you use internally to refer to this data point, propagated from the original
            function input.
        inboundEmail:
          allOf:
            - $ref: '#/components/schemas/EventInboundEmail'
          description: The inbound email that triggered this event.
        metadata:
          type: object
          properties:
            durationFunctionToEventSeconds:
              type: number
        eventType:
          type: string
          enum:
            - transform
        functionCallID:
          type: string
          description: Unique identifier of function call that this event is associated with.
        functionID:
          type: string
          description: Unique identifier of function that this event is associated with.
        functionName:
          type: string
          description: Unique name of function that this event is associated with.
        functionVersionNum:
          type: integer
          description: Version number of function that this event is associated with.
        callID:
          type: string
          description: Unique identifier of workflow call that this event is associated with.
        workflowID:
          type: string
          description: Unique identifier of workflow that this event is associated with.
        workflowName:
          type: string
          description: Name of workflow that this event is associated with.
        workflowVersionNum:
          type: integer
          description: Version number of workflow that this event is associated with.
        pipelineID:
          type: string
          description: ID of pipeline that transformed the original input data.
        publishedAt:
          type: string
          format: date-time
          description: >-
            Timestamp indicating when the transform was published via webhook and received a successful 200
            response. Value is `null` if the transformation hasn't been sent.
        lastPublishErrorAt:
          anyOf:
            - type: string
            - type: 'null'
          description: >-
            Last timestamp indicating when the transform was published via webhook and received a non-200
            response. Set to `null` on a subsequent retry if the webhook service receives a 200 response.
        inputType:
          $ref: '#/components/schemas/InputType'
        transformationID:
          type: string
          description: Unique ID for each transformation output generated by bem following Segment's KSUID conventions.
        s3URL:
          anyOf:
            - type: string
            - type: 'null'
          description: Presigned S3 URL for the input content uploaded to S3.
        inputs:
          anyOf:
            - type: array
              items:
                type: object
                properties:
                  inputType:
                    anyOf:
                      - type: string
                      - type: 'null'
                  inputContent:
                    anyOf:
                      - type: string
                      - type: 'null'
                  jsonInputContent:
                    anyOf:
                      - type: object
                        unevaluatedProperties: {}
                      - type: 'null'
                  s3URL:
                    anyOf:
                      - type: string
                      - type: 'null'
            - type: 'null'
          description: Array of transformation inputs with their types and S3 URLs.
        transformedContent:
          type: object
          unevaluatedProperties: {}
          description: >-
            The transformed content of the input. The structure of this object is defined by the function
            configuration.
        correctedContent:
          anyOf:
            - type: object
              properties:
                output:
                  type: array
                  items:
                    $ref: '#/components/schemas/AnyType'
            - $ref: '#/components/schemas/AnyType'
          description: Corrected feedback provided for fine-tuning purposes.
        invalidProperties:
          type: array
          items:
            type: string
          description: List of properties that were invalid in the input.
        metrics:
          anyOf:
            - type: object
              properties:
                metrics:
                  type: object
                  properties:
                    accuracy:
                      type: number
                    precision:
                      type: number
                    recall:
                      type: number
                    f1Score:
                      type: number
                differences:
                  type: array
                  items:
                    type: object
                    properties:
                      category:
                        type: string
                      correctedVal: {}
                      extractedVal: {}
                      jsonPointer:
                        type: string
            - type: 'null'
          description: Accuracy, precision, recall, and F1 score when corrected JSON is provided.
        orderMatching:
          type: boolean
          description: Indicates whether array order matters when comparing corrected JSON with extracted JSON.
        isRegression:
          type: boolean
          description: Indicates whether this transformation was created as part of a regression test.
        itemOffset:
          type: integer
          description: >-
            The offset of the first item that was transformed. Used for batch transformations to indicate
            which item in the batch this event corresponds to.
        itemCount:
          type: integer
          description: >-
            The number of items that were transformed. Used for batch transformations to indicate how many
            items were transformed.
        fieldConfidences:
          type: object
          unevaluatedProperties:
            type: number
            format: float
          description: >-
            Per-field confidence scores. A JSON object mapping RFC 6901 JSON Pointer paths (e.g.
            `"/invoiceNumber"`)

            to float values in the range [0, 1] indicating the model's confidence in each extracted field
            value.
        avgConfidence:
          anyOf:
            - type: number
              format: float
            - type: 'null'
          description: Average confidence score across all extracted fields, in the range [0, 1].
      title: Transform Event
    TransformFunction:
