        f1Score:
          anyOf:
            - type: number
              format: float
            - type: 'null'
          description: F1 Score (harmonic mean of precision and recall)
        tp:
          type: integer
          description: True Positives
        fp:
          type: integer
          description: False Positives
        tn:
          type: integer
          description: True Negatives
        fn:
          type: integer
          description: False Negatives
      description: Comprehensive performance metrics
    MetricsDetails:
      type: object
      properties:
        fieldMetrics:
          type: array
          items:
            $ref: '#/components/schemas/FieldMetrics'
          description: Enhanced field metrics with comprehensive analytics
        precisionRecallAuc:
          type: number
          format: float
          description: Area Under the Precision-Recall Curve
        aggregateMetrics:
          allOf:
            - $ref: '#/components/schemas/Metrics'
          description: Aggregate confusion matrix metrics across all fields
      description: Detailed performance metrics and analysis
    OutboundRelationV3:
      type: object
      required:
        - relationType
        - targetEntity
        - mentionCount
        - firstSeenAt
      properties:
        relationType:
          type: string
          description: Free-form relation label (e.g. `author_of`, `affiliated_with`).
        targetEntity:
          allOf:
            - $ref: '#/components/schemas/RelatedEntityV3'
          description: The entity at the head of the edge.
        mentionCount:
          type: integer
          format: int32
          description: How many times this edge has been observed across parsed documents.
        firstSeenAt:
          type: string
          format: date-time
          description: First-seen timestamp of the edge (RFC 3339).
      description: One edge pointing AWAY from the queried entity (it is the source).
    OutputResponseV3:
      type: object
      required:
        - output
      properties:
        output:
          allOf:
            - $ref: '#/components/schemas/EventV3'
          description: The output event. Polymorphic by `eventType`.
    ParagonConnectorConfig:
      type: object
      required:
        - integration
        - configuration
        - syncID
      properties:
        integration:
          type: string
          description: Paragon integration key (e.g. "googledrive").
        configuration:
          type: object
          unevaluatedProperties: {}
          description: 'Opaque per-integration configuration (e.g. `{"folderId": "..."}`).'
        syncID:
          type: string
          description: Paragon sync ID managed by the server. Read-only.
          readOnly: true
      description: Paragon-integration configuration on a workflow connector.
    ParagonConnectorRequestConfig:
      type: object
      properties:
        integration:
          type: string
          description: Paragon integration key. Required on create.
        configuration:
          type: object
          unevaluatedProperties: {}
          description: Opaque per-integration configuration. Required on create.
      description: Request-side config block for a Paragon connector. Fields absent on update are unchanged.
    ParseConfig:
      type: object
      properties:
        extractEntities:
          type: boolean
          description: |-
            When true, extract named entities (people, organizations, products,
            studies, identifiers, etc.) and the relationships between them, and
            dedupe by canonical name within the document. When false, only
            `sections[]` is extracted; `entities[]` and `relationships[]` come
            back empty in the parse output. Defaults to true.
        linkAcrossDocuments:
          type: boolean
          description: |-
            When true, link this document's entities to entities seen in earlier
            documents in this environment, building one canonical record per
            real-world thing across the corpus. Visible in the Memory tab and
            queryable via `POST /v3/fs` (op=find / open / xref). Doesn't change
            this call's parse output. Requires `extractEntities=true`. Defaults
            to true.
        schema:
          type: object
          unevaluatedProperties: {}
          description: |-
            Optional JSONSchema. When provided, each chunk performs schema-guided
            extraction. When absent, chunks perform open-ended discovery and
            return sections, entities, and relationships per the discovery
            schema.
        defaultBucket:
          type: string
          description: |-
            Optional bucket NAME that parse-extracted entities land in when no
            call-level bucket is supplied. Lower precedence than a call-level bucket,
            higher than the account+environment default.
      description: |-
        Per-version configuration for a Parse function.

        Parse renders document pages (PDF, image) via vision LLM and emits
        structured JSON. The two toggles below independently control entity
        extraction (a per-call output concern) and cross-document memory
        linking (an environment-wide concern).
    ParseEvent:
      type: object
      required:
        - eventID
        - referenceID
        - functionID
        - functionName
        - transformedContent
        - itemOffset
        - itemCount
      properties:
        functionCallTryNumber:
          type: integer
          description: The attempt number of the function call that created this event. 1 indexed.
        eventID:
          type: string
          description: Unique ID generated by bem to identify the event.
        createdAt:
          type: string
          format: date-time
          description: Timestamp indicating when the event was created.
        referenceID:
          type: string
          description: >-
            The unique ID you use internally to refer to this data point, propagated from the original
            function input.
        inboundEmail:
          allOf:
            - $ref: '#/components/schemas/EventInboundEmail'
          description: The inbound email that triggered this event.
        metadata:
          type: object
          properties:
            durationFunctionToEventSeconds:
              type: number
        eventType:
          type: string
          enum:
            - parse
        functionCallID:
          type: string
          description: Unique identifier of function call that this event is associated with.
        functionID:
          type: string
          description: Unique identifier of function that this event is associated with.
        functionName:
          type: string
          description: Unique name of function that this event is associated with.
        functionVersionNum:
          type: integer
          description: Version number of function that this event is associated with.
        callID:
          type: string
          description: Unique identifier of workflow call that this event is associated with.
        workflowID:
          type: string
          description: Unique identifier of workflow that this event is associated with.
        workflowName:
          type: string
          description: Name of workflow that this event is associated with.
        workflowVersionNum:
          type: integer
          description: Version number of workflow that this event is associated with.
        inputType:
          $ref: '#/components/schemas/InputType'
        transformationID:
          type: string
          description: Unique ID for each transformation output generated by bem following Segment's KSUID conventions.
        s3URL:
          anyOf:
            - type: string
            - type: 'null'
          description: Presigned S3 URL for the input content uploaded to S3.
        inputs:
          anyOf:
            - type: array
              items:
                type: object
                properties:
                  inputType:
                    anyOf:
                      - type: string
                      - type: 'null'
                  inputContent:
                    anyOf:
                      - type: string
                      - type: 'null'
                  jsonInputContent:
                    anyOf:
                      - type: object
                        unevaluatedProperties: {}
                      - type: 'null'
                  s3URL:
                    anyOf:
                      - type: string
                      - type: 'null'
            - type: 'null'
          description: Array of parse inputs with their types and S3 URLs.
        transformedContent:
          type: object
          unevaluatedProperties: {}
          description: |-
            The parsed content of the input. Top-level keys are `sections`, `entities`,
            and `relationships`; the precise shape is determined by the parse function's
            configuration.
        correctedContent:
          anyOf:
            - type: object
              properties:
                output:
                  type: array
                  items:
                    $ref: '#/components/schemas/AnyType'
            - $ref: '#/components/schemas/AnyType'
          description: Corrected feedback provided for fine-tuning purposes.
        invalidProperties:
          type: array
          items:
            type: string
          description: List of properties that were invalid in the input.
        itemOffset:
          type: integer
          description: >-
            The offset of the first item that was parsed. Used for batch parsing to indicate which item in the
            batch this event corresponds to.
        itemCount:
          type: integer
          description: >-
            The number of items that were parsed. Used for batch parsing to indicate how many items were
            parsed.
        fieldBoundingBoxes:
          type: object
          unevaluatedProperties: {}
          description: |-
            Per-field bounding boxes. A JSON object mapping RFC 6901 JSON Pointer paths
            to the document regions from which each parsed value was sourced.
        fieldConfidences:
          type: object
          unevaluatedProperties:
            type: number
            format: float
          description: |-
            Per-field confidence scores. A JSON object mapping RFC 6901 JSON Pointer paths
            to float values in the range [0, 1] indicating the model's confidence in each parsed field value.
        avgConfidence:
          anyOf:
            - type: number
              format: float
            - type: 'null'
          description: Average confidence score across all parsed fields, in the range [0, 1].
      description: |-
        Emitted when a `parse` function completes. Reuses the `extract` event shape
        on the wire — both wrap a Transformation and downstream consumers care
        about the same `transformedContent` payload — but uses a distinct
        `eventType` discriminator so receivers can dispatch on the function type
        that produced it.
      title: Parse Event
    ParseExtraFunctionConfiguration:
      type: object
      properties:
        enableBoundingBoxes:
          type: boolean
          description: |-
            When true, return per-section and per-entity-mention coordinates in
            the parse event's `fieldBoundingBoxes` map (same shape as Extract:
            JSON Pointer key → array of `{page, left, top, width, height}` with
            coordinates normalized to [0, 1]). Keys are `/sections/{N}` and
            `/entities/{N}/occurrences/{M}` into the parse output. Only applies
            to the open-ended discovery path (no `schema`) and to vision input
            types. Bedrock-backed parse functions silently return an empty map
            (no native bbox support). Defaults to false.
      description: |-
        Cross-cutting toggles for Parse functions. Mirrors the `extraConfig`
        surface on Extract / Join — separated from `parseConfig` so the per-call
        Parse output shape stays distinct from operator-level execution flags.
    ParseFunction:
      type: object
      required:
        - functionID
        - functionName
        - versionNum
        - type
      properties:
        functionID:
          type: string
          description: Unique identifier of function.
        functionName:
          type: string
          description: Name of function. Must be UNIQUE on a per-environment basis.
        versionNum:
          type: integer
          description: Version number of function.
        usedInWorkflows:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowUsageInfo'
          description: List of workflows that use this function.
        displayName:
          type: string
          description: Display name of function. Human-readable name to help you identify the function.
        tags:
          type: array
          items:
            type: string
          description: Array of tags to categorize and organize functions.
        audit:
          allOf:
            - $ref: '#/components/schemas/FunctionAudit'
          description: Audit trail information for the function.
        type:
          type: string
          enum:
            - parse
        parseConfig:
          $ref: '#/components/schemas/ParseConfig'
        extraConfig:
          $ref: '#/components/schemas/ParseExtraFunctionConfiguration'
      title: Parse Function
    ParseFunctionVersion:
      type: object
      required:
        - functionID
        - functionName
        - versionNum
        - type
      properties:
        functionID:
          type: string
          description: Unique identifier of function.
        functionName:
          type: string
          description: Name of function. Must be UNIQUE on a per-environment basis.
        versionNum:
          type: integer
          description: Version number of function.
        usedInWorkflows:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowUsageInfo'
          description: List of workflows that use this function.
        displayName:
          type: string
          description: Display name of function. Human-readable name to help you identify the function.
        tags:
          type: array
          items:
            type: string
          description: Array of tags to categorize and organize functions.
        createdAt:
          type: string
          format: date-time
          description: The date and time the function version was created.
        audit:
          allOf:
            - $ref: '#/components/schemas/FunctionAudit'
          description: Audit trail information for the function version.
        type:
          type: string
          enum:
            - parse
        parseConfig:
          $ref: '#/components/schemas/ParseConfig'
        extraConfig:
          $ref: '#/components/schemas/ParseExtraFunctionConfiguration'
    ParsedDocSummary:
