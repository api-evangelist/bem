          description: Display name of function. Human-readable name to help you identify the function.
        tags:
          type: array
          items:
            type: string
          description: Array of tags to categorize and organize functions.
        type:
          type: string
          enum:
            - join
        description:
          type: string
          description: Description of join function.
        joinType:
          type: string
          enum:
            - standard
          description: The type of join to perform.
        outputSchemaName:
          type: string
          description: Name of output schema object.
        outputSchema:
          type: object
          unevaluatedProperties: {}
          description: Desired output structure defined in standard JSON Schema convention.
      title: Join Function
    UpsertParseFunction:
      type: object
      required:
        - type
      properties:
        functionName:
          type: string
          description: Name of function. Must be UNIQUE on a per-environment basis.
        displayName:
          type: string
          description: Display name of function. Human-readable name to help you identify the function.
        tags:
          type: array
          items:
            type: string
          description: Array of tags to categorize and organize functions.
        type:
          type: string
          enum:
            - parse
        parseConfig:
          $ref: '#/components/schemas/ParseConfig'
        extraConfig:
          $ref: '#/components/schemas/ParseExtraFunctionConfiguration'
      title: Parse Function
    UpsertPayloadShapingFunction:
      type: object
      required:
        - type
      properties:
        functionName:
          type: string
          description: Name of function. Must be UNIQUE on a per-environment basis.
        displayName:
          type: string
          description: Display name of function. Human-readable name to help you identify the function.
        tags:
          type: array
          items:
            type: string
          description: Array of tags to categorize and organize functions.
        type:
          type: string
          enum:
            - payload_shaping
        shapingSchema:
          type: string
          description: |-
            JMESPath expression that defines how to transform and customize the input payload structure.
            Payload shaping allows you to extract, reshape, and reorganize data from complex input payloads
            into a simplified, standardized output format. Use JMESPath syntax to select specific fields,
            perform calculations, and create new data structures tailored to your needs.
      description: |-
        A function that transforms and customizes input payloads using JMESPath expressions.
        Payload shaping allows you to extract specific data, perform calculations, and reshape
        complex input structures into simplified, standardized output formats tailored to your
        downstream systems or business requirements.
      title: Payload Shaping Function
    UpsertRenderFunction:
      type: object
      required:
        - type
      properties:
        functionName:
          type: string
          description: Name of function. Must be UNIQUE on a per-environment basis.
        displayName:
          type: string
          description: Display name of function. Human-readable name to help you identify the function.
        tags:
          type: array
          items:
            type: string
          description: Array of tags to categorize and organize functions.
        type:
          type: string
          enum:
            - render
        renderConfig:
          $ref: '#/components/schemas/RenderConfigInput'
      title: Render Function
    UpsertSendFunction:
      type: object
      required:
        - type
      properties:
        functionName:
          type: string
          description: Name of function. Must be UNIQUE on a per-environment basis.
        displayName:
          type: string
          description: Display name of function. Human-readable name to help you identify the function.
        tags:
          type: array
          items:
            type: string
          description: Array of tags to categorize and organize functions.
        type:
          type: string
          enum:
            - send
        destinationType:
          allOf:
            - $ref: '#/components/schemas/SendDestinationType'
          description: Where the payload is delivered.
        webhookUrl:
          type: string
          description: Webhook URL to POST the payload to. Required when destinationType is webhook.
        webhookSigningEnabled:
          type: boolean
          description: |-
            Whether to sign webhook deliveries with an HMAC-SHA256 `bem-signature` header.
            Defaults to `true` when omitted — signing is on by default for new send functions.
            Set explicitly to `false` to disable.
        s3Bucket:
          type: string
          description: S3 bucket to upload the payload to. Required when destinationType is s3.
        s3Prefix:
          type: string
          description: Optional S3 key prefix (folder path).
        googleDriveFolderId:
          type: string
          description: Google Drive folder ID. Required when destinationType is google_drive. Managed via Paragon OAuth.
      title: Send Function
    UpsertSplitFunction:
      type: object
      required:
        - type
      properties:
        functionName:
          type: string
          description: Name of function. Must be UNIQUE on a per-environment basis.
        displayName:
          type: string
          description: Display name of function. Human-readable name to help you identify the function.
        tags:
          type: array
          items:
            type: string
          description: Array of tags to categorize and organize functions.
        splitType:
          type: string
          enum:
            - print_page
            - semantic_page
        printPageSplitConfig:
          type: object
          properties:
            nextFunctionID:
              type: string
            nextFunctionName:
              type: string
        semanticPageSplitConfig:
          type: object
          properties:
            itemClasses:
              type: array
              items:
                $ref: '#/components/schemas/SplitFunctionSemanticPageItemClass'
        type:
          type: string
          enum:
            - split
      title: Split Function
    UserActionSummary:
      type: object
      required:
        - userActionID
        - createdAt
      properties:
        userActionID:
          type: string
          description: Unique identifier of the user action.
        userID:
          type: string
          description: User's ID. Present for user-initiated actions.
        userEmail:
          type: string
          description: User's email address. Present for user-initiated actions.
        apiKeyName:
          type: string
          description: API key name. Present for API key-initiated actions.
        emailAddress:
          type: string
          description: Email address. Present for email-initiated actions.
        createdAt:
          type: string
          format: date-time
          description: The date and time the action was created.
    View:
      type: object
      required:
        - viewID
        - name
        - currentVersionNum
        - columns
        - filters
        - aggregations
        - functions
      properties:
        viewID:
          type: string
          description: Unique identifier of the view
        name:
          type: string
          description: Name of the view
        description:
          anyOf:
            - type: string
            - type: 'null'
          description: Description of the view
        currentVersionNum:
          type: integer
          description: Current version number of the view
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ViewColumn'
          description: List of columns in the view
        filters:
          type: array
          items:
            $ref: '#/components/schemas/ViewFilter'
          description: List of filters applied to the view
        aggregations:
          type: array
          items:
            $ref: '#/components/schemas/ViewAggregation'
          description: List of aggregations defined for the view
        functions:
          type: array
          items:
            $ref: '#/components/schemas/FunctionIdentifier'
          description: List of functions that this view queries transformations from
      description: >-
        A view is a table visualization of transformations that allows customers to have insight into their
        transformations
    ViewAggregation:
      type: object
      required:
        - name
        - function
      properties:
        name:
          type: string
          description: Name of the aggregation
        function:
          $ref: '#/components/schemas/ViewAggregationFunction'
        aggregateColumnName:
          anyOf:
            - type: string
            - type: 'null'
          description: Name of the column to aggregate (required for count_distinct, sum, average, min, max functions)
        groupByColumnName:
          anyOf:
            - type: string
            - type: 'null'
          description: Name of the column to group by (optional, for grouped aggregations)
        displayType:
          type: string
          enum:
            - table
            - bar_chart
            - pie_chart
          description: How to display the aggregation results
      description: An aggregation definition for a view
    ViewAggregationDataRequest:
      type: object
      required:
        - name
        - columns
        - filters
        - aggregations
        - functions
        - timeWindow
      properties:
        name:
          type: string
          description: Name of the view
        description:
          type: string
          description: Description of the view
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ViewColumn'
          description: List of columns in the view
        filters:
          type: array
          items:
            $ref: '#/components/schemas/ViewFilter'
          description: List of filters applied to the view
        aggregations:
          type: array
          items:
            $ref: '#/components/schemas/ViewAggregation'
          description: List of aggregations defined for the view
        functions:
          type: array
          items:
            $ref: '#/components/schemas/FunctionIdentifier'
          description: List of functions that this view queries transformations from
        timeWindow:
          $ref: '#/components/schemas/TimeWindow'
    ViewAggregationDataResponse:
      type: object
      required:
        - aggregations
      properties:
        aggregations:
          type: array
          items:
            $ref: '#/components/schemas/ViewAggregationDataResponseAggregation'
          description: Array of aggregation results
      description: Response containing aggregation data for a view
    ViewAggregationDataResponseAggregation:
      type: object
      required:
        - name
        - groups
      properties:
        name:
          type: string
          description: Name of the aggregation
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ViewAggregationDataResponseGroup'
          description: Array of group results (single group for non-grouped aggregations)
      description: Aggregation result for a single aggregation definition
    ViewAggregationDataResponseGroup:
      type: object
      required:
        - groupName
        - value
      properties:
        groupName:
          type: string
          description: Name of the group (empty string for non-grouped aggregations)
        value:
          type: number
          format: float
          description: Aggregated value for this group
      description: A single group result in an aggregation response
    ViewAggregationFunction:
      type: string
      enum:
        - count
        - count_distinct
        - sum
        - average
        - min
        - max
      description: Aggregation function to apply to a view column
    ViewColumn:
      type: object
      required:
        - name
        - valueSchemaPath
        - displayOrderIndex
      properties:
        name:
          type: string
          description: Name of the column
        valueSchemaPath:
          type: array
          items:
            type: string
          description: >-
            JSON path to the value in the transformation output schema (e.g., ["invoiceDetails",
            "invoiceNumber"])
        displayOrderIndex:
          type: integer
          description: Order in which this column should be displayed (0-based index)
      description: A column definition in a view
    ViewCreateRequest:
      type: object
      required:
        - name
        - columns
        - filters
        - aggregations
        - functions
      properties:
        name:
          type: string
          description: Name of the view
        description:
          type: string
          description: Description of the view
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ViewColumn'
          description: List of columns in the view
        filters:
          type: array
          items:
            $ref: '#/components/schemas/ViewFilter'
          description: List of filters applied to the view
        aggregations:
          type: array
          items:
            $ref: '#/components/schemas/ViewAggregation'
          description: List of aggregations defined for the view
        functions:
          type: array
          items:
            $ref: '#/components/schemas/FunctionIdentifier'
          description: List of functions that this view queries transformations from
      description: Request to create a new view or update an existing view
    ViewFilter:
      type: object
      required:
        - columnName
        - filterType
      properties:
        columnName:
          type: string
          description: Name of the column to filter on
        filterType:
          $ref: '#/components/schemas/ViewFilterType'
        string:
          anyOf:
            - type: string
            - type: 'null'
          description: String value for the filter (required for string filter types)
        number:
          anyOf:
            - type: number
              format: float
            - type: 'null'
          description: Numeric value for the filter (required for number filter types)
      description: A filter to apply to a view column
    ViewFilterType:
      type: string
      enum:
        - equals_string
        - equals_number
        - less_than_number
        - less_than_equal_number
        - greater_than_number
        - greater_than_equal_number
        - is_null
        - is_not_null
      description: Type of filter to apply to a view column
    ViewTableDataRequest:
      type: object
      required:
        - name
        - columns
        - filters
        - aggregations
        - functions
        - timeWindow
      properties:
        name:
          type: string
          description: Name of the view
        description:
          type: string
          description: Description of the view
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ViewColumn'
          description: List of columns in the view
        filters:
          type: array
          items:
            $ref: '#/components/schemas/ViewFilter'
          description: List of filters applied to the view
        aggregations:
          type: array
          items:
            $ref: '#/components/schemas/ViewAggregation'
          description: List of aggregations defined for the view
        functions:
          type: array
          items:
            $ref: '#/components/schemas/FunctionIdentifier'
          description: List of functions that this view queries transformations from
        timeWindow:
          $ref: '#/components/schemas/TimeWindow'
        limit:
          anyOf:
            - type: integer
            - type: 'null'
          minimum: 1
          maximum: 200
          description: 'Maximum number of rows to return (default: 50, max: 200)'
        offset:
          anyOf:
            - type: integer
            - type: 'null'
          minimum: 0
          description: Number of rows to skip for pagination
    ViewTableDataResponse:
      type: object
      required:
        - rows
        - totalCount
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ViewTableDataResponseRow'
          description: Array of rows matching the view configuration
        totalCount:
          type: integer
          description: Total number of rows matching the view (before pagination)
      description: Response containing paginated view table data
    ViewTableDataResponseColumnEntry:
      type: object
      required:
        - columnName
        - value
      properties:
        columnName:
          type: string
          description: Name of the column
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - {}
            - type: object
              unevaluatedProperties: {}
            - type: array
              items: {}
          description: Value of the column (can be any JSON type)
      description: A single column entry in a view table data row
    ViewTableDataResponseRow:
      type: object
      required:
        - columns
        - eventID
      properties:
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ViewTableDataResponseColumnEntry'
          description: Column entries for this row
        eventID:
          type: string
          description: |-
            Externally-stable KSUID of the event whose underlying
            transformation produced this row.
      description: A single row in the view table data response
    WebhookSecret:
      type: object
      required:
        - secret
      properties:
        secret:
          type: string
          description: The signing secret value. Store this securely — it is shown in full only on generation.
      description: Webhook signing secret used to verify `bem-signature` headers on delivered webhooks.
    WorkflowAudit:
      type: object
      properties:
        workflowCreatedBy:
          allOf:
            - $ref: '#/components/schemas/UserActionSummary'
          description: Information about who created the workflow.
        workflowLastUpdatedBy:
          allOf:
            - $ref: '#/components/schemas/UserActionSummary'
          description: Information about who last updated the workflow.
        versionCreatedBy:
          allOf:
            - $ref: '#/components/schemas/UserActionSummary'
          description: Information about who created the current version.
    WorkflowCallJsonBody:
      type: object
      required:
        - input
      properties:
        callReferenceID:
          type: string
          description: Your reference ID for tracking this call.
        metadata:
          type: object
          unevaluatedProperties: {}
          description: |-
            Arbitrary JSON object attached to this call. Stored on the call record and injected
            into `transformedContent` under the reserved `_metadata` key (alongside `referenceID`).
            Must be a JSON object. Maximum size: 4 KB.
        input:
          allOf:
            - $ref: '#/components/schemas/FunctionCallCreateInput'
          description: |-
            Input file(s) for the workflow. Use nested flags to specify a single file or
            batch:

            Single file: `--input.single-file '{"inputContent": "@file.pdf", "inputType": "pdf"}'`
            Batch files: `--input.batch-files '{"inputs": [{"inputContent": "@a.pdf", "inputType": "pdf"}]}'`

            The `@path/to/file` syntax reads and base64-encodes the file automatically.
            Provide exactly one of `singleFile` or `batchFiles`.
        bucket:
          type: string
          description: |-
            Optional bucket NAME that entities extracted by the workflow's parse
            function(s) land in. Resolution precedence: this call-level bucket >
            the parse function's configured `defaultBucket` > the account+environment
            default bucket. A non-existent bucket name returns 400, but only when the
            workflow contains a parse function; on a parse-free workflow it is ignored.
      description: JSON request body for POST /v3/workflows/{workflowName}/call.
    WorkflowCallMultipartFormData:
      type: object
      properties:
        callReferenceID:
          type: string
          description: Your reference ID for tracking this call.
        wait:
          type: string
          description: |-
            Block until the call completes (up to 30 seconds) and return the finished
            call object. Default: `false`. This is a boolean flag — use `--wait` or
            `--wait=true`, not `--wait true`.
        metadata:
          type: string
          description: |-
            Arbitrary JSON object (serialized as a string) attached to this call. Stored on
            the call record and injected into `transformedContent` under the reserved `_metadata`
            key (alongside `referenceID`). Must be a valid JSON object string. Maximum size: 4 KB.

            Example: `{"customer_id": "cust_123", "test_flag": true}`
        file:
          description: Single input file (for extract, classify, and split functions).
        files:
          type: array
          items: {}
          description: Multiple input files (for join functions).
      required: []
    WorkflowConnector:
      type: object
      required:
        - connectorID
        - name
        - type
      properties:
        connectorID:
          type: string
          description: Unique connector API ID.
        name:
          type: string
          description: Human-friendly connector name.
        type:
          allOf:
            - $ref: '#/components/schemas/WorkflowConnectorType'
          description: Connector type.
        paragon:
          allOf:
            - $ref: '#/components/schemas/ParagonConnectorConfig'
          description: Paragon configuration. Present iff `type == "paragon"`.
      description: A connector attached to a workflow. Ingestion point that triggers the workflow.
    WorkflowConnectorError:
      type: object
      required:
        - operation
        - message
        - code
      properties:
        connectorID:
          type: string
          description: Populated for update/delete failures.
        name:
          type: string
          description: Populated for create failures.
        operation:
          type: string
          enum:
            - create
            - update
            - delete
          description: Which diff operation was attempted.
        message:
          type: string
          description: Human-readable error message.
        code:
          type: string
          description: Machine-readable error code.
      description: Per-connector failure surfaced alongside a successful workflow DAG save.
    WorkflowConnectorRequest:
      type: object
      required:
        - name
        - type
      properties:
        connectorID:
          type: string
          description: Present → update. Absent → create.
        name:
          type: string
          description: Human-friendly connector name.
        type:
          allOf:
            - $ref: '#/components/schemas/WorkflowConnectorType'
          description: Connector type. Must match stored type on update.
        paragon:
          allOf:
            - $ref: '#/components/schemas/ParagonConnectorRequestConfig'
          description: 'Paragon configuration. Required on create for `type: "paragon"`.'
      description: Create/update entry for a connector inline with the workflow.
    WorkflowConnectorType:
      type: string
      enum:
        - paragon
      description: Discriminator for a workflow connector. V3 supports `paragon` only.
    WorkflowCopyRequest:
      type: object
      required:
        - sourceWorkflowName
        - targetWorkflowName
      properties:
        sourceWorkflowName:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-zA-Z0-9_-]{1,128}$
          description: Name of the source workflow to copy from.
        sourceWorkflowVersionNum:
          type: integer
          minimum: 1
          description: >-
            Optional version number of the source workflow to copy. If not provided, copies the current
            version.
        targetEnvironment:
          type: string
          description: >-
            Optional target environment name. If provided, copies the workflow to a different environment.
            When copying to a different environment, all functions used in the workflow will also be copied.
        targetWorkflowName:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-zA-Z0-9_-]{1,128}$
          description: Name for the new copied workflow. Must be unique within the target environment.
        targetDisplayName:
          type: string
          description: >-
            Optional display name for the copied workflow. If not provided, uses the source workflow's display
            name with " (Copy)" appended.
        tags:
          type: array
          items:
            type: string
          description: Optional tags for the copied workflow. If not provided, uses the source workflow's tags.
    WorkflowCopyResponseV3:
      type: object
      properties:
        environment:
          type: string
          description: The environment the workflow was copied to.
        workflow:
          allOf:
            - $ref: '#/components/schemas/WorkflowV3'
          description: The newly created workflow.
        copiedFunctions:
          type: array
          items:
            $ref: '#/components/schemas/CopiedFunctionInfo'
          description: |-
            Functions that were copied when copying to a different environment.
            Empty when copying within the same environment.
        error:
          type: string
          description: Error message if the workflow copy failed.
    WorkflowCreateRequestV3:
      type: object
      required:
        - name
        - mainNodeName
        - nodes
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-zA-Z0-9_-]{1,128}$
          description: Unique name for the workflow. Must match `^[a-zA-Z0-9_-]{1,128}$`.
        displayName:
          type: string
          description: Human-readable display name.
        tags:
          type: array
          items:
            type: string
          description: Tags to categorize and organize the workflow.
        mainNodeName:
          type: string
          description: Name of the entry-point node. Must not be a destination of any edge.
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowNodeRequest'
          minItems: 1
          description: Call-site nodes in the DAG. At least one is required.
        edges:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowEdgeRequest'
          description: Directed edges between nodes. Omit or leave empty for single-node workflows.
        connectors:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowConnectorRequest'
          description: |-
            Connectors to attach to the workflow at creation. If any entry fails to
            provision, the entire workflow creation is rolled back.
    WorkflowEdgeRequest:
      type: object
      required:
        - sourceNodeName
        - destinationNodeName
      properties:
        sourceNodeName:
          type: string
          description: Name of the source node.
        destinationName:
          type: string
          description: |-
            Labelled outlet on the source node that activates this edge.
            Omit for the default (unlabelled) outlet.
        destinationNodeName:
          type: string
          description: Name of the destination node.
        metadata:
          type: object
          unevaluatedProperties: {}
          description: |-
            Opaque free-form JSON object attached to this edge. Stored and returned
            verbatim; the server does not interpret it.
      description: A directed edge between two named call-site nodes.
    WorkflowEdgeResponse:
      type: object
      required:
        - sourceNodeName
        - destinationNodeName
      properties:
        sourceNodeName:
          type: string
          description: Name of the source node.
        destinationName:
          type: string
          description: Labelled outlet on the source node, if any.
        destinationNodeName:
          type: string
          description: Name of the destination node.
        metadata:
          type: object
          unevaluatedProperties: {}
          description: |-
            Opaque free-form JSON object attached to this edge on create/update.
            Returned verbatim; never interpreted by the server.
      description: Read representation of a directed edge between call-site nodes.
    WorkflowNodeRequest:
      type: object
      required:
        - function
      properties:
        name:
          type: string
          description: |-
            Name for this call site. Must be unique within the workflow version.
            Defaults to the function's own name when omitted.
        function:
          allOf:
            - $ref: '#/components/schemas/FunctionVersionIdentifier'
          description: The function (and version) to execute at this call site.
        metadata:
          type: object
          unevaluatedProperties: {}
          description: |-
            Opaque free-form JSON object attached to this node. Stored and returned
            verbatim; the server does not interpret it. Intended for client-side
            concerns such as canvas display properties (position, color, collapsed
            state, etc.).
      description: A single function call-site node in a workflow DAG.
    WorkflowNodeResponse:
      type: object
      required:
        - name
        - function
      properties:
        name:
          type: string
          description: Name of this call site, unique within the workflow version.
        function:
          allOf:
            - $ref: '#/components/schemas/FunctionVersionIdentifier'
          description: Function (and version) executing at this call site.
        metadata:
          type: object
          unevaluatedProperties: {}
          description: |-
            Opaque free-form JSON object attached to this node on create/update.
            Returned verbatim; never interpreted by the server.
      description: Read representation of a call-site node.
    WorkflowUpdateRequestV3:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-zA-Z0-9_-]{1,128}$
          description: New name for the workflow (renames it). Must match `^[a-zA-Z0-9_-]{1,128}$`.
        displayName:
          type: string
          description: Human-readable display name.
        tags:
          type: array
          items:
            type: string
          description: Tags to categorize and organize the workflow.
        mainNodeName:
          type: string
          description: |-
            `mainNodeName`, `nodes`, and `edges` must be provided together to update the DAG
            topology. If none are provided the topology is copied unchanged from the current
            version.
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowNodeRequest'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowEdgeRequest'
        connectors:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowConnectorRequest'
          description: |-
            Declarative, full-desired-state array of connectors. If omitted, existing
            connectors are left unchanged. If provided, it replaces the current set:
            entries with `connectorID` are updates, entries without are creates, and
            existing connectors whose `connectorID` is absent are deleted.
    WorkflowUsageInfo:
      type: object
      required:
        - workflowID
        - workflowName
        - currentVersionNum
        - usedInWorkflowVersionNums
      properties:
        workflowID:
          type: string
          description: Unique identifier of workflow.
        workflowName:
          type: string
          description: Name of workflow.
        currentVersionNum:
          type: integer
          description: >-
            Current version number of workflow, provided for reference - compare to usedInWorkflowVersionNums
            to see whether the current version of the workflow uses this function version.
        usedInWorkflowVersionNums:
          type: array
          items:
            type: integer
          description: Version numbers of workflows that this function version is used in.
    WorkflowV3:
      type: object
      required:
        - id
        - name
        - versionNum
        - mainNodeName
        - nodes
        - edges
        - connectors
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Unique identifier of the workflow.
        name:
          type: string
          description: Unique name of the workflow within the environment.
        versionNum:
          type: integer
          description: Version number of this workflow version.
        displayName:
          type: string
          description: Human-readable display name.
        emailAddress:
          type: string
          description: Inbound email address associated with the workflow, if any.
        tags:
          type: array
          items:
            type: string
          description: Tags associated with the workflow.
        mainNodeName:
          type: string
          description: Name of the entry-point call-site node.
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowNodeResponse'
          description: All call-site nodes in this workflow version's DAG.
        edges:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowEdgeResponse'
          description: All directed edges in this workflow version's DAG.
        connectors:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowConnector'
          description: |-
            Connectors currently attached to this workflow. For version-scoped reads
            (`/versions/{n}`) this is always empty — connectors are current-state and
            not part of version history.
        createdAt:
          type: string
          format: date-time
          description: The date and time the workflow was created.
        updatedAt:
          type: string
          format: date-time
          description: The date and time the workflow was last updated.
        audit:
          allOf:
            - $ref: '#/components/schemas/WorkflowAudit'
          description: Audit trail information.
      description: V3 read representation of a workflow version.
    WorkflowV3CreateResponse:
      type: object
      properties:
        workflow:
          $ref: '#/components/schemas/WorkflowV3'
        error:
          type: string
          description: Error message if the workflow creation failed.
        connectorErrors:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowConnectorError'
          description: |-
            Per-connector failures from the diff/apply phase. Empty or omitted when all
            operations succeeded.
    WorkflowV3GetResponse:
      type: object
      properties:
        workflow:
          $ref: '#/components/schemas/WorkflowV3'
        error:
          type: string
          description: Error message if the workflow retrieval failed.
    WorkflowV3UpdateResponse:
      type: object
      properties:
        workflow:
          $ref: '#/components/schemas/WorkflowV3'
        error:
          type: string
          description: Error message if the workflow update failed.
        connectorErrors:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowConnectorError'
          description: |-
            Per-connector failures from the diff/apply phase. Empty or omitted when all
            operations succeeded.
    WorkflowsListResponseV3:
      type: object
      properties:
        workflows:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowV3'
        totalCount:
          type: integer
          description: The total number of results available.
        error:
          type: string
          description: Error message if the workflow listing failed.
    XrefHit:
      type: object
      required:
        - referenceID
        - page
        - sectionContent
        - surface
      properties:
        referenceID:
          type: string
        functionName:
          type: string
        page:
          type: integer
        sectionLabel:
          type: string
        sectionType:
          type: string
        sectionContent:
          type: string
        surface:
          type: string
      description: |-
        One section across the corpus where an entity is mentioned, returned
        by `op=xref`. Combines the mention's location with the actual section
        content so an agent reads surrounding context in one round trip
        instead of cat'ing each doc separately.
    applyBaselineCorrectionsRequest:
      type: object
      required:
        - functionName
        - baselineVersionNum
        - comparisonVersionNum
      properties:
        functionName:
          type: string
          pattern: ^[a-zA-Z0-9_-]+$
          description: |-
            **Name of the function to apply corrections for**

            Must be an existing function with both baseline and regression transformation data.
        baselineVersionNum:
          type: integer
          minimum: 1
          description: |-
            **Baseline version number (source of corrected data)**

            The function version number that contains transformations with corrected JSON
            that should be copied to regression transformations.
        comparisonVersionNum:
          type: integer
          minimum: 1
          description: |-
            **Comparison version number (target for applying corrections)**

            The function version number of regression transformations that should
            receive the corrected JSON from the baseline version.
      description: |-
        **Request to apply baseline corrections to regression transformations**

        Specifies which function and versions to use for copying corrected JSON data
        from baseline transformations to their corresponding regression transformations.
    applyBaselineCorrectionsResponseV3:
      type: object
      required:
        - applied
        - appliedEventIDs
        - skipped
        - errors
      properties:
        applied:
          type: integer
          minimum: 0
          description: Number of corrections that were applied successfully.
        appliedEventIDs:
          type: array
          items:
            type: string
          description: |-
            Event KSUIDs whose underlying regression transformation had a
            baseline correction copied onto it.
        skipped:
          type: integer
          minimum: 0
          description: |-
            Number of regression transformations that were skipped — typically
            because they already had a correction or did not have a usable
            reference ID.
        errors:
          type: object
          unevaluatedProperties:
            type: string
          description: |-
            Map of event KSUID to error message for any regression rows where
            the correction could not be applied (e.g. baseline transformation
            not found for the row's reference ID).
      description: |-
        V3 response from applying baseline corrections to regression
        transformations. Identifiers are surfaced as event KSUIDs — the
        externally-stable IDs used everywhere else in V3 — in place of the
        internal transformation IDs returned by the V2 endpoint.
    collectionProcessingEvent:
      type: object
      required:
        - eventID
        - referenceID
        - collectionID
        - collectionName
        - operation
        - processedCount
        - status
      properties:
        functionCallTryNumber:
          type: integer
          description: The attempt number of the function call that created this event. 1 indexed.
        eventID:
          type: string
          description: Unique ID generated by bem to identify the event.
        createdAt:
          type: string
          format: date-time
          description: Timestamp indicating when the event was created.
        referenceID:
          type: string
          description: >-
            The unique ID you use internally to refer to this data point, propagated from the original
            function input.
        inboundEmail:
          allOf:
            - $ref: '#/components/schemas/EventInboundEmail'
          description: The inbound email that triggered this event.
        metadata:
          type: object
          properties:
            durationFunctionToEventSeconds:
              type: number
        eventType:
          type: string
          enum:
            - collection_processing
        collectionID:
          type: string
          description: Unique identifier of the collection.
        collectionName:
          type: string
          description: Name/path of the collection.
        operation:
          type: string
          enum:
            - add
            - update
          description: The operation performed (add or update).
        processedCount:
          type: integer
          description: Number of items successfully processed.
        collectionItemIDs:
          type: array
          items:
            type: string
          description: Array of collection item KSUIDs that were added or updated.
        status:
          type: string
          enum:
            - success
            - failed
          description: Processing status (success or failed).
        errorMessage:
          type: string
          description: Error message if processing failed.
      title: Collection Processing Event
    enrichConfig:
      type: object
      required:
        - steps
      properties:
        steps:
          type: array
          items:
            $ref: '#/components/schemas/enrichStep'
          minItems: 1
          description: Array of enrichment steps to execute sequentially.
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/enrichEndpoint'
          description: |-
            Named HTTP endpoints available to endpoint-source steps.
            Each endpoint must have a unique `name` referenced by the step's `endpointName`.
            Required when any step uses `source: "endpoint"`.
      description: |-
        Configuration for an enrich function.

        **How Enrich Functions Work:**

        Enrich functions augment JSON input with data from external sources. They take JSON input
        (typically from a previous function), extract specified fields, fetch or search for matching
        data, and inject the results back into the JSON.

        **Data Sources:**
        - **Collections** (`source: "collection"`): Vector/keyword search against a BEM collection.
        Best for semantic matching against pre-indexed documents.
        - **Endpoints** (`source: "endpoint"`): HTTP call to any user-provided REST API.
        Best for looking up live data from CRMs, ERPs, or other external systems.
        Optionally uses LLM agent reasoning to rank candidates returned by the endpoint.

        **Input Requirements:**
        - Must receive JSON input (typically from a previous function's output)

        **Example Use Cases:**
        - Match product descriptions to SKU codes from a product catalog collection
        - Enrich customer data with account details from a CRM endpoint
        - Use LLM agent reasoning to fuzzy-match line item descriptions to catalog products

        **Configuration:**
        - Define named endpoints (for endpoint-source steps)
        - Define one or more enrichment steps; steps are executed sequentially
    enrichEndpoint:
      type: object
      required:
        - name
        - url
        - method
      properties:
        name:
          type: string
          description: Unique name for this endpoint, referenced by enrichStep.endpointName.
        url:
          type: string
          description: Full URL of the endpoint (must be http:// or https://).
        method:
          type: string
          enum:
            - GET
            - POST
          description: HTTP method to use.
        headers:
          type: object
          unevaluatedProperties:
            type: string
          description: 'Additional HTTP headers to include in every request (e.g. `Authorization: Bearer <token>`).'
        queryParam:
          type: string
          description: >-
            Query parameter name used to pass the extracted source value.

            **Required for GET endpoints.** The value is URL-encoded and appended as
            `?{queryParam}={sourceValue}`.


            Example: `queryParam: "q"` → `GET /products?q=blue+widget`
        bodyTemplate:
          type: string
          description: |-
            JSON body template for POST requests.
            **Required for POST endpoints.** Must contain the `{value}` placeholder, which is replaced
            with the extracted source value at runtime.

            Example: `bodyTemplate: "{\"query\": \"{value}\", \"limit\": 10}"`
        responsePath:
          type: string
          description: |-
            JMESPath expression applied to the response body to extract the enrichment value.
            Omit to use the entire response body as the result.

            **For agent reasoning:** use a wildcard projection (e.g. `items[*]` or `results[*].data`)
            so the endpoint's list of candidates is flattened into an array before being passed to the LLM.
            A non-wildcard path (e.g. `data.product`) extracts a single value treated as one candidate.

            **Response size:** the platform reads at most 50 MB of the response body before decoding,
            regardless of the Content-Length header.
        matchInstructions:
          type: string
          description: |-
            Natural-language instructions for LLM agent reasoning.

            When set, the candidates fetched from the endpoint are passed to an LLM with these
            instructions, which selects the best match(es) and returns them with confidence scores.
            Each injected result has the shape `{ data, confidence, reasoning? }`.

            When omitted, the raw fetched value is injected without any LLM involvement.
        matchTopK:
          type: integer
          minimum: 1
          maximum: 100
          description: |-
            Maximum number of ranked matches to return per source value when `matchInstructions`
            is set (default: 1). Ignored when `matchInstructions` is empty.
          default: 1
        maxCandidates:
          type: integer
          minimum: 1
          description: |-
            LLM batch size during agent reasoning (default: 50). All candidates — across all
            fetched pages — are scored in batches of this size. Smaller values reduce per-call
            token usage; larger values mean fewer LLM calls. Ignored when `matchInstructions`
            is empty.
          default: 50
        nextPagePath:
          type: string
          description: |-
            JMESPath expression applied to each raw response to extract the cursor or token
            for the next page (e.g. `"nextCursor"`, `"pagination.nextToken"`). An absent,
            null, or empty-string result stops pagination. Both string and numeric values are
            supported — numbers are converted to their decimal string representation before
            being forwarded as a query parameter.

            Must be set together with `nextPageParam`.

            **Supported pagination styles:**
            - **Cursor/token-based** — server returns an opaque token in the response body
            (e.g. `{"nextCursor": "abc123"}`). Set `nextPagePath: "nextCursor"` and the
            platform forwards it verbatim on the next request.
            - **Server-computed offset/page** — server echoes back the next offset or page
            number in the response body (e.g. `{"nextOffset": 50}` or `{"nextPage": 2}`).
            Set `nextPagePath: "nextOffset"` and the platform forwards the value as-is.

            **Not supported:**
            - **Client-computed offset** — APIs where the client must compute `offset += limit`
            itself (e.g. `?offset=0&limit=50` with no next-offset in the response). Workaround:
            ask the API provider to return the next offset in the response body, or bake a
            fixed page size into the URL and use a server-side cursor instead.
            - **Client-computed page number** — APIs where the client increments `?page=N`
            itself with no next-page value in the response. Same workaround applies.
            - **Link header** — `Link: <url>; rel="next"` in HTTP response headers. The
            platform only inspects the response body.
        nextPageParam:
          type: string
          description: |-
            Query parameter name used to pass the cursor on subsequent GET requests, or the
            `{placeholder}` name used in the POST `bodyTemplate` (e.g. `"cursor"`,
            `"pageToken"`, `"offset"`).

            Must be set together with `nextPagePath`.
        maxPages:
          type: integer
          minimum: 1
          description: |-
            Maximum number of pages to fetch (default: 10). Acts as a safety cap against
            infinite pagination loops when the server never returns an empty cursor.
          default: 10
      description: |-
        A named HTTP endpoint that an enrich step can call to fetch enrichment data.

        The platform makes one request per extracted source value, substituting the value
        as a query parameter or body template placeholder. The raw response (or the
        sub-value selected by `responsePath`) is injected into the output, or passed to
        LLM agent reasoning when `matchInstructions` is set.

        **Request formats:**
        - `GET`: Appends `?{queryParam}={value}` to the URL.
        - `POST`: Sends `bodyTemplate` as the request body, replacing `{value}` with the extracted value.
    enrichStep:
      type: object
      required:
        - sourceField
        - targetField
      properties:
        source:
          type: string
          enum:
            - collection
            - endpoint
          description: >-
            Where to fetch enrichment data from (default: `"collection"`).


            - `"collection"`: Vector/keyword search against a BEM collection. Requires `collectionName`.

            - `"endpoint"`: HTTP call to a named endpoint defined in `enrichConfig.endpoints`. Requires
            `endpointName`.
          default: collection
        sourceField:
          type: string
          description: |-
            JMESPath expression to extract source data.
            Can extract a single value or an array. Each extracted value is looked up independently.
        collectionName:
          type: string
          description: |-
            Name of the collection to search against.
            Required when `source` is `"collection"`. The collection must exist and contain items.
            Supports hierarchical paths when used with `includeSubcollections`.
        endpointName:
          type: string
          description: |-
            Name of an endpoint defined in `enrichConfig.endpoints`.
            Required when `source` is `"endpoint"`.
        targetField:
          type: string
          description: |-
            Field path where enriched results should be placed.
            Use simple field names (e.g., "enriched_products").
            Results are always injected as an array (list), regardless of topK value.
        topK:
          type: integer
          minimum: 1
          maximum: 100
          description: |-
            Number of top matching results to return per query (default: 1).
            Results are always returned as an array (list) and automatically sorted by cosine distance
            (best match = lowest distance first).

            - 1: Returns array with single best match: `[{...}]`
            - >1: Returns array with multiple matches: `[{...}, {...}, ...]`
          default: 1
        searchMode:
          type: string
          enum:
            - semantic
            - exact
            - hybrid
          description: >-
            Search mode to use for enrichment (default: "semantic").


            **semantic**: Vector similarity search using dense embeddings. Best for finding conceptually
            similar items.

            - Use for: Product descriptions, natural language content

            - Example: "red sports car" matches "crimson convertible automobile"


            **exact**: Exact keyword matching using PostgreSQL text search. Best for exact identifiers.

            - Use for: SKU numbers, routing numbers, account IDs, exact tags

            - Example: "SKU-12345" only matches items containing that exact text


            **hybrid**: Combined search using 20% semantic + 80% sparse embeddings (keyword-based).

            - Use for: Tags, categories, partial identifiers

            - Example: Balances semantic meaning with exact keyword matching
          default: semantic
        scoreThreshold:
          type: number
          minimum: 0
          maximum: 2
          description: |-
            Maximum cosine distance threshold for filtering results (default: 0.6).
            Results with cosine distance above this threshold are excluded.

            **Only applies to `semantic` and `hybrid` search modes.**
            Exact search does not use cosine distance and ignores this setting.

            Cosine distance ranges from 0.0 (identical) to 2.0 (opposite):
            - 0.0 - 0.3: Very similar (strict threshold, high-quality matches only)
            - 0.3 - 0.6: Reasonably similar (moderate threshold)
            - 0.6 - 1.0: Loosely related (lenient threshold)
            - > 1.0: Rarely useful — allows nearly unrelated results

            For most semantic search use cases, good matches typically fall in the 0.2 - 0.5 range.
          default: 0.6
        includeScore:
          type: boolean
          description: |-
            Whether to include cosine distance scores in results.
            Cosine distance ranges from 0.0 (perfect match) to 2.0 (completely dissimilar).
            Lower scores indicate better semantic similarity.

            When enabled, each result includes a `cosine_distance` field (semantic mode)
            or a `hybrid_score` field (hybrid mode).
        includeSubcollections:
          type: boolean
          description: |-
            When true, searches all collections under the hierarchical path.
            For example, "customers" will match "customers", "customers.premium", etc.
      description: |-
        Single enrichment step configuration.

        **Process Flow (collection source):**
        1. Extract values from `sourceField` using JMESPath
        2. Perform search against the specified collection (semantic, exact, or hybrid based on `searchMode`)
        3. Return top K matches sorted by relevance (best match first)
        4. Inject results into `targetField`

        **Process Flow (endpoint source):**
        1. Extract values from `sourceField` using JMESPath
        2. Call the named endpoint once per extracted value, following pagination if
        `nextPagePath`/`nextPageParam` are configured on the endpoint
        3. Optionally apply LLM agent reasoning to rank candidates (`matchInstructions`),
        batching across all fetched pages in groups of `maxCandidates`
        4. Inject results into `targetField`

        **Collection Search Modes** (`source: "collection"` only):
        - `semantic` (default): Vector similarity search — best for natural language and conceptual matching
        - `exact`: Exact keyword matching — best for SKU numbers, IDs, routing numbers
        - `hybrid`: Combined semantic + keyword search — best for tags and categories

        **Result Format (collection source):**
        - Always an array sorted by relevance (best match first)
        - Each element: `{ data, cosineDistance? }` or `{ data, hybridScore? }`

        **Result Format (endpoint source, no matchInstructions):**
        - Always an array; the raw fetched value is the single element

        **Result Format (endpoint source, with matchInstructions):**
        - Array of LLM-ranked matches: `[{ data, confidence, reasoning? }, ...]`
        - Length capped by `enrichEndpoint.matchTopK` (default 1)
    fieldMetricsComparison:
      type: object
      required:
        - fieldPath
        - comparison
      properties:
        fieldPath:
          type: string
          description: JSON pointer path to the field
        comparison:
          $ref: '#/components/schemas/metricsComparison'
      description: Comparison of field-level metrics
    functionRegressionRequest:
      type: object
      required:
        - functionName
      properties:
        functionName:
          type: string
          pattern: ^[a-zA-Z0-9_-]+$
          description: |-
            **Name of the function to test for regressions**

            Must be an existing function with historical transformation data containing user corrections.
            The function must be currently active and callable.
        baselineVersionNum:
          type: integer
          minimum: 1
          description: |-
            **Function version number to use as baseline for comparison**

            - Defaults to `currentVersionNum - 1` (previous version)
            - Must be a valid, existing version number for the function
            - Used to retrieve historical transformation data for comparison
            - Cannot be the same as `comparisonVersionNum`
        comparisonVersionNum:
          type: integer
          minimum: 1
          description: |-
            **Function version number to test against the baseline**

            - Defaults to current version number (latest version)
            - Must be a valid, existing version number for the function
            - This version will be used to create new function calls for testing
            - Cannot be the same as `baselineVersionNum`
        sampleSize:
          type: integer
          minimum: 1
          maximum: 1000
          description: |-
            **Number of historical samples to test**

            - Defaults to 50 samples
            - Minimum: 1, Maximum: 1000
            - Only transformations with `correctedJSON` (user corrections) are eligible
            - Actual sample size may be smaller if insufficient corrected data exists
            - Larger samples provide more statistical confidence but take longer to process
          default: 50
        onlyCorrectedData:
          type: boolean
          description: |-
            **Whether to only test transformations with user corrections**

            - Defaults to `true` (recommended)
            - When `true`: Only uses transformations with `correctedJSON` as ground truth
            - When `false`: May include transformations without corrections (less reliable)
            - Corrected data provides the most accurate regression testing results
          default: true
      description: |-
        **Request parameters for function regression testing**

        Configures which function to test, sample size, and version comparison settings.
        All parameters except `functionName` are optional with sensible defaults.
    functionRegressionResponse:
      type: object
      required:
        - functionName
        - result
      properties:
        functionName:
          type: string
          description: |-
            **Name of the function being tested**

            Echoes back the function name from the request for confirmation.
        result:
          $ref: '#/components/schemas/functionRegressionResult'
      description: |-
        **Response from initiating a regression test**

        Contains the function call IDs created for async processing and tracking information.
        Use the returned function call IDs to monitor progress and retrieve results.
    functionRegressionResult:
      type: object
      required:
        - functionName
        - totalSamples
      properties:
        functionName:
          type: string
          description: |-
            **Name of the function being tested**

            The function for which regression testing was initiated.
        calls:
          type: array
          items:
            $ref: '#/components/schemas/regressionFunctionCall'
          description: |-
            **Calls created for regression testing**

            Each object contains the original reference ID and the new call ID created for testing.
            Use these call IDs with standard call endpoints to monitor progress:

            - `GET /v2/calls/{callID}` - Check individual status
            - `GET /v2/calls?referenceIDs=regression-*` - List all regression calls
        totalSamples:
          type: integer
          minimum: 0
          description: |-
            **Total number of samples being tested**

            This represents the number of historical transformations found with corrections
            that will be retested with the latest function version.
      description: |-
        **Detailed regression test results and tracking information**

        Contains function call IDs for monitoring progress. When all function calls complete,
        use the transformation endpoints to retrieve and analyze the actual results.
    functionVersionCompareRequest:
      type: object
      required:
        - functionName
      properties:
        functionName:
          type: string
          description: Name of the function to compare versions for
        baselineVersionNum:
          type: integer
          minimum: 1
          description: |-
            **Baseline version number for comparison**

            If not provided, defaults to the previous version (current - 1).
        comparisonVersionNum:
          type: integer
          minimum: 1
          description: |-
            **Comparison version number**

            If not provided, defaults to the current version.
        isRegression:
          type: boolean
          description: |-
            **Whether to compare regression test data only**

            If true, only compares transformations marked as regression tests.
      description: |-
        **Request to compare metrics between two function versions**

        Compares metrics from two versions of a function to show lift or regression.
    functionVersionCompareResponse:
      type: object
      required:
        - functionName
        - baselineVersionNum
        - comparisonVersionNum
      properties:
        functionName:
          type: string
          description: Name of the compared function
        baselineVersionNum:
          type: integer
          description: Baseline version number used for comparison
        comparisonVersionNum:
          type: integer
          description: Comparison version number
        baselineTransformationCount:
          type: integer
          description: Number of transformations used to calculate baseline metrics
        comparisonTransformationCount:
          type: integer
          description: Number of transformations used to calculate comparison metrics
        aggregateComparison:
          $ref: '#/components/schemas/metricsComparison'
        fieldMetricsChanges:
          type: array
          items:
            $ref: '#/components/schemas/fieldMetricsComparison'
          description: |-
            **Field-level metrics that changed significantly**

            Only includes fields where metrics changed by more than 1%.
        baselineMetrics:
          $ref: '#/components/schemas/MetricsDetails'
        comparisonMetrics:
          $ref: '#/components/schemas/MetricsDetails'
        message:
          type: string
          description: Optional message with additional details
      description: |-
        **Response containing metrics comparison between two function versions**

        Shows absolute differences, lift percentages, and field-level changes.
    metricComparison:
      type: object
      properties:
        baselineValue:
          anyOf:
            - type: number
            - type: 'null'
          description: Value in baseline version (null if not available)
        comparisonValue:
          anyOf:
            - type: number
            - type: 'null'
          description: Value in comparison version (null if not available)
        difference:
          anyOf:
            - type: number
            - type: 'null'
          description: Absolute difference (comparisonValue - baselineValue)
        liftPercent:
          anyOf:
            - type: number
            - type: 'null'
          description: |-
            **Percentage change from baseline to comparison**

            Formula: ((comparisonValue - baselineValue) / baselineValue) * 100

            - Positive values indicate improvement
            - Negative values indicate regression
      description: Comparison of a single metric between two versions
    metricsComparison:
      type: object
      properties:
        accuracy:
          $ref: '#/components/schemas/metricComparison'
        precision:
          $ref: '#/components/schemas/metricComparison'
        recall:
          $ref: '#/components/schemas/metricComparison'
        f1Score:
          $ref: '#/components/schemas/metricComparison'
      description: Comparison of metrics between two versions
    regressionFunctionCall:
      type: object
      required:
        - originalReferenceID
        - callID
      properties:
        originalReferenceID:
          type: string
          pattern: ^[a-zA-Z0-9_-]+$
          description: >-
            **Original reference ID from historical transformation data**


            This is the reference ID that was used when the historical transformation was originally created.

            It provides traceability back to the original business context (e.g., invoice number, document
            ID).
        callID:
          type: string
          pattern: ^wc_[a-zA-Z0-9]+$
          description: |-
            **New call ID created for regression testing**

            Use this ID with standard call endpoints:
            - `GET /v2/calls/{callID}` - Check status and retrieve results
            - The call will have reference ID matching the original transformation
      description: |-
        **Call created for regression testing**

        Links the original historical reference ID to the new call ID created for testing.
        Use the call ID with standard call endpoints to monitor progress and retrieve results.
  securitySchemes:
    API Key:
      type: apiKey
      in: header
      name: x-api-key
      description: Authenticate using API Key in request header
servers:
  - url: https://api.bem.ai
    description: US Region API
    variables: {}
  - url: https://api.eu1.bem.ai
    description: EU Region API
    variables: {}
webhooks:
  extract:
    post:
      summary: Extract event
      description: >-
        Delivered when an `extract` function completes processing of a document and produces structured JSON.
        The body's `transformedContent` matches the function's `outputSchema`.


        For signing-secret setup and retry semantics that apply to every variant, see the [Webhooks
        overview](/api/v3/webhooks).
      tags:
        - Webhooks
      operationId: extract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractEvent'
      responses:
        2XX:
          description: Return any 2XX status code to acknowledge receipt. The exact code is not inspected.
  classify:
    post:
      summary: Classify event
      description: >-
        Delivered when a `classify` function chooses a category for a document. The selected label is in
        `choice` and matches one of the function version's declared `classifications`.


        For signing-secret setup and retry semantics that apply to every variant, see the [Webhooks
        overview](/api/v3/webhooks).
      tags:
        - Webhooks
      operationId: classify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyEvent'
      responses:
        2XX:
          description: Return any 2XX status code to acknowledge receipt. The exact code is not inspected.
  parse:
    post:
      summary: Parse event
      description: >-
        Delivered when a `parse` function renders a document into a navigable structure of sections, entities,
        and relationships. The full parsed structure is in `transformedContent`.


        For signing-secret setup and retry semantics that apply to every variant, see the [Webhooks
        overview](/api/v3/webhooks).
      tags:
        - Webhooks
      operationId: parse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseEvent'
      responses:
        2XX:
          description: Return any 2XX status code to acknowledge receipt. The exact code is not inspected.
  split-collection:
    post:
      summary: Split collection event
      description: >-
        Delivered when a `split` function completes its collection-level pass and emits the list of items it
        found. Each item is fanned out to a downstream function as its own input.


        For signing-secret setup and retry semantics that apply to every variant, see the [Webhooks
        overview](/api/v3/webhooks).
      tags:
        - Webhooks
      operationId: split-collection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SplitCollectionEvent'
      responses:
        2XX:
          description: Return any 2XX status code to acknowledge receipt. The exact code is not inspected.
  split-item:
    post:
      summary: Split item event
      description: >-
        Delivered for each individual item produced by a `split` function. Carries the item's offset within
        its parent collection and a presigned URL to its bytes.


        For signing-secret setup and retry semantics that apply to every variant, see the [Webhooks
        overview](/api/v3/webhooks).
      tags:
        - Webhooks
      operationId: split-item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SplitItemEvent'
      responses:
        2XX:
          description: Return any 2XX status code to acknowledge receipt. The exact code is not inspected.
  join:
    post:
      summary: Join event
      description: >-
        Delivered when a `join` function combines outputs from multiple upstream calls into a single
        transformed payload.


        For signing-secret setup and retry semantics that apply to every variant, see the [Webhooks
        overview](/api/v3/webhooks).
      tags:
        - Webhooks
      operationId: join
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinEvent'
      responses:
        2XX:
          description: Return any 2XX status code to acknowledge receipt. The exact code is not inspected.
  enrich:
    post:
      summary: Enrich event
      description: >-
        Delivered when an `enrich` function augments an input payload with results from semantic search
        against a collection. The enriched payload is in `enrichedContent`.


        For signing-secret setup and retry semantics that apply to every variant, see the [Webhooks
        overview](/api/v3/webhooks).
      tags:
        - Webhooks
      operationId: enrich
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrichEvent'
      responses:
        2XX:
          description: Return any 2XX status code to acknowledge receipt. The exact code is not inspected.
  payload-shaping:
    post:
      summary: Payload shaping event
      description: >-
        Delivered when a `payload_shaping` function applies its JMESPath expressions to reshape an input
        payload. The reshaped result is in `transformedContent`.


        For signing-secret setup and retry semantics that apply to every variant, see the [Webhooks
        overview](/api/v3/webhooks).
      tags:
        - Webhooks
      operationId: payload-shaping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayloadShapingEvent'
      responses:
        2XX:
          description: Return any 2XX status code to acknowledge receipt. The exact code is not inspected.
  send:
    post:
      summary: Send event
      description: >-
        Delivered when a `send` function attempts to deliver a payload to a downstream destination (webhook,
        S3, or Google Drive). The result of that delivery — including the destination's response — is in the
        body. The original payload that was delivered is mirrored in `deliveredContent`.


        For signing-secret setup and retry semantics that apply to every variant, see the [Webhooks
        overview](/api/v3/webhooks).
      tags:
        - Webhooks
      operationId: send
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEvent'
      responses:
        2XX:
          description: Return any 2XX status code to acknowledge receipt. The exact code is not inspected.
  evaluation:
    post:
      summary: Evaluation event
      description: >-
        Delivered when a function-accuracy evaluation completes for a transformation. The evaluator's scores
        and per-field judgments are in `result`; check `status` for terminal success/failure.


        For signing-secret setup and retry semantics that apply to every variant, see the [Webhooks
        overview](/api/v3/webhooks).
      tags:
        - Webhooks
      operationId: evaluation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationEvent'
      responses:
        2XX:
          description: Return any 2XX status code to acknowledge receipt. The exact code is not inspected.
  collection-processing:
    post:
      summary: Collection processing event
      description: >-
        Delivered when a batch add or update against a Collection finishes. Reports how many items were
        processed and lists the IDs that were touched.


        For signing-secret setup and retry semantics that apply to every variant, see the [Webhooks
        overview](/api/v3/webhooks).
      tags:
        - Webhooks
      operationId: collection-processing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/collectionProcessingEvent'
      responses:
        2XX:
          description: Return any 2XX status code to acknowledge receipt. The exact code is not inspected.
  error:
    post:
      summary: Error event
      description: >-
        Delivered when a function call terminates with an error that's surfaceable to the customer. The
        user-facing failure reason is in `message`.


        For signing-secret setup and retry semantics that apply to every variant, see the [Webhooks
        overview](/api/v3/webhooks).
      tags:
        - Webhooks
      operationId: error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorEvent'
      responses:
        2XX:
          description: Return any 2XX status code to acknowledge receipt. The exact code is not inspected.
