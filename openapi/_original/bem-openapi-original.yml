    TriggerEvaluationsRequestV3:
      type: object
      required:
        - transformationIDs
      properties:
        transformationIDs:
          type: array
          items:
            type: string
          description: Transformation IDs to evaluate. Up to 100 per request.
        evaluationVersion:
          type: string
          description: |-
            Optional evaluation version (e.g. `0.1.0-gemini`). When omitted the
            server's default evaluation version is used.
      description: |-
        Request to queue evaluation jobs for a batch of transformations.

        Evaluations assess a transformation's output against the function's
        schema-defined ground truth signals (confidence, hallucination detection,
        relevance). Each transformation must belong to an event of a supported
        type: `extract`, `transform`, `analyze`, or `join`.
    TriggerEvaluationsResponseV3:
      type: object
      required:
        - queued
        - skipped
      properties:
        queued:
          type: integer
          description: Number of evaluation jobs newly queued.
        skipped:
          type: integer
          description: |-
            Number of transformations skipped because an evaluation job was already
            pending or already completed for them.
        errors:
          type: object
          unevaluatedProperties:
            type: string
          description: |-
            Map of transformation ID to human-readable error message for any
            transformations that could not be queued (e.g. not found, unsupported
            event type).
      description: |-
        Summary of the trigger call. Evaluations run asynchronously; use
        `GET /v3/eval/results` to poll for results.
    UpdateCollectionItemsRequestV3:
      type: object
      required:
        - collectionName
        - items
      properties:
        collectionName:
          type: string
          description: |-
            The name/path of the collection. Must use only letters, digits, underscores, and dots.
            Each segment must start with a letter or underscore.
        items:
          type: array
          items:
            $ref: '#/components/schemas/CollectionItemUpdateV3'
          minItems: 1
          maxItems: 100
          description: Array of items to update (maximum 100 items per request)
      description: Request to update existing items in a collection
    UpdateCollectionItemsResponseV3:
      type: object
      required:
        - status
        - message
        - eventID
      properties:
        status:
          type: string
          enum:
            - pending
          description: Processing status
        message:
          type: string
          description: Status message
        eventID:
          type: string
          description: Event ID for tracking this operation. Use this to correlate with webhook notifications.
        updatedCount:
          type: integer
          description: Number of items updated (only present in synchronous mode, deprecated)
        items:
          type: array
          items:
            $ref: '#/components/schemas/CollectionItemV3'
          description: Array of items that were updated (only present in synchronous mode, deprecated)
      description: Response after queuing items for async update
    UpdateEntityRequestV3:
      type: object
      properties:
        status:
          type: string
          enum:
            - approved
            - rejected
          description: |-
            Transition the entity's curation status. Only `approved` or `rejected` are
            accepted, and only from `extracted` or `proposed` (any other transition is
            rejected with `409`).
        assignedTypeID:
          type: string
          description: |-
            The `ety_...` public ID of the type to assign (overriding the bem-inferred
            type). The empty string clears the assignment. Omit to leave unchanged.
        canonical:
          type: string
          description: Replace the entity's canonical surface form (re-derives its normalized form).
        addSynonyms:
          type: array
          items:
            type: string
          description: Surface forms to attach as `customer_defined` synonyms.
        removeSynonymIDs:
          type: array
          items:
            type: string
          description: |-
            `esn_...` synonym IDs to soft-delete. Only `customer_defined` /
            `sme_approved` synonyms may be removed; an `extracted` synonym is rejected
            with `409`.
        locale:
          type: string
          description: Optional BCP 47 locale tag stamped on any added synonyms.
      description: |-
        Request body for `PATCH /v3/entities/{id}`. Every field is optional, but at
        least one must be present.
    UpdateFunctionV3:
      type: object
      oneOf:
        - $ref: '#/components/schemas/UpsertExtractFunction'
        - $ref: '#/components/schemas/UpsertClassifyFunction'
        - $ref: '#/components/schemas/UpsertSendFunction'
        - $ref: '#/components/schemas/UpsertSplitFunction'
        - $ref: '#/components/schemas/UpsertJoinFunction'
        - $ref: '#/components/schemas/UpsertPayloadShapingFunction'
        - $ref: '#/components/schemas/UpsertEnrichFunction'
        - $ref: '#/components/schemas/UpsertParseFunction'
        - $ref: '#/components/schemas/UpsertRenderFunction'
      discriminator:
        propertyName: type
        mapping:
          extract: '#/components/schemas/UpsertExtractFunction'
          classify: '#/components/schemas/UpsertClassifyFunction'
          send: '#/components/schemas/UpsertSendFunction'
          split: '#/components/schemas/UpsertSplitFunction'
          join: '#/components/schemas/UpsertJoinFunction'
          payload_shaping: '#/components/schemas/UpsertPayloadShapingFunction'
          enrich: '#/components/schemas/UpsertEnrichFunction'
          parse: '#/components/schemas/UpsertParseFunction'
          render: '#/components/schemas/UpsertRenderFunction'
    UpdateSubscriptionV3:
      type: object
