          type: string
          description: 'JMESPath expression that defines how to transform and customize the input payload structure.

            Payload shaping allows you to extract, reshape, and reorganize data from complex input payloads

            into a simplified, standardized output format. Use JMESPath syntax to select specific fields,

            perform calculations, and create new data structures tailored to your needs.'
      title: Payload Shaping Function
    ParseExtraFunctionConfiguration:
      type: object
      properties:
        enableBoundingBoxes:
          type: boolean
          description: 'When true, return per-section and per-entity-mention coordinates in

            the parse event''s `fieldBoundingBoxes` map (same shape as Extract:

            JSON Pointer key → array of `{page, left, top, width, height}` with

            coordinates normalized to [0, 1]). Keys are `/sections/{N}` and

            `/entities/{N}/occurrences/{M}` into the parse output. Only applies

            to the open-ended discovery path (no `schema`) and to vision input

            types. Bedrock-backed parse functions silently return an empty map

            (no native bbox support). Defaults to false.'
      description: 'Cross-cutting toggles for Parse functions. Mirrors the `extraConfig`

        surface on Extract / Join — separated from `parseConfig` so the per-call

        Parse output shape stays distinct from operator-level execution flags.'
    UpsertClassifyFunction:
      type: object
      required:
      - type
      properties:
        functionName:
          type: string
          description: Name of function. Must be UNIQUE on a per-environment basis.
        displayName:
          type: string
          description: Display name of function. Human-readable name to help you identify the function.
        tags:
          type: array
          items:
            type: string
          description: Array of tags to categorize and organize functions.
        type:
          type: string
          enum:
          - classify
        description:
          type: string
          description: Description of classifier. Can be used to provide additional context on classifier's purpose and expected inputs.
        classifications:
          $ref: '#/components/schemas/ClassificationList'
      description: 'V3 create/update variants of the shared function payloads.


        The V3 Functions API no longer accepts the legacy `transform` or `analyze`

        function types when creating new functions or updating existing ones — both

        have been unified under `extract`. Existing functions of those types remain

        readable and callable via V3, so the V3 read-side unions still include

        `transform` and `analyze` variants.


        The V3 API also exposes `classify` in place of the legacy `route` type on

        create/update, with `classifications` in place of `routes`. Read-side

        `ClassifyFunction` / `ClassifyFunctionVersion` / `ClassificationList` are

        defined in the shared functions models and used by both the V2 and V3

        response unions (existing classify functions are returned from V2 GET

        endpoints verbatim).V3 wire form of the classify function upsert payload.'
      title: Classify Function
    RenderTemplatePlaceholders:
      type: object
      required:
      - stringKeys
      - blockKeys
      properties:
        stringKeys:
          type: array
          items:
            type: string
        blockKeys:
          type: array
          items:
            type: string
      description: 'The placeholder contract a Render template declares, grouped by how each

        placeholder is filled. Derived from the template at create/update time by

        scanning its `docxtpl` tags; not user-supplied.


        - `stringKeys`: bare string placeholders (`{{ key }}`) filled with a single

        value.

        - `blockKeys`: wrapped-primitive placeholders (`{{p key }}`) — bind one core

        primitive (paragraph, table, image, or list). The placeholder''s own

        paragraph dissolves and is replaced by the rendered subdocument''s blocks,

        rather than substituting text inline.'
      title: Render template placeholder contract
