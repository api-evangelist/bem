    enrichStep:
      type: object
      required:
      - sourceField
      - targetField
      properties:
        source:
          type: string
          enum:
          - collection
          - endpoint
          description: 'Where to fetch enrichment data from (default: `"collection"`).


            - `"collection"`: Vector/keyword search against a BEM collection. Requires `collectionName`.

            - `"endpoint"`: HTTP call to a named endpoint defined in `enrichConfig.endpoints`. Requires `endpointName`.'
          default: collection
        sourceField:
          type: string
          description: 'JMESPath expression to extract source data.

            Can extract a single value or an array. Each extracted value is looked up independently.'
        collectionName:
          type: string
          description: 'Name of the collection to search against.

            Required when `source` is `"collection"`. The collection must exist and contain items.

            Supports hierarchical paths when used with `includeSubcollections`.'
        endpointName:
          type: string
          description: 'Name of an endpoint defined in `enrichConfig.endpoints`.

            Required when `source` is `"endpoint"`.'
        targetField:
          type: string
          description: 'Field path where enriched results should be placed.

            Use simple field names (e.g., "enriched_products").

            Results are always injected as an array (list), regardless of topK value.'
        topK:
          type: integer
          minimum: 1
          maximum: 100
          description: 'Number of top matching results to return per query (default: 1).

            Results are always returned as an array (list) and automatically sorted by cosine distance

            (best match = lowest distance first).


            - 1: Returns array with single best match: `[{...}]`

            - >1: Returns array with multiple matches: `[{...}, {...}, ...]`'
          default: 1
        searchMode:
          type: string
          enum:
          - semantic
          - exact
          - hybrid
          description: 'Search mode to use for enrichment (default: "semantic").


            **semantic**: Vector similarity search using dense embeddings. Best for finding conceptually similar items.

            - Use for: Product descriptions, natural language content

            - Example: "red sports car" matches "crimson convertible automobile"


            **exact**: Exact keyword matching using PostgreSQL text search. Best for exact identifiers.

            - Use for: SKU numbers, routing numbers, account IDs, exact tags

            - Example: "SKU-12345" only matches items containing that exact text


            **hybrid**: Combined search using 20% semantic + 80% sparse embeddings (keyword-based).

            - Use for: Tags, categories, partial identifiers

            - Example: Balances semantic meaning with exact keyword matching'
          default: semantic
        scoreThreshold:
          type: number
          minimum: 0
          maximum: 2
          description: 'Maximum cosine distance threshold for filtering results (default: 0.6).

            Results with cosine distance above this threshold are excluded.


            **Only applies to `semantic` and `hybrid` search modes.**

            Exact search does not use cosine distance and ignores this setting.


            Cosine distance ranges from 0.0 (identical) to 2.0 (opposite):

            - 0.0 - 0.3: Very similar (strict threshold, high-quality matches only)

            - 0.3 - 0.6: Reasonably similar (moderate threshold)

            - 0.6 - 1.0: Loosely related (lenient threshold)

            - > 1.0: Rarely useful — allows nearly unrelated results


            For most semantic search use cases, good matches typically fall in the 0.2 - 0.5 range.'
          default: 0.6
        includeScore:
          type: boolean
          description: 'Whether to include cosine distance scores in results.

            Cosine distance ranges from 0.0 (perfect match) to 2.0 (completely dissimilar).

            Lower scores indicate better semantic similarity.


            When enabled, each result includes a `cosine_distance` field (semantic mode)

            or a `hybrid_score` field (hybrid mode).'
        includeSubcollections:
          type: boolean
          description: 'When true, searches all collections under the hierarchical path.

            For example, "customers" will match "customers", "customers.premium", etc.'
      description: 'Single enrichment step configuration.


        **Process Flow (collection source):**

        1. Extract values from `sourceField` using JMESPath

        2. Perform search against the specified collection (semantic, exact, or hybrid based on `searchMode`)

        3. Return top K matches sorted by relevance (best match first)

        4. Inject results into `targetField`


        **Process Flow (endpoint source):**

        1. Extract values from `sourceField` using JMESPath

        2. Call the named endpoint once per extracted value, following pagination if

        `nextPagePath`/`nextPageParam` are configured on the endpoint

        3. Optionally apply LLM agent reasoning to rank candidates (`matchInstructions`),

        batching across all fetched pages in groups of `maxCandidates`

        4. Inject results into `targetField`


        **Collection Search Modes** (`source: "collection"` only):

        - `semantic` (default): Vector similarity search — best for natural language and conceptual matching

        - `exact`: Exact keyword matching — best for SKU numbers, IDs, routing numbers

        - `hybrid`: Combined semantic + keyword search — best for tags and categories


        **Result Format (collection source):**

        - Always an array sorted by relevance (best match first)

        - Each element: `{ data, cosineDistance? }` or `{ data, hybridScore? }`


        **Result Format (endpoint source, no matchInstructions):**

        - Always an array; the raw fetched value is the single element


        **Result Format (endpoint source, with matchInstructions):**

        - Array of LLM-ranked matches: `[{ data, confidence, reasoning? }, ...]`

        - Length capped by `enrichEndpoint.matchTopK` (default 1)'
