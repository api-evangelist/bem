aid: bem
name: Bem
description: >-
  Bem is the production layer for unstructured data. Its API turns inbound
  documents — PDFs, images, video, audio, and email — into structured JSON
  against a schema you define, using versioned, LLM-powered functions (extract,
  classify, parse, split, join, enrich, payload-shaping, and send) composed into
  reusable workflows. Bem automates document-heavy tasks such as invoice
  handling, claims adjudication, and data onboarding, with automatic schema
  inference, strict type enforcement, confidence scoring and drift detection,
  human-in-the-loop review, webhooks, and a knowledge graph. It offers US and EU
  regional endpoints, official SDKs, a CLI, a Terraform provider, and an MCP
  server, and is SOC 2 Type II, HIPAA, and GDPR compliant.
